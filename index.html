  "Clonazepam": { brand:"Klonopin / Rivotril", tags:["antiepileptic","anxiolytic","anticonvulsant"], desc:"Very potent, intermediate-long acting. First-line in epilepsy and panic disorder. Among the most potent and addictive benzodiazepines available.", mecanismo:"High-affinity GABA-A positive allosteric modulator. Greater selectivity for α2/α3 subtypes explains superior anxiolytic efficacy.", efectos_pos:["Powerful anxiolysis","Anticonvulsant","Panic disorder control","Acute mania stabilization"], efectos_neg:["High dependence potential","Severe withdrawal","Rapid tolerance development","Significant cognitive impairment","Depression"], efectos_neu:["Sleep quality changes","Altered emotional reactivity"], interacciones:"Synergistic with all CNS depressants. Avoid with opioids.", warning:"Despite medical use, carries very high addiction potential. Withdrawal after prolonged use can last months (PAWS)." },
  "Lorazepam": { brand:"Ativan", tags:["anxiolytic","pre-anesthetic","anticonvulsant"], desc:"Intermediate-acting benzodiazepine. Widely used in emergencies for seizures and acute agitation. No active metabolites, safer in liver failure.", mecanismo:"GABA-A positive allosteric modulator without active hepatic metabolites. Direct renal elimination, ideal in medically compromised patients.", efectos_pos:["Emergency seizure control","Acute anxiety relief","Pre-surgical sedation","Safe in hepatic failure"], efectos_neg:["Dependence","Anterograde amnesia","Respiratory depression at high doses","Paradoxical reactions"], efectos_neu:["Sedation","Anxiolysis","Reduced emotional reactivity"], interacciones:"Dangerous with opioids, alcohol and other CNS depressants. IV use requires respiratory monitoring.", warning:"IV preparations contain propylene glycol which can cause toxicity with repeated doses. Use lowest effective dose." },
  "Triazolam": { brand:"Halcion", tags:["hypnotic","sedative"], desc:"One of the shortest-acting benzodiazepines. Used exclusively as a hypnotic. Controversial due to reports of unusual behavior and amnesia.", mecanismo:"High-potency GABA-A positive allosteric modulator with ultra-short half-life (2-3h). Very rapid receptor binding and dissociation.", efectos_pos:["Rapid sleep induction","Short duration allows normal morning function","Minimal hangover"], efectos_neg:["Anterograde amnesia","Rebound insomnia","Paradoxical excitement","Sleepwalking and sleep-eating reports"], efectos_neu:["Sedation","Reduced anxiety","Altered dream patterns"], interacciones:"CYP3A4 metabolized — ketoconazole and erythromycin can dramatically increase levels. Dangerous with alcohol.", warning:"Withdrawn or restricted in several countries due to amnesia and behavioral disinhibition reports. Limit to 7-10 days maximum." },

  "Morfina": { brand:"MS Contin / Sevredol", tags:["analgesic","natural opioid","palliative"], desc:"Prototypical opioid derived from opium. Gold standard for severe pain. Widely used in palliative care and post-surgical pain. High addiction potential.", mecanismo:"Agonist at µ, κ and δ opioid receptors. Maximum affinity for µ-receptors, producing analgesia, euphoria and respiratory depression.", efectos_pos:["Powerful analgesia","Sedation","Anxiety relief","Palliative pain control"], efectos_neg:["Respiratory depression","Physical and psychological dependence","Severe constipation","Nausea/vomiting","Tolerance"], efectos_neu:["Miosis","Reduced bowel motility","Histamine release (itching)"], interacciones:"Lethal with benzodiazepines, alcohol and CNS depressants. MAOIs can cause serotonin syndrome. Naloxone reverses effects.", warning:"Narrow therapeutic window. Respiratory depression is the main cause of overdose death. Naloxone availability is essential." },
  "Fentanilo": { brand:"Duragesic / Actiq", tags:["potent analgesic","synthetic","anesthetic"], desc:"Synthetic opioid 100× more potent than morphine. Leading cause of overdose deaths in the US fentanyl crisis. Medical uses in anesthesia and severe pain.", mecanismo:"Highly selective µ-opioid receptor agonist. Rapid CNS penetration due to high lipophilicity. IV onset 1-2 min.", efectos_pos:["Extremely potent analgesia","Rapid onset","Anesthetic induction","Breakthrough cancer pain"], efectos_neg:["Respiratory depression at microgram doses","Extreme addiction","Chest wall rigidity","Lethal overdose at tiny amounts"], efectos_neu:["Euphoria","Miosis","Bradycardia"], interacciones:"Lethal with benzodiazepines (FDA black box warning). Any CNS depressant multiplies respiratory depression risk.", warning:"2mg = lethal dose for non-tolerant person. Street drugs frequently contaminated with fentanyl. Test strips essential." },
  "Oxicodona": { brand:"OxyContin / Percocet", tags:["analgesic","semi-synthetic","oral"], desc:"Widely prescribed semi-synthetic opioid. Central figure in the US opioid crisis — aggressive marketing by Purdue Pharma caused millions of addictions.", mecanismo:"µ and κ opioid receptor agonist. Oral bioavailability 60-87% (much higher than morphine). Active metabolite oxymorphone contributes to effects.", efectos_pos:["Effective oral analgesia","Moderate-severe pain control","Extended-release formulations for chronic pain"], efectos_neg:["High addiction potential","Withdrawal syndrome","Respiratory depression","IV abuse risk","Diversion risk"], efectos_neu:["Euphoria","Sedation","Constipation"], interacciones:"Dangerous with benzodiazepines, alcohol, CNS depressants. CYP3A4 and CYP2D6 metabolism.", warning:"Extended-release formulations designed to prevent tampering were bypassed by crushing, leading to thousands of deaths." },
  "Tramadol": { brand:"Ultram / Tramal", tags:["analgesic","atypical","serotonergic"], desc:"Atypical opioid with serotonergic and noradrenergic activity. Considered 'mild' but causes fatal seizures when combined with other serotonergic drugs.", mecanismo:"Weak µ-opioid agonist + serotonin/norepinephrine reuptake inhibitor. Active metabolite O-desmethyltramadol is 200× more potent.", efectos_pos:["Moderate analgesia","Better tolerability than classical opioids","Useful in neuropathic pain"], efectos_neg:["Seizures (lowered threshold)","Serotonin syndrome","Dependence (underestimated)","Nausea","Dizziness"], efectos_neu:["Mild euphoria","Sedation","Sweating"], interacciones:"Deadly with MAOIs (serotonin syndrome). Dangerous with SSRIs, SNRIs and serotonergic drugs.", warning:"Classified as 'mild opioid' but causes more deaths than many stronger opioids due to underestimated interactions. Never combine with MAOIs." },
  "Metadona": { brand:"Dolophine", tags:["substitution therapy","analgesic","long duration"], desc:"Very long-acting synthetic opioid. Used in maintenance programs for opioid dependence. Unpredictable pharmacokinetics make dosing challenging.", mecanismo:"µ-opioid receptor agonist with NMDA antagonist activity. Half-life 24-60h (extremely variable). Risk of plasma accumulation with repeated doses.", efectos_pos:["Opioid dependence treatment","Long-acting analgesia","Heroin cravings reduction","Prevents IV drug use"], efectos_neg:["QT prolongation (torsades de pointes)","Unpredictable accumulation","Respiratory depression risk days 2-4","Drug interactions"], efectos_neu:["Sedation","Constipation","Sweating"], interacciones:"Multiple CYP2B6, CYP3A4, CYP2D6 interactions. QT-prolonging drugs increase arrhythmia risk. Benzodiazepines are lethal.", warning:"Deaths frequently occur 2-4 days after initiating or increasing dose due to accumulation. Requires careful medical initiation." },

  "Anfetamina": { brand:"Adderall / Dexedrina", tags:["stimulant","ADHD","monoamine releaser"], desc:"Potent CNS stimulant. Medical use in ADHD and narcolepsy. High doses carry cardiovascular risk. One of the most abused prescription drugs.", mecanismo:"Reverses monoamine transporters (DAT, NET, SERT), massively releasing dopamine, norepinephrine and serotonin into the synapse.", efectos_pos:["Increased focus","Reduced fatigue","Mood elevation","ADHD symptom control","Narcolepsy management"], efectos_neg:["Cardiovascular risk","Psychosis at high doses","Severe dependence","Insomnia","Appetite suppression","Post-use crash"], efectos_neu:["Elevated heart rate","Increased blood pressure","Dilated pupils","Elevated temperature"], interacciones:"Fatal with MAOIs. Dangerous with other stimulants. Lithium may reduce amphetamine effects.", warning:"Abrupt cessation after heavy use causes severe depression ('crash'). Psychosis can persist weeks after stopping." },
  "Metilfenidato": { brand:"Ritalin / Concerta", tags:["stimulant","ADHD","DAT blocker"], desc:"First-line stimulant for ADHD in children and adults. Different mechanism from amphetamines (reuptake inhibitor, not releaser). Better tolerated.", mecanismo:"Dopamine and norepinephrine reuptake inhibitor (DAT/NET blocker). Unlike amphetamines, does not cause massive vesicular release.", efectos_pos:["ADHD symptom improvement","Sustained attention","Reduced hyperactivity/impulsivity","Better academic performance"], efectos_neg:["Appetite suppression","Insomnia","Growth effects in children (long-term)","Cardiovascular stress","Tic exacerbation"], efectos_neu:["Elevated heart rate","Reduced spontaneous play","Slight emotional dulling"], interacciones:"Dangerous with MAOIs. May increase anticoagulant plasma levels (warfarin). Careful with antihypertensives.", warning:"Diversion for recreational use is common. IV abuse of oral formulations causes serious vascular damage." },
  "Cocaína": { brand:"— (illegal)", tags:["stimulant","local anesthetic","alkaloid"], desc:"Alkaloid from the coca leaf. Potent stimulant with very brief duration. The only natural substance that is simultaneously a local anesthetic. Highly addictive.", mecanismo:"Blocks dopamine, norepinephrine and serotonin reuptake transporters. Only anesthetic that causes vasoconstriction (unlike synthetic anesthetics).", efectos_pos:["Intense euphoria (brief)","Energy boost","Confidence","Local anesthesia (medical ENT use)"], efectos_neg:["Heart attack and stroke risk","Severe psychological dependence","Nasal septum destruction","Paranoia","Post-use depression"], efectos_neu:["Vasoconstriction","Increased heart rate","Elevated temperature","Appetite suppression"], interacciones:"With alcohol produces cocaethylene (more cardiotoxic). With heroin ('speedball') — cause of multiple celebrity overdoses. MAOIs can be fatal.", warning:"Can cause sudden cardiac arrest even in first-time users with no prior heart disease. Risk increases with each use." },
  "MDMA": { brand:"Ecstasy / Molly", tags:["entactogen","stimulant","mild psychedelic"], desc:"Stimulant with entactogenic properties. Initially synthesized by Merck (1912), rediscovered by Shulgin. Approved clinical trials for PTSD therapy.", mecanismo:"Massively releases serotonin, dopamine and norepinephrine. Stimulates oxytocin release (explains pro-social effects). Reverses SERT.", efectos_pos:["Emotional openness","Empathy","Euphoria","Tactile enhancement","PTSD therapeutic potential"], efectos_neg:["Hyperthermia (life-threatening)","Severe serotonin depletion (days after)","Possible neurotoxicity","Hyponatremia from over-hydration","Comedown"], efectos_neu:["Jaw clenching","Pupil dilation","Elevated heart rate","Sweating"], interacciones:"Lethal with MAOIs. Dangerous with SSRIs/SNRIs (serotonin syndrome). Ritonavir increases MDMA plasma levels dramatically.", warning:"Most deaths from hyperthermia (overheating without adequate hydration) or hyponatremia (too much water). Temperature control is critical." },

  "LSD": { brand:"Acid / LSD-25", tags:["classic","ergoline","non-addictive"], desc:"Lysergic acid diethylamide. Synthesized in 1938 by Albert Hofmann. Most potent psychedelic by weight (active at 75-100 micrograms). Non-addictive.", mecanismo:"Partial agonist at serotonin 5-HT2A receptors. Also acts on dopamine D1/D2 and other 5-HT subtypes. Duration 8-12h.", efectos_pos:["Profound visual and auditory hallucinations","Mystical experiences","Increased creativity","Therapeutic potential for addiction and depression"], efectos_neg:["Bad trips (can be traumatic)","HPPD (flashbacks)","Anxiety and paranoia","Psychosis risk in predisposed"], efectos_neu:["Time distortion","Synesthesia","Ego dissolution at high doses","Altered meaning of thoughts"], interacciones:"Lithium combined with LSD has caused fatal seizures. Antipsychotics abort the trip. SSRIs reduce effects.", warning:"Psychosis risk in individuals with personal or family history of schizophrenia or bipolar disorder. Not physically dangerous but psychologically powerful." },
  "Psilocibina": { brand:"— (magic mushrooms)", tags:["natural","mushrooms","non-addictive"], desc:"Psychoactive compound in 200+ mushroom species. Converted to psilocin in the body. Growing medical interest for depression, addiction and end-of-life distress.", mecanismo:"Prodrug — converted to psilocin by liver alkaline phosphatase. Psilocin is a serotonin 5-HT2A receptor partial agonist.", efectos_pos:["Mystical experiences","Anti-depressant effects (clinical trials)","Increased openness","Dissolution of rigid thought patterns","Addiction treatment potential"], efectos_neg:["Anxiety and paranoia","Nausea","Psychosis risk in predisposed","Challenging experiences (bad trips)"], efectos_neu:["Time distortion","Synesthesia","Ego dissolution","Visual effects"], interacciones:"MAOIs increase and prolong effects (sometimes dangerously). Lithium contraindicated (seizures). SSRIs reduce intensity.", warning:"Physiologically very safe but psychologically powerful. Risk mainly psychological in predisposed individuals." },
  "DMT": { brand:"— / Ayahuasca (oral)", tags:["endogenous","fast-acting","potent"], desc:"N,N-Dimethyltryptamine. Naturally present in the human body. Smoked: most intense psychedelic experience known, lasting only 15-20 min ('breakthrough').", mecanismo:"Serotonin 5-HT2A receptor agonist. Also sigma-1 receptor activity. Metabolized by MAO within minutes — justifying oral use with MAOI in ayahuasca.", efectos_pos:["Intense mystical experiences","Entity contacts (at breakthrough doses)","Profound insight","Brief duration","Potential therapeutic value"], efectos_neg:["Overwhelming experience if unprepared","Extreme anxiety","Psychosis risk","Cardiovascular stress"], efectos_neu:["Complete perceptual dissolution","Geometry and entities","Sense of death and rebirth"], interacciones:"With MAOIs (ayahuasca): extends effects to 4-6h. Avoid with SSRIs. Contraindicated with antipsychotics.", warning:"Smoked DMT produces the most intense psychedelic experience known. Requires experienced supervision. Cardiovascular contraindications apply." },
  "Ketamina": { brand:"Ketalar / Spravato", tags:["dissociative","anesthetic","antidepressant"], desc:"Dissociative anesthetic with established medical use. FDA approved esketamine (Spravato) for treatment-resistant depression in 2019 — psychiatric landmark.", mecanismo:"Non-competitive NMDA receptor antagonist. Rapid antidepressant effects via mTOR pathway and BDNF. Opioid receptor effects at high doses.", efectos_pos:["Anesthesia","Rapid antidepressant effects","Treatment-resistant depression","Suicidal ideation reduction","Palliative analgesia"], efectos_neg:["K-hole (dissociative overdose)","Bladder damage with chronic use (ketamine cystitis)","Psychological dependence","Psychosis at high doses","Memory impairment"], efectos_neu:["Dissociation","Out-of-body experience","Analgesia","Sedation"], interacciones:"Dangerous with CNS depressants (respiratory depression). Avoid with stimulants (hypertension). MAOIs can cause dangerous interactions.", warning:"Recreational chronic use causes severe irreversible bladder damage requiring surgery in some cases. Damage is dose and frequency dependent." },

  "Fluoxetina": { brand:"Prozac", tags:["SSRI","antidepressant","anxiolytic"], desc:"First approved SSRI (1987). The most iconic antidepressant in modern history. Long half-life makes it most forgiving of missed doses and easiest to discontinue.", mecanismo:"Selective serotonin reuptake inhibitor (SERT blocker). Active metabolite norfluoxetine has half-life of 1-2 weeks.", efectos_pos:["Depression","Panic disorder","OCD","Bulimia nervosa","Premenstrual dysphoric disorder","PTSD"], efectos_neg:["Sexual dysfunction","Initial anxiety","Insomnia","Nausea","Weight changes (long-term)"], efectos_neu:["Emotional blunting","Apathy in some patients","Sleep architecture changes"], interacciones:"MAOIs: contraindicated (fatal serotonin syndrome). Potent CYP2D6 inhibitor. Tramadol interaction is dangerous.", warning:"2-4 week delay before therapeutic effect. Black box warning for increased suicidal ideation in under-25s at treatment initiation." },
  "Sertralina": { brand:"Zoloft / Besitran", tags:["SSRI","antidepressant","first-line"], desc:"First-line SSRI. Widely used for depression, GAD, OCD, PTSD and social phobia. One of the most prescribed psychiatric medications globally.", mecanismo:"Selective SERT inhibitor with moderate dopamine transporter inhibition. Fewer drug interactions than fluoxetine.", efectos_pos:["Depression","PTSD","OCD","Panic disorder","Social anxiety","Premenstrual dysphoric disorder"], efectos_neg:["Sexual dysfunction","Nausea","Diarrhea","Initial anxiety","Insomnia"], efectos_neu:["Mild emotional changes","Sleep architecture changes"], interacciones:"MAOIs: fatal contraindication. Caution with anticoagulants.", warning:"Do not stop abruptly — discontinuation syndrome (electric shocks, dizziness, flu-like symptoms). Always taper slowly." },
  "Venlafaxina": { brand:"Effexor / Vandral", tags:["SNRI","antidepressant","anxiolytic"], desc:"Serotonin and norepinephrine reuptake inhibitor. More powerful than SSRIs for severe depression. Significant discontinuation syndrome.", mecanismo:"Dual SERT/NET reuptake inhibitor. Norepinephrine reuptake inhibition predominates at higher doses (>150mg).", efectos_pos:["Severe depression","Generalized anxiety disorder","Panic disorder","Fibromyalgia","Neuropathic pain"], efectos_neg:["Severe discontinuation syndrome","Blood pressure increase","Sexual dysfunction","Sweating","Nausea"], efectos_neu:["Emotional normalization","Sleep changes"], interacciones:"MAOIs: absolutely contraindicated. Caution with tramadol (serotonin syndrome). Blood pressure monitoring recommended.", warning:"Considered the most difficult antidepressant to discontinue. Taper very slowly (weeks to months). Discontinuation syndrome can be severe." },
  "Amitriptilina": { brand:"Elavil / Tryptanol", tags:["tricyclic","antidepressant","analgesic"], desc:"Classic tricyclic antidepressant that predates SSRIs. Today more used for migraine prophylaxis, neuropathic pain, and insomnia than for depression.", mecanismo:"Serotonin and norepinephrine reuptake inhibitor + anticholinergic, antihistamine and sodium channel blocking activity.", efectos_pos:["Migraine prophylaxis","Neuropathic pain","Insomnia","Depression","Fibromyalgia"], efectos_neg:["Dry mouth","Constipation","Urinary retention","Weight gain","Blurred vision","Dangerous cardiac arrhythmias in overdose"], efectos_neu:["Sedation","Postural hypotension"], interacciones:"MAOIs: contraindicated. QT-prolonging drugs increase arrhythmia risk. Lethal in overdose (cardiac arrest).", warning:"In overdose causes fatal cardiac arrhythmias. Should not be prescribed to patients with suicide risk without close monitoring." },

  "THC": { brand:"Cannabis / Marinol", tags:["natural","psychoactive","CB1"], desc:"Tetrahydrocannabinol. Main psychoactive component of cannabis. Medical uses include pain, chemotherapy nausea and appetite stimulation.", mecanismo:"Partial agonist at CB1 receptors (CNS) and CB2 (immune system). Inhibits adenylyl cyclase and modulates multiple ion channels.", efectos_pos:["Pain relief","Anti-nausea (chemotherapy)","Appetite stimulation","Muscle relaxation","Anti-inflammatory"], efectos_neg:["Anxiety/paranoia (high doses)","Psychosis risk in predisposed","Amotivational syndrome (chronic use)","Memory impairment","Dependence (10% users)"], efectos_neu:["Altered time perception","Increased appetite","Dry mouth","Red eyes"], interacciones:"Potentiates CNS depressants. May reduce anticoagulant efficacy. Dangerous with high-risk cardiac conditions.", warning:"Psychosis risk significantly higher with high-potency products (>15% THC). Starting before age 16 doubles lifetime psychosis risk." },
  "CBN": { brand:"— (supplements)", tags:["cannabinoid","sedative","THC degradation"], desc:"Cannabinol. Degradation product of THC oxidation. Present in aged cannabis. Weaker psychoactive effects than THC. Used in sleep supplements.", mecanismo:"Weak partial CB1/CB2 agonist. Much lower affinity than THC. Possible synergy with other cannabinoids (entourage effect).", efectos_pos:["Mild sedation","Sleep aid","Antibacterial properties","Possible anti-inflammatory"], efectos_neg:["Mild psychoactive effects at high doses","Drowsiness","Limited human research"], efectos_neu:["Relaxation","Appetite stimulation (mild)"], interacciones:"Limited documented interactions. May potentiate CNS depressants.", warning:"Limited human clinical data. Most evidence from animal studies. Quality of unregulated supplements varies widely." },
  "CBG": { brand:"— (supplements)", tags:["cannabinoid","neuroprotective","anti-inflammatory"], desc:"Cannabigerol. The 'mother cannabinoid' — precursor of THC, CBD and CBC. Non-psychoactive. Anti-inflammatory and neuroprotective research interest.", mecanismo:"Partial CB1/CB2 agonist with lower affinity than THC. α2 adrenergic agonist. 5-HT1A antagonist. TRPV1 antagonist.", efectos_pos:["Anti-inflammatory","Possible neuroprotection","Antibacterial (MRSA)","IBS potential","Reduces intraocular pressure (glaucoma)"], efectos_neg:["Few documented side effects","Dry mouth","Drowsiness at high doses"], efectos_neu:["No significant psychoactive effect"], interacciones:"Limited documented interactions.", warning:"Very limited human clinical data. Currently primarily used in supplements with limited regulatory oversight." },
  "THCV": { brand:"— (specific cannabis)", tags:["cannabinoid","appetite suppressant","anti-diabetic"], desc:"Tetrahydrocannabivarin. Structurally similar to THC but with opposite effects at low doses. Appetite suppression and possible anti-diabetic properties.", mecanismo:"CB1 receptor antagonist at low doses (opposite to THC). CB1/CB2 partial agonist at high doses. May modulate energy metabolism.", efectos_pos:["Appetite suppression","Blood sugar regulation","Anti-epileptic","Alertness (unlike THC)"], efectos_neg:["Psychoactive at high doses","Bone density loss with prolonged use (animal studies)","Very limited human data"], efectos_neu:["Reduced appetite","Possible energy boost"], interacciones:"May interact with diabetes medications (hypoglycemia risk).", warning:"Very limited human clinical evidence. Present in small amounts in most cannabis varieties." },
  "Dronabinol": { brand:"Marinol / Syndros", tags:["synthetic cannabinoid","FDA approved","antiemetic"], desc:"Synthetic THC approved by the FDA. Used for chemotherapy nausea and AIDS-related anorexia. Standardized and controlled formulation.", mecanismo:"Identical to natural THC — partial CB1/CB2 agonist. Oral bioavailability 10-20%. Extensive first-pass metabolism.", efectos_pos:["Chemotherapy nausea control","AIDS anorexia treatment","Pain (off-label)"], efectos_neg:["Psychoactive effects (anxiety, paranoia)","Dependence","Impaired cognition","Variable absorption"], efectos_neu:["Appetite stimulation","Mood changes","Altered time perception"], interacciones:"Potentiates CNS depressants. Ritonavir significantly increases levels.", warning:"Despite being pharmaceutical-grade THC, carries the same psychoactive risks as natural cannabis." },
  "Nabilona": { brand:"Cesamet", tags:["synthetic cannabinoid","antiemetic","chronic pain"], desc:"Synthetic cannabinoid analogue of THC, more potent. Approved for chemotherapy nausea and vomiting. More predictable absorption than natural cannabis.", mecanismo:"CB1/CB2 receptor agonist, slightly more potent and selective than THC. Better oral bioavailability.", efectos_pos:["Chemotherapy nausea","Chronic pain (off-label)","More reliable absorption than natural THC"], efectos_neg:["Stronger psychoactive effects than dronabinol","Dependence","Sedation","Dizziness"], efectos_neu:["Mood changes","Dry mouth","Appetite stimulation"], interacciones:"Potentiates CNS depressants. Careful with antihypertensives.", warning:"More potent than dronabinol — psychoactive effects can be more intense. Closely monitor patients with psychiatric history." },
  "HHC": { brand:"— (unregulated market)", tags:["semi-synthetic cannabinoid","psychoactive","grey market"], desc:"Hexahydrocannabinol. Semi-synthetic THC derivative obtained by hydrogenation. Sold in grey market as 'legal cannabis'. Very limited safety data.", mecanismo:"CB1/CB2 partial agonist. Hydrogenation makes it more resistant to oxidation. Effects broadly similar to THC.", efectos_pos:["THC-like effects","More stable than THC (oxidation-resistant)","Available where cannabis is illegal"], efectos_neg:["Unknown long-term safety profile","No clinical trials","Variable product quality","Unknown synthesis contaminants"], efectos_neu:["Psychoactive effects similar to THC"], interacciones:"Assumed similar to THC. No formal interaction studies.", warning:"No human clinical trials or safety data. Products vary widely in purity. Not recommended." },
  "CBD": { brand:"Epidiolex / multiple", tags:["non-psychoactive","anxiolytic","antiepileptic"], desc:"Cannabidiol. Non-psychoactive. Growing medical interest in epilepsy, anxiety and inflammation. Only FDA-approved cannabinoid (Epidiolex) for pediatric epilepsy.", mecanismo:"Does not directly activate CB1/CB2 receptors. Acts on TRPV1, GPR55, 5-HT1A receptors. Inhibits endocannabinoid reuptake.", efectos_pos:["Epilepsy (Dravet syndrome)","Anxiety reduction","Inflammation","Neuroprotection","Sleep improvement"], efectos_neg:["CYP450 drug interactions (serious)","Elevated liver enzymes at high doses","Diarrhea","Drowsiness"], efectos_neu:["No psychoactive effects","Slight sedation"], interacciones:"Potent CYP3A4 and CYP2C19 inhibitor — significantly increases levels of many medications including warfarin and immunosuppressants.", warning:"Despite 'natural' image, has clinically significant drug interactions. Always consult prescriber before using with other medications." },

  "PCP": { brand:"Angel dust", tags:["dissociative","psychotomimetic","dangerous"], desc:"Phencyclidine. Originally an anesthetic. Withdrawn in 1965 due to psychotic side effects. Unique danger: can cause extreme violence and superhuman strength perception.", mecanismo:"Non-competitive NMDA receptor antagonist. Also agonist at dopamine, sigma and opioid receptors. Very lipophilic — accumulates in brain.", efectos_pos:["Intense analgesia","Dissociation (sought recreationally)"], efectos_neg:["Severe psychosis","Violent dissociative episodes","Amnesia","Seizures","Hyperthermia","Long-lasting psychiatric sequelae"], efectos_neu:["Depersonalization","Altered body image","Analgesia"], interacciones:"Extremely dangerous with stimulants (hypertension, hyperthermia). Unpredictable with any CNS drug.", warning:"Associated with extreme violence and self-harm due to psychosis and analgesia combination. Considered one of the most dangerous recreational drugs." },
  "Óxido nitroso": { brand:"Laughing gas / Whippets", tags:["inhaled","mild dissociative","anesthetic"], desc:"Anesthetic and analgesic with long medical history. Growing recreational abuse. Third most used drug among UK youth in 2023.", mecanismo:"Weak NMDA receptor antagonist. Endorphin release. Dopamine activation. Brief action (1-3 min inhaled).", efectos_pos:["Dental/surgical analgesia","Brief euphoria","Anxiolysis","Conscious sedation"], efectos_neg:["Vitamin B12 depletion (chronic use)","Subacute combined spinal cord degeneration","Asphyxia risk","Frostbite from cartridges"], efectos_neu:["Brief giggling","Auditory distortions","Short dissociation"], interacciones:"Can potentiate other anesthetics. Dangerous with methotrexate and vitamin B12-depleting drugs.", warning:"Chronic use destroys myelin through vitamin B12 depletion. Neurological damage can be permanent. Risk proportional to cumulative use." },

  "Valproato": { brand:"Depakine / Depakote", tags:["antiepileptic","mood stabilizer","migraine"], desc:"One of the most widely used antiepileptics globally. Also mood stabilizer for bipolar disorder. Severely teratogenic — causes serious fetal malformations.", mecanismo:"Sodium channel blocker + GABA transaminase inhibitor (increases GABA) + T-type calcium channel inhibitor. Multiple mechanisms.", efectos_pos:["Epilepsy (multiple types)","Acute mania in bipolar","Migraine prophylaxis","Cluster headaches"], efectos_neg:["Severe teratogenicity (spina bifida)","Hepatotoxicity","Weight gain","Hair loss","Tremor","Polycystic ovaries"], efectos_neu:["Sedation","Cognitive effects","Weight changes"], interacciones:"Inhibits metabolism of lamotrigine, phenobarbital and carbamazepine. Carbapenem antibiotics can dramatically reduce valproate levels.", warning:"Absolutely contraindicated in pregnancy — causes neural tube defects and neurodevelopmental damage in 30-40% of exposed children." },
  "Carbamazepina": { brand:"Tegretol / Carbatrol", tags:["antiepileptic","neuralgia","bipolar"], desc:"Classic antiepileptic also used in trigeminal neuralgia and bipolar disorder. Causes potentially fatal skin reactions (SJS) in certain Asian genotypes.", mecanismo:"Voltage-dependent sodium channel blocker. Stabilizes neuronal membranes and reduces repetitive high-frequency firing.", efectos_pos:["Focal epilepsy","Trigeminal neuralgia (extremely effective)","Bipolar disorder","Neuropathic pain"], efectos_neg:["Stevens-Johnson syndrome (HLA-B*1502)","Aplastic anemia","Hyponatremia","Double vision","Potent enzyme inducer"], efectos_neu:["Initial drowsiness","Liver enzyme induction"], interacciones:"Potent CYP3A4 inducer — reduces levels of hundreds of drugs including contraceptives and anticoagulants.", warning:"HLA-B*1502 genetic testing required before use in patients of Southeast Asian descent — risk of fatal Stevens-Johnson syndrome." },
  "Lamotrigina": { brand:"Lamictal", tags:["antiepileptic","bipolar","broad spectrum"], desc:"Modern broad-spectrum antiepileptic also used in bipolar disorder. Very slow titration required to prevent serious skin reactions.", mecanismo:"Voltage-gated sodium channel blocker. Also inhibits calcium channels and glutamate release.", efectos_pos:["Focal and generalized epilepsy","Bipolar depression (unique evidence)","Mood stabilization","Better cognitive profile than many antiepileptics"], efectos_neg:["Stevens-Johnson syndrome if titrated too fast","Rash (common)","Insomnia","Dizziness","Double vision"], efectos_neu:["Relatively neutral cognitive profile","Possible mild alerting effect"], interacciones:"Valproate doubles lamotrigine levels — reduce dose by half when combined. Hormonal contraceptives reduce levels significantly.", warning:"Never increase dose rapidly. SJS risk is directly proportional to titration speed. Follow titration schedules strictly." },
  "Levetiracetam": { brand:"Keppra", tags:["antiepileptic","modern","broad spectrum"], desc:"Second-generation antiepileptic with unique mechanism. Few drug interactions. Known for behavioral side effects ('Keppra rage') in some patients.", mecanismo:"Binds SV2A synaptic vesicle protein, modulating vesicular neurotransmitter release. Mechanism fully established only in 2004.", efectos_pos:["Broad spectrum epilepsy","Few drug interactions","IV formulation available","Effective in status epilepticus"], efectos_neg:["Irritability and aggression ('Keppra rage')","Depression","Behavioral changes","Psychosis (rare)"], efectos_neu:["Initial fatigue","Mood changes"], interacciones:"Very few pharmacokinetic interactions. Some pharmacodynamic interactions with CNS depressants.", warning:"'Keppra rage' (irritability/aggression) affects a significant minority. Prophylactic vitamin B6 may reduce behavioral effects." },
  "Fenitoína": { brand:"Dilantin / Epanutin", tags:["classic antiepileptic","emergency","arrhythmias"], desc:"One of the oldest antiepileptics (1938). Non-linear pharmacokinetics make dosing unpredictable. Known for cosmetic side effects.", mecanismo:"Voltage-dependent sodium channel blocker. Also used as a class IB antiarrhythmic.", efectos_pos:["Emergency IV seizure control","Focal epilepsy","Cardiac arrhythmias"], efectos_neg:["Gingival hyperplasia (50% chronic users)","Hirsutism","Coarsening of features","Non-linear kinetics","Bone loss"], efectos_neu:["Drowsiness","Cognitive effects","Nystagmus"], interacciones:"Extremely complex interactions — induces many CYP enzymes. Therapeutic drug monitoring essential.", warning:"Non-linear (Michaelis-Menten) pharmacokinetics: small dose increases can cause toxicity. Requires regular blood level monitoring." },
  "Gabapentina": { brand:"Neurontin", tags:["antiepileptic","neuropathic pain","anxiolytic"], desc:"Antiepileptic also widely used for neuropathic pain, fibromyalgia and anxiety. Over 80% of prescriptions are off-label. Growing recreational use.", mecanismo:"Binds α2δ subunit of voltage-dependent calcium channels. Reduces glutamate, substance P and norepinephrine release.", efectos_pos:["Neuropathic pain","Fibromyalgia","Restless legs syndrome","Epilepsy adjunct","Alcohol/opioid withdrawal"], efectos_neg:["Dizziness","Sedation","Weight gain","Peripheral edema","Dependence (especially in opioid users)"], efectos_neu:["Mood stabilization in some","Cognitive dulling"], interacciones:"Potentiates opioids (respiratory depression risk). Antacids reduce absorption.", warning:"Classified as controlled substance in UK (2019) after 5000% increase in police seizures. Sought by opioid users to potentiate effects." },
  "Brivaracetam": { brand:"Briviact", tags:["antiepileptic","modern","SV2A"], desc:"Third-generation antiepileptic, optimized derivative of levetiracetam. Higher SV2A affinity, designed to reduce behavioral side effects.", mecanismo:"High-affinity SV2A ligand — 15-30× higher affinity than levetiracetam. More selective, potentially fewer off-target effects.", efectos_pos:["Focal epilepsy","Fewer behavioral effects than levetiracetam","Rapid onset (IV available)","Good tolerability"], efectos_neg:["Still some behavioral side effects","Dizziness","Fatigue"], efectos_neu:["Sedation (less than other antiepileptics)"], interacciones:"Some interactions with carbamazepine and phenytoin.", warning:"Despite improved profile over levetiracetam, some patients with levetiracetam intolerance also struggle with brivaracetam." },
  "Topiramato": { brand:"Topamax", tags:["antiepileptic","migraine","weight loss"], desc:"Antiepileptic with multiple mechanisms. Colloquially known as 'Stupimax' due to cognitive impairment. Also approved for migraine and obesity.", mecanismo:"Multiple mechanisms: sodium channel blocker, GABA-A enhancer, AMPA/kainate glutamate antagonist, carbonic anhydrase inhibitor.", efectos_pos:["Broad spectrum epilepsy","Migraine prophylaxis","Weight loss (significant)","Approved for obesity (in combination)"], efectos_neg:["Cognitive impairment ('Stupimax')","Word-finding difficulties","Kidney stones","Metabolic acidosis","Glaucoma risk"], efectos_neu:["Altered taste","Appetite suppression","Temperature dysregulation"], interacciones:"Reduces valproate levels. Increases phenytoin levels. Reduces oral contraceptive efficacy.", warning:"Cognitive impairment is dose-dependent and reversible on discontinuation, but can significantly impact quality of life and work performance." },

  "Zolpidem": { brand:"Ambien / Stilnox", tags:["hypnotic","non-BZD","GABA"], desc:"Short-acting hypnotic. Designed to replace benzodiazepines with fewer side effects — goals only partially achieved. Most prescribed sleep medication worldwide.", mecanismo:"GABA-A receptor positive allosteric modulator selective for α1 subunit (responsible for sedation). More selective than benzodiazepines.", efectos_pos:["Rapid sleep induction","Short duration hypnotic","Less REM suppression than benzodiazepines"], efectos_neg:["Sleepwalking and complex sleep behaviors","Anterograde amnesia","Dependence","Rebound insomnia","Next-day impairment (especially women)"], efectos_neu:["Sedation","Reduced sleep onset time"], interacciones:"Potentiates all CNS depressants. Rifampin dramatically reduces levels. Ketoconazole increases levels.", warning:"FDA halved recommended dose in women in 2013 — they metabolize zolpidem 45% slower than men. Next-morning driving impairment is documented." },
  "Zopiclona": { brand:"Zimovane / Imovane", tags:["hypnotic","cyclopyrrolone","GABA"], desc:"Cyclopyrrolone-class hypnotic. Similar to zolpidem but with longer half-life. Distinctive metallic taste is a common complaint.", mecanismo:"GABA-A receptor positive allosteric modulator. Less α1-selective than zolpidem. Half-life 5-6h.", efectos_pos:["Sleep induction and maintenance","Less amnestic than triazolam","Moderate duration for sleep maintenance insomnia"], efectos_neg:["Metallic taste (very common)","Dependence","Rebound insomnia","Next-day drowsiness"], efectos_neu:["Sedation","Altered taste the following day"], interacciones:"Potentiates CNS depressants. CYP3A4 metabolized.", warning:"Metallic taste can last the entire following day. Not recommended beyond 4 weeks." },
  "Eszopiclona": { brand:"Lunesta", tags:["hypnotic","cyclopyrrolone","GABA"], desc:"Active enantiomer of zopiclone. Approved for long-term insomnia use — unique among Z-drugs.", mecanismo:"Active S-enantiomer of zopiclone with similar GABA-A mechanism. Slightly longer half-life.", efectos_pos:["Sleep onset and maintenance","Approved for long-term use (unlike other Z-drugs)","Evidence base for chronic insomnia"], efectos_neg:["Unpleasant taste","Dizziness","Dependence","Headache"], efectos_neu:["Sedation","Minor next-day effects"], interacciones:"CYP3A4 substrate — ketoconazole increases levels significantly.", warning:"Despite long-term approval, dependence can develop. Regular reassessment of continued need recommended." },
  "Zaleplon": { brand:"Sonata", tags:["hypnotic","ultra-short acting","GABA"], desc:"Shortest-acting Z-hypnotic. Useful only for sleep induction. Can be taken in the middle of the night if at least 4 hours remain before waking.", mecanismo:"GABA-A α1 subunit selective positive allosteric modulator. Ultra-short half-life (~1h).", efectos_pos:["Ultra-rapid sleep onset","Can be taken if awakening in the night","No morning hangover","Least dependence-forming Z-drug"], efectos_neg:["Only useful for sleep onset, not maintenance","Tolerance can develop","Rare complex sleep behaviors"], efectos_neu:["Brief sedation","Rapid return to alertness"], interacciones:"Potentiates CNS depressants. Rifampin reduces levels. High-fat meals delay absorption.", warning:"Ultra-short action means it only helps with sleep induction. If the problem is staying asleep, this drug is not appropriate." },

  "Haloperidol": { brand:"Haldol", tags:["typical","antipsychotic","D2"], desc:"High-potency typical antipsychotic. Historical psychiatric reference. Still widely used in acute agitation and palliative care.", mecanismo:"Potent D2 receptor antagonist. Also blocks D3, D4, α1-adrenergic and H1 receptors.", efectos_pos:["Acute psychosis control","Acute agitation","Delirium in palliative care","Tourette syndrome","Tics"], efectos_neg:["Akathisia (subjectively intolerable restlessness)","Extrapyramidal symptoms","Tardive dyskinesia (long-term)","Neuroleptic malignant syndrome (rare)","QT prolongation"], efectos_neu:["Sedation","Emotional blunting","Reduced spontaneous movement"], interacciones:"QT-prolonging drugs increase arrhythmia risk. Potentiates CNS depressants. Lithium may increase neurotoxicity.", warning:"Akathisia (inability to remain still) can be more unbearable than psychotic symptoms, causing medication non-compliance and suicide risk." },
  "Clozapina": { brand:"Clozaril / Leponex", tags:["atypical","refractory","agranulocytosis"], desc:"Atypical antipsychotic reference for refractory schizophrenia. Most effective antipsychotic known. Only drug with evidence for suicide reduction.", mecanismo:"Broad receptor blockade: D1-D4, 5-HT2A/2C, H1, muscarinic, α1/α2. Low D2 occupancy explains reduced extrapyramidal symptoms.", efectos_pos:["Refractory schizophrenia","Suicide risk reduction (FDA approved)","Persistent psychosis","Tardive dyskinesia treatment","Superior efficacy"], efectos_neg:["Agranulocytosis (1-2%)","Severe weight gain","Myocarditis","Hypersalivation","Constipation","Seizures at high doses"], efectos_neu:["Sedation (beneficial in acute phase)","Metabolic changes"], interacciones:"Benzodiazepines can cause respiratory arrest when combined. Weekly blood count mandatory.", warning:"Fatal agranulocytosis without weekly blood monitoring. Medication can only be dispensed after confirmed normal blood count." },
  "Risperidona": { brand:"Risperdal", tags:["atypical","antipsychotic","bipolar"], desc:"Second-generation atypical antipsychotic. First atypical antipsychotic approved for pediatric use in autism-related irritability.", mecanismo:"Potent D2 and 5-HT2A antagonist. Strong α1-adrenergic and H1 antihistamine activity.", efectos_pos:["Schizophrenia","Bipolar mania","Autism irritability (children 5+)","Schizoaffective disorder"], efectos_neg:["Hyperprolactinemia (gynecomastia in men)","Extrapyramidal symptoms (dose-dependent)","Weight gain","Sedation","Orthostatic hypotension"], efectos_neu:["Emotional normalization","Reduced psychosis","Sleep changes"], interacciones:"CYP2D6 metabolized. QT prolongation risk. Carbamazepine reduces plasma levels.", warning:"Hyperprolactinemia can cause breast tissue development in young men — significant impact on body image and medication adherence." },
  "Olanzapina": { brand:"Zyprexa", tags:["atypical","antipsychotic","mood stabilizer"], desc:"Atypical antipsychotic with broad receptor profile. Very effective but with the highest metabolic risk of all antipsychotics.", mecanismo:"Broad antagonism at D1-D4, 5-HT2A/2C/3/6, H1, muscarinic M1-M5, α1/α2 receptors. IM formulation for acute agitation.", efectos_pos:["Schizophrenia","Bipolar mania and depression","Acute agitation (IM)","Treatment-resistant depression (in combination)"], efectos_neg:["Severe weight gain (highest among antipsychotics)","Metabolic syndrome","Type 2 diabetes","Sedation","Dyslipidemia"], efectos_neu:["Emotional normalization","Appetite increase","Sedation"], interacciones:"Dangerous with benzodiazepines IM. Smoking significantly reduces plasma levels.", warning:"Average weight gain of 4-7 kg at one year, up to 20 kg in some patients. Type 2 diabetes develops in up to 30% of long-term users." },
  "Quetiapina": { brand:"Seroquel", tags:["atypical","antipsychotic","sedative"], desc:"Atypical antipsychotic widely used off-label for insomnia and anxiety at low doses. Known as 'the most prescribed antipsychotic not for psychosis'.", mecanismo:"Multi-receptor antagonist: D1/D2, 5-HT2A, H1 (very potent), α1/α2. At low doses mainly antihistaminergic — explaining sleep use.", efectos_pos:["Schizophrenia","Bipolar depression and mania","Adjunct in refractory depression","Low-dose insomnia (off-label)"], efectos_neg:["Weight gain","Metabolic syndrome","Sedation","Orthostatic hypotension","QT prolongation"], efectos_neu:["Sedation","Emotional normalization","Appetite increase"], interacciones:"QT-prolonging drugs increase arrhythmia risk. CYP3A4 metabolized. Potentiates CNS depressants.", warning:"Recreational abuse ('Quell', 'Susie-Q') is widespread in prison systems. Crushed and insufflated for dissociative effects." },
  "Aripiprazol": { brand:"Abilify", tags:["atypical","partial agonist","bipolar"], desc:"First partial D2/D3 agonist antipsychotic. Fewer metabolic effects. FDA black box warning for pathological gambling and compulsive behaviors.", mecanismo:"Partial D2/D3 receptor agonist (unique mechanism). 5-HT1A partial agonist and 5-HT2A antagonist. Minimal metabolic effects.", efectos_pos:["Schizophrenia","Bipolar disorder","Major depression (adjunct)","Irritability in autism","Tourette syndrome"], efectos_neg:["Pathological gambling","Hypersexuality","Compulsive shopping","Akathisia","Insomnia","Weight gain (less than others)"], efectos_neu:["Activating effect","Reduced negative symptoms","Minimal sedation"], interacciones:"CYP2D6 and CYP3A4 substrate. Strong CYP2D6 inhibitors (fluoxetine, paroxetine) increase plasma levels.", warning:"FDA issued special warning for compulsive behaviors including pathological gambling and hypersexuality appearing and disappearing with the drug." },
  "Litio": { brand:"Camcolit / Priadel", tags:["mood stabilizer","bipolar","antisuicidal"], desc:"The quintessential mood stabilizer since 1949. Simple mineral with remarkable properties. Only drug with proven suicide reduction in bipolar disorder.", mecanismo:"Multiple mechanisms: inhibits inositol monophosphatase and GSK-3β, modulates neurotrophin signaling, effects on serotonin and dopamine.", efectos_pos:["Bipolar disorder (gold standard)","Suicide prevention","Unipolar depression augmentation","Neuroprotection","Long-term mortality reduction"], efectos_neg:["Narrow therapeutic window (toxicity at 1.5mEq/L)","Thyroid dysfunction","Renal impairment (chronic)","Tremor","Polyuria/polydipsia","Teratogenic (Ebstein's anomaly)"], efectos_neu:["Weight gain","Slight cognitive dulling","Mood normalization"], interacciones:"NSAIDs, diuretics and ACE inhibitors increase lithium levels dangerously. Dehydration and sodium restriction cause toxicity.", warning:"Narrow therapeutic window — levels above 1.5 mEq/L cause toxicity. Dehydration or sodium-restricted diets can rapidly cause dangerous accumulation." },

  "Etanol": { brand:"Ethyl alcohol", tags:["CNS depressant","legal","addictive"], desc:"The most consumed psychoactive drug in the world. Legal in most countries. Responsible for 3 million deaths annually — more than all illegal drugs combined.", mecanismo:"Enhances GABA-A and inhibits NMDA receptors. Also affects dopamine, serotonin and opioid receptors. Acts on multiple CNS targets.", efectos_pos:["Social disinhibition","Anxiolysis","Euphoria (low doses)","Culinary and social use"], efectos_neg:["Liver cirrhosis","Physical dependence","Severe withdrawal (potentially fatal)","Cancer (7 types)","Neurological damage (Wernicke-Korsakoff)","Fetal alcohol syndrome"], efectos_neu:["Diuresis","Vasodilation","Reduced inhibitions"], interacciones:"Extremely dangerous with opioids, benzodiazepines, antihistamines and any CNS depressant. Disulfiram causes severe reaction.", warning:"Alcohol withdrawal is one of very few withdrawal syndromes that can be fatal (delirium tremens). Never stop abruptly after heavy chronic use without medical supervision." },
  "GHB": { brand:"Xyrem / liquid ecstasy", tags:["depressant","anesthetic","date rape drug"], desc:"Gamma-hydroxybutyric acid. Endogenous neurotransmitter. Medical use in narcolepsy. Also known as a date rape drug due to use in drug-facilitated sexual assault.", mecanismo:"GHB receptor agonist and GABA-B receptor agonist. Endogenous neurotransmitter with neuromodulatory role.", efectos_pos:["Narcolepsy treatment (Xyrem)","Alcohol withdrawal (European approval)","Euphoria and disinhibition (recreational)"], efectos_neg:["Extremely narrow therapeutic window","Respiratory depression","Coma","Severe dependence","Amnesia","Dangerous redosing unpredictability"], efectos_neu:["Sedation","Euphoria","Amnesia"], interacciones:"Lethal with alcohol — both potentiate GABA massively. Margin between intoxicating and lethal dose is very narrow.", warning:"The dose-response curve is extremely steep — a small increase in dose can go from recreational effects to deep coma. Never combine with alcohol." },
  "Hidrato de cloral": { brand:"— (historical)", tags:["historical sedative","hypnotic","Mickey Finn"], desc:"One of the first synthetic hypnotics (1832). Known as 'Mickey Finn' — historically used to drug people without consent.", mecanismo:"Converted to trichloroethanol in the liver, which potentiates GABA-A. Mechanism similar to alcohol and chloroform.", efectos_pos:["Pediatric sedation for procedures","Historical hypnotic use"], efectos_neg:["Narrow therapeutic window","Cardiac arrhythmias","Respiratory depression","Severe gastric irritation","Carcinogenic (animal studies)"], efectos_neu:["Sedation","Amnesia"], interacciones:"Extremely dangerous with alcohol. CNS depressant synergy.", warning:"No longer recommended for clinical use due to narrow therapeutic index and carcinogenicity concerns." },
  "Pregabalina": { brand:"Lyrica", tags:["anticonvulsant","neuropathic pain","anxiolytic"], desc:"GABA analogue acting on calcium channels. Approved for neuropathic pain, epilepsy and generalized anxiety disorder. High abuse potential.", mecanismo:"Binds α2δ subunit of voltage-dependent calcium channels, reducing excitatory neurotransmitter release. More potent and bioavailable than gabapentin.", efectos_pos:["Neuropathic pain","Fibromyalgia","Generalized anxiety disorder","Epilepsy adjunct","Spinal cord injury pain"], efectos_neg:["Euphoria (abuse potential)","Dependence","Dizziness","Weight gain","Edema","Cognitive impairment"], efectos_neu:["Sedation","Relaxation","Mood elevation"], interacciones:"Potentiates opioids (respiratory depression). Significant CNS depressant synergy.", warning:"Classified as controlled substance in UK and several EU countries due to rapidly increasing abuse. Particularly sought by opioid users." },
  "Propofol": { brand:"Diprivan", tags:["anesthetic","IV sedative","hospital use"], desc:"Intravenous anesthetic for hospital use. Famous for Michael Jackson's death in 2009. Produces clear, rapid sedation with fast recovery.", mecanismo:"GABA-A receptor positive allosteric modulator. Also inhibits NMDA receptors and sodium channels. Onset 30 seconds IV.", efectos_pos:["General anesthesia induction and maintenance","ICU sedation","Procedural sedation","Rapid and clear recovery"], efectos_neg:["Apnea (requires intubation)","Propofol infusion syndrome (prolonged high doses)","Hypotension","Pain on injection","No analgesic properties"], efectos_neu:["Rapid sedation","Amnesia","Pleasant induction in some patients"], interacciones:"Potentiates all CNS depressants and anesthetics. Egg/soy allergy contraindication.", warning:"For hospital-only use requiring airway management capability. Multiple deaths from recreational use — rapid respiratory arrest without ventilatory support." },

  "Tolueno": { brand:"— (glues, paints)", tags:["inhalant","solvent","neurotoxic"], desc:"Industrial solvent in glues, paints and varnishes. Drug of abuse among street youth. Cheapest psychoactive drug in the world. Severe neurotoxicity.", mecanismo:"GABA-A enhancer and NMDA antagonist. Membrane fluidity alteration. Dopamine system activation explains euphoric effects.", efectos_pos:["Euphoria (brief)","Hallucinations","Relaxation"], efectos_neg:["Severe demyelination","Irreversible cognitive impairment","Liver and kidney damage","Cardiac arrhythmias (sudden sniffing death)","Leukemia risk"], efectos_neu:["Dizziness","Disorientation","Tinnitus"], interacciones:"Extremely dangerous with other CNS depressants. Cardiac sensitization to epinephrine causes fatal arrhythmias.", warning:"Chronic toluene damage produces brain MRI identical to advanced multiple sclerosis. 20-year-olds with 70-year-old brain images documented." },

  "MDA": { brand:"— / Sally", tags:["empathogen","psychedelic","phenethylamine"], desc:"3,4-Methylenedioxyamphetamine. MDMA precursor, more psychedelic and longer duration. Greater neurotoxicity than MDMA. Less common.", mecanismo:"Serotonin, dopamine and norepinephrine releaser. More potent dopamine activity than MDMA. 5-HT2A receptor partial agonism explains psychedelic component.", efectos_pos:["Empathy and emotional openness","Psychedelic visual component","Euphoria","Longer duration than MDMA"], efectos_neg:["Greater serotonergic neurotoxicity than MDMA","Hyperthermia","Cardiovascular stress","Severe comedown"], efectos_neu:["Jaw clenching","Pupil dilation","Elevated heart rate"], interacciones:"Same critical interactions as MDMA. MAOIs absolutely contraindicated.", warning:"Higher neurotoxic risk than MDMA due to greater serotonergic release. Combination with other serotonergic drugs can be fatal." },
  "2C-B": { brand:"— / Nexus / Bees", tags:["psychedelic","empathogen","phenethylamine"], desc:"4-Bromo-2,5-dimethoxyphenethylamine. Synthesized by Alexander Shulgin. Psychedelic with empathogenic component. Popular in European festival culture.", mecanismo:"Partial 5-HT2A receptor agonist. Also 5-HT2B and 5-HT2C activity. Some dopaminergic and adrenergic effects. Duration 4-6h.", efectos_pos:["Psychedelic experience","Empathy (less than MDMA)","Sensory enhancement","Shorter duration than LSD","Lower neurotoxicity than MDMA"], efectos_neg:["Anxiety/panic at high doses","Cardiovascular stress","Psychosis risk in predisposed","Nausea"], efectos_neu:["Time distortion","Visual effects","Altered emotional processing"], interacciones:"MAOIs can intensify dangerously. Lithium contraindicated. SSRIs reduce effects.", warning:"Dose-response curve is steep — small increases produce very different experiences. Dose accuracy is critical." },
  "Mescalina": { brand:"— / Peyote / San Pedro", tags:["natural psychedelic","phenethylamine","ritual"], desc:"Alkaloid from peyote and San Pedro cactus. One of the oldest psychedelics used by indigenous peoples. Long duration (8-12h). Intense nausea is common.", mecanismo:"5-HT2A receptor partial agonist. Similar mechanism to LSD and psilocybin but structurally a phenethylamine (not tryptamine).", efectos_pos:["Profound visual hallucinations","Mystical experiences","Cultural and spiritual use","Introspection"], efectos_neg:["Severe nausea and vomiting (initial)","Very long duration (sometimes unwanted)","Psychosis risk","Physical discomfort"], efectos_neu:["Time distortion","Synesthesia","Altered body perception"], interacciones:"Same as other classical psychedelics. MAOIs increase effects. Lithium contraindicated.", warning:"Severe vomiting is common at onset — consider fasting before use. Native American Church traditional use." },

  "Kratom": { brand:"— / Mitragyna speciosa", tags:["plant opioid","stimulant","analgesic"], desc:"Southeast Asian plant with dose-dependent effects: stimulant at low doses, opioid-like at high doses. Used as traditional medicine and coffee substitute.", mecanismo:"Mitragynine and 7-hydroxymitragynine: partial µ-opioid agonists. Adrenergic and serotonergic activity. Low doses: primarily adrenergic stimulation.", efectos_pos:["Low-dose stimulation","Pain relief (opioid-like)","Opioid withdrawal management","Traditional medicinal uses"], efectos_neg:["Physical dependence","Withdrawal syndrome (similar to opioids)","Hepatotoxicity (high doses)","Psychosis (chronic use)"], efectos_neu:["Dose-dependent mood effects","Appetite suppression","Constipation (high doses)"], interacciones:"CYP3A4 and CYP2D6 inhibitor — multiple drug interactions. Dangerous with opioids (respiratory depression).", warning:"Legal status varies widely. FDA has issued multiple warnings. Physical dependence can develop. Liver toxicity cases documented." },
  "Ibogaína": { brand:"— / Tabernanthe iboga", tags:["psychedelic","anti-addictive","dissociative"], desc:"African alkaloid from the iboga plant. Used in Bwiti rituals. Unique anti-addictive properties. Cardiotoxic and illegal in most countries.", mecanismo:"NMDA receptor antagonist + kappa opioid agonist + sigma receptor agonist. Resets opioid and stimulant receptors. Very long half-life.", efectos_pos:["Single-dose opioid dependence interruption","Cocaine/alcohol addiction treatment","Profound psycho-spiritual experiences","Long-lasting anti-addictive effects"], efectos_neg:["QT prolongation (lethal arrhythmias)","Deaths in treatment clinics","30+ hour experience","Ataxia","Prolonged visual phenomena"], efectos_neu:["Profound dissociation","Life review experiences","Waking dream state"], interacciones:"Fatal with opioids (QT prolongation + respiratory depression). Contraindicated with stimulants (ventricular fibrillation).", warning:"Multiple documented deaths in ibogaine clinics, primarily from cardiac arrhythmias. Requires pre-treatment cardiac screening. Illegal in most countries." },
  "Salvia divinorum": { brand:"— / Salvia", tags:["psychedelic","dissociative","plant"], desc:"Mexican plant used by the Mazatec people. Produces one of the most powerful and brief dissociative states known. Legal in most countries.", mecanismo:"Salvinorin A: highly potent and selective κ (kappa) opioid receptor agonist. Only natural psychedelic not acting on 5-HT2A receptors.", efectos_pos:["Extremely brief (5-10 min smoked)","Legal in most jurisdictions","Deep dissociative state","Unique mechanism (research interest)"], efectos_neg:["Overwhelmingly intense experience","Complete ego dissolution","Dysphoric for many","Risk of injury during episode"], efectos_neu:["Complete perceptual transformation","Altered body perception","Spatial distortion"], interacciones:"Unknown significant interactions. Theoretically may interact with opioid-acting drugs.", warning:"Extremely powerful despite brief duration. Physical danger risk during episode (falls, disorientation). Requires a sober sitter." },
  "Kava": { brand:"— / Piper methysticum", tags:["natural anxiolytic","ritual","sedative"], desc:"Traditional beverage from South Pacific islands with anxiolytic properties. Used as alternative to alcohol and benzodiazepines. Hepatotoxicity risk.", mecanismo:"Kavalactones: GABA-A potentiation, sodium and calcium channel blockade, dopamine and serotonin modulation. Multiple active compounds.", efectos_pos:["Anxiolysis","Social relaxation","Muscle relaxation","Sleep aid","Traditional ceremonial use","Low addiction risk"], efectos_neg:["Hepatotoxicity (rare but severe cases)","Dermatopathy (heavy chronic use)","Cognitive impairment","Drug interactions"], efectos_neu:["Mild euphoria","Oral numbness","Muscle relaxation"], interacciones:"CYP1A2, CYP2C9, CYP3A4 inhibitor — multiple drug interactions. Dangerous with alcohol and CNS depressants.", warning:"Several European countries temporarily banned kava in 2002 due to liver failure cases. Moderate use appears safe for most people." },
  "Efedrina": { brand:"— / Ma Huang", tags:["stimulant","sympathomimetic","bronchodilator"], desc:"Alkaloid from the Ephedra plant. Ancient medicinal history in China (Ma Huang). Predecessor of modern amphetamines. Banned in sports.", mecanismo:"Mixed sympathomimetic: norepinephrine and dopamine releaser + weak direct adrenergic receptor agonist. Crosses the blood-brain barrier.", efectos_pos:["Bronchodilation (asthma)","Nasal congestion","Weight loss (thermogenic)","Athletic performance (banned)"], efectos_neg:["Cardiac arrhythmias","Hypertension","Stroke risk","CNS stimulation","Insomnia","Dependence"], efectos_neu:["Elevated heart rate and blood pressure","Thermogenesis","Appetite suppression"], interacciones:"MAOIs can cause hypertensive crisis. Dangerous with other stimulants and sympathomimetics.", warning:"Multiple deaths from ephedra-containing dietary supplements led to FDA ban in 2004. Cardiac events even in healthy young adults." },

  "Metanfetamina": { brand:"Crystal meth / Tina / Desoxyn", tags:["stimulant","methamphetamine","highly addictive"], desc:"Extremely potent stimulant. One of the most addictive substances known. Marginal medical use (Desoxyn). Devastates communities worldwide.", mecanismo:"Massive releaser of dopamine, norepinephrine and serotonin. Far greater dopamine release than amphetamine. Neurotoxic with repeated use.", efectos_pos:["Extreme energy and euphoria (acute)","Appetite suppression","Historical wartime use"], efectos_neg:["Severe dopaminergic neurotoxicity","Psychosis and paranoia","Extreme physical deterioration","High relapse rate","Meth mouth","Cardiovascular damage"], efectos_neu:["Hyperthermia","Hypersexuality","Hypervigilance","Extended wakefulness"], interacciones:"Fatal with MAOIs. Dangerous with any cardiovascular drug. Serotonin syndrome risk with serotonergic drugs.", warning:"Dopaminergic neurotoxicity from repeated use is partially irreversible. Brain damage visible on neuroimaging up to 3 years after cessation." },
  "Cannabinoides sintéticos": { brand:"Spice / K2", tags:["NPS","CB1 agonist","unpredictable"], desc:"Full CB1 agonists (unlike partial agonist THC). Extremely dangerous. Originally synthesized for research — never intended for human consumption.", mecanismo:"Full CB1 agonist (THC is partial) — produces maximal receptor activation. Extreme potency and duration variability between batches.", efectos_pos:["Available where cannabis is illegal"], efectos_neg:["Psychosis","Seizures","Cardiac arrest","Kidney failure","Death","Extreme batch-to-batch unpredictability"], efectos_neu:["THC-like effects but more intense and unpredictable"], interacciones:"All cannabis interactions apply but amplified. Dangerous with any CNS drug.", warning:"Cannot be called 'legal cannabis' — far more dangerous. Full CB1 agonism produces effects cannabis cannot. Multiple deaths documented." },
  "Catinona / Mefedrona": { brand:"4-MMC / Meow meow", tags:["NPS","stimulant","empathogen"], desc:"Synthetic cathinone with amphetamine-MDMA-like effects. First designer drug to become mainstream. Compulsive redosing pattern is distinctive.", mecanismo:"Monoamine transporter reversal (DAT, NET, SERT) similar to amphetamines but with more serotonergic component (closer to MDMA). Rapid onset and offset.", efectos_pos:["MDMA-like euphoria","Stimulation","Social effects","Shorter duration than MDMA"], efectos_neg:["Intense compulsive redosing","Severe cardiotoxicity with extended use","Psychosis","Serotonin depletion","Hyperthermia"], efectos_neu:["Jaw clenching","Elevated heart rate","Sweating","Appetite suppression"], interacciones:"Same critical interactions as MDMA. MAOIs absolutely contraindicated. Dangerous with stimulants.", warning:"2-3 hour duration creates powerful compulsive redosing. Users report consuming for 12-18 hours continuously. Cardiotoxicity risk is cumulative." },

function translateRisk(risk) {
  const map = { alto: 'high', medio: 'medium', bajo: 'low' };
  return map[risk] || risk;
}


function buildEnFamilies() {
  return families.map(fam => {
    const famTrans = FAMILIES_EN[fam.id] || {};
    return {
      ...fam,
      name: famTrans.name || fam.name,
      subtitle: famTrans.subtitle || fam.subtitle,
      drugs: fam.drugs.map(drug => {
        const dt = DRUGS_EN[drug.name];
        const curioEN = curiosDB_EN[drug.name];
        const pharma = {
          risk: translateRisk(drug.risk),
          rawRisk: drug.risk,
          semivida: translatePharmaText(drug.semivida),
          inicio: translatePharmaText(drug.inicio),
          duracion: translatePharmaText(drug.duracion),
          legal: translatePharmaText(drug.legal),
          curiosidad: curioEN || drug.curiosidad,
        };
        if (!dt) return { ...drug, ...pharma };
        return { ...drug, ...dt, ratings: drug.ratings, ...pharma };
      })
    };
  });
}

function applyFullTranslation(lang) {
  if (lang === 'es') {
    translatedFamilies = null;
  } else {
    translatedFamilies = buildEnFamilies();
  }
  renderSidebar();
  renderContent();
}

function setLang(lang) {
  currentLang = lang;
  document.getElementById('lang-es').classList.toggle('active', lang === 'es');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  applyLang();
  applyFullTranslation(lang);
}

function applyLang() {
  // Refresh tips in new language
  renderTip();
  // Header tagline
  const tagEl = document.getElementById('header-tagline');
  if (tagEl) tagEl.textContent = t('tagline');
  const mixSub = document.getElementById('mixer-subtitle');
  if (mixSub) mixSub.textContent = t('mixer_sub');
  const mixSearch = document.getElementById('mixer-search');
  if (mixSearch) mixSearch.placeholder = t('mixer_search');
  const mixSelLabel = document.getElementById('mixer-selected-label-text');
  if (mixSelLabel) mixSelLabel.textContent = t('mixer_selected');
  const mixAnalyzeBtn = document.getElementById('mixer-analyze-btn');
  if (mixAnalyzeBtn && mixAnalyzeBtn.disabled === false) mixAnalyzeBtn.textContent = t('mixer_analyze');
  else if (mixAnalyzeBtn) mixAnalyzeBtn.textContent = t('mixer_analyze');
  const mixTitle = document.querySelector('#mixer-modal .modal-drug-name');
  const mixerModalTitle = document.getElementById('mixer-modal-title');
  if (mixerModalTitle) mixerModalTitle.textContent = currentLang==='en' ? '⚗ Substance Mixer' : '⚗ Mezclador de Sustancias';
  if (mixTitle) mixTitle.textContent = currentLang==='en' ? '⚗ Substance Mixer' : '⚗ Mezclador de Sustancias';

  // Stats labels
  const statLabels = document.querySelectorAll('.stat-label');
  if (statLabels[0]) statLabels[0].textContent = t('stat_substances');
  if (statLabels[1]) statLabels[1].textContent = t('stat_families');

  // Mixer button
  const mixerBtn = document.querySelector('.mixer-btn');
  if (mixerBtn) mixerBtn.textContent = t('mixer_btn');

  // Search placeholder
  const searchEl = document.getElementById('search');
  if (searchEl) searchEl.placeholder = t('search_placeholder');

  // Filter buttons
  const filterBtns = document.querySelectorAll('.filter-btn');
  const filterKeys = ['filter_all','filter_high','filter_mid','filter_low'];
  filterBtns.forEach((btn, i) => { if (filterKeys[i]) btn.textContent = t(filterKeys[i]); });

  // Sidebar title
  const sidebarTitle = document.querySelector('.sidebar-title');
  if (sidebarTitle) sidebarTitle.textContent = t('sidebar_title');

  // Page title
  document.title = currentLang==='en' ? 'Ciclodex – Substance Encyclopedia' : 'Ciclodex – Enciclopedia de Sustancias';
  // Re-render sidebar and content to pick up translated strings
  renderSidebar();
  renderContent();
}

  inner.classList.remove('fx-0','fx-1','fx-2','fx-3','fx-4','fx-5','fx-6','fx-7','fx-8','fx-9','fx-10');
  // Also remove ::before overlay for crystal prism
  currentFx = (currentFx + 1) % 11;
  inner.classList.add('fx-' + currentFx);
  if (label) {
    label.style.opacity = '0';
    setTimeout(() => {
      label.textContent = FX_NAMES[currentFx];
      label.style.opacity = '1';
    }, 200);
  }
}
