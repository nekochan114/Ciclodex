<script>
// ══════════════════════════════════════════════════════
//  BIO-3D MODULE — ADN Codón + Neurona 3D
// ══════════════════════════════════════════════════════
const CODON_TABLE = {
  'AAA':'Lys','AAT':'Asn','AAG':'Lys','AAC':'Asn',
  'ATA':'Ile','ATT':'Ile','ATG':'Met (INICIO)','ATC':'Ile',
  'AGA':'Arg','AGT':'Ser','AGG':'Arg','AGC':'Ser',
  'ACA':'Thr','ACT':'Thr','ACG':'Thr','ACC':'Thr',
  'TAA':'STOP','TAT':'Tyr','TAG':'STOP','TAC':'Tyr',
  'TTA':'Leu','TTT':'Phe','TTG':'Leu','TTC':'Phe',
  'TGA':'STOP','TGT':'Cys','TGG':'Trp','TGC':'Cys',
  'TCA':'Ser','TCT':'Ser','TCG':'Ser','TCC':'Ser',
  'GAA':'Glu','GAT':'Asp','GAG':'Glu','GAC':'Asp',
  'GTA':'Val','GTT':'Val','GTG':'Val','GTC':'Val',
  'GGA':'Gly','GGT':'Gly','GGG':'Gly','GGC':'Gly',
  'GCA':'Ala','GCT':'Ala','GCG':'Ala','GCC':'Ala',
  'CAA':'Gln','CAT':'His','CAG':'Gln','CAC':'His',
  'CTA':'Leu','CTT':'Leu','CTG':'Leu','CTC':'Leu',
  'CGA':'Arg','CGT':'Arg','CGG':'Arg','CGC':'Arg',
  'CCA':'Pro','CCT':'Pro','CCG':'Pro','CCC':'Pro',
};
const BASE_PAIR = {A:'T',T:'A',G:'C',C:'G'};
const BASE_COLORS = {A:'#00ff64',T:'#ff5050',G:'#5096ff',C:'#ffc800'};
const AA_NAMES = {
  'Met (INICIO)':'Metionina · Inicio de síntesis proteica',
  'STOP':'Codón de parada · Fin de traducción',
  'Lys':'Lisina · Carga positiva, esencial','Asn':'Asparagina · Polar',
  'Ile':'Isoleucina · Hidrofóbica','Arg':'Arginina · Básica',
  'Ser':'Serina · Polar, fosforilable','Thr':'Treonina · Polar hidroxílica',
  'Tyr':'Tirosina · Aromática','Phe':'Fenilalanina · Aromática hidrofóbica',
  'Cys':'Cisteína · Puentes disulfuro','Trp':'Triptófano · Aromática grande',
  'Leu':'Leucina · Hidrofóbica frecuente','Glu':'Glutamato · Ácida',
  'Asp':'Aspartato · Ácida neurotransmisor','Val':'Valina · Hidrofóbica pequeña',
  'Gly':'Glicina · Más pequeña flexible','Ala':'Alanina · Hidrofóbica estable',
  'Gln':'Glutamina · Polar donante N','His':'Histidina · Básica débil',
  'Pro':'Prolina · Rígida ciclo pirrolidina',
};

let dnaMode = 'helix', dnaCodon = ['A','T','G'], dnaAngle = 0, dnaRAF;
const BASES = ['A','T','G','C'];

function buildCodonUI() {
  const disp = document.getElementById('codon-display');
  if (!disp) return;
  disp.innerHTML = '';
  for (let pos = 0; pos < 3; pos++) {
    const col = document.createElement('div');
    col.style.cssText = 'display:flex;flex-direction:column;gap:5px;align-items:center;';
    const lbl = document.createElement('div');
    lbl.style.cssText = 'font-size:0.5rem;color:var(--text-dim);font-family:DM Mono,monospace;letter-spacing:0.1em';
    lbl.textContent = ['1ª','2ª','3ª'][pos];
    col.appendChild(lbl);
    BASES.forEach(b => {
      const el = document.createElement('div');
      el.className = 'bio3d-base '+b+(dnaCodon[pos]===b?' active-base':'');
      el.textContent = b;
      el.onclick = () => { dnaCodon[pos]=b; buildCodonUI(); updateCodonInfo(); };
      col.appendChild(el);
    });
    disp.appendChild(col);
    if (pos<2) {
      const arr = document.createElement('div');
      arr.className = 'bio3d-arrow';
      arr.textContent = '—';
      arr.style.cssText = 'align-self:center;padding-top:20px';
      disp.appendChild(arr);
    }
  }
}
function updateCodonInfo() {
  const key = dnaCodon.join('');
  const aa = CODON_TABLE[key]||'?';
  const el = document.getElementById('codon-aminoacid');
  if (el) el.innerHTML = '<strong>'+aa+'</strong>'+(AA_NAMES[aa]||aa);
}
function randomCodon() { dnaCodon=[0,1,2].map(()=>BASES[Math.floor(Math.random()*4)]); buildCodonUI(); updateCodonInfo(); }
function setDnaMode(m) {
  dnaMode=m;
  ['helix','open','flat'].forEach(n=>document.getElementById('dna-mode-'+n)?.classList.remove('active'));
  document.getElementById('dna-mode-'+m)?.classList.add('active');
}

function startDNA() {
  const canvas = document.getElementById('dna-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    canvas.width = r.width * devicePixelRatio;
    canvas.height = r.height * devicePixelRatio;
  }
  resize();
  new ResizeObserver(resize).observe(canvas.parentElement);

  function drawFrame() {
    const DPR = devicePixelRatio;
    const W = canvas.width/DPR, H = canvas.height/DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);

    const speed = parseFloat(document.getElementById('dna-speed')?.value||1);
    const pairs  = parseInt(document.getElementById('dna-pairs')?.value||8);
    const twist  = parseFloat(document.getElementById('dna-twist')?.value||1.8);
    document.getElementById('dna-speed-val').textContent = speed.toFixed(1);
    document.getElementById('dna-pairs-val').textContent = pairs;
    document.getElementById('dna-twist-val').textContent = twist.toFixed(1);

    dnaAngle += 0.012*speed;
    const cx=W/2, cy=H/2, amp=Math.min(W,H)*0.28;
    const segH = Math.min(H*0.85,400)/pairs;
    const strandA=[],strandB=[];

    for (let i=0;i<=pairs;i++) {
      const t=(i/pairs)*Math.PI*2*twist+dnaAngle;
      const y=cy-(pairs/2*segH)+i*segH;
      let xA,xB;
      if (dnaMode==='flat') { xA=cx-amp*0.4; xB=cx+amp*0.4; }
      else if (dnaMode==='open') { xA=cx+amp*Math.cos(t)*0.8; xB=cx-amp*Math.cos(t+Math.PI*0.7)*0.8; }
      else { xA=cx+amp*Math.cos(t); xB=cx+amp*Math.cos(t+Math.PI); }
      const depth=Math.sin(t);
      strandA.push({x:xA,y,depth,i});
      strandB.push({x:xB,y,depth:-depth,i});
    }

    // Backbones
    const drawBB = (pts,col) => {
      ctx.beginPath();
      pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
      ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.stroke();
    };
    drawBB(strandA,'rgba(45,212,192,0.6)');
    drawBB(strandB,'rgba(139,92,246,0.6)');

    // Rungs z-sorted
    const rungs=[];
    for (let i=0;i<pairs;i++) {
      const pA=strandA[i],pB=strandB[i];
      const base=dnaCodon[i%dnaCodon.length];
      rungs.push({pA,pB,avgD:(pA.depth+pB.depth)/2,base});
    }
    rungs.sort((a,b)=>a.avgD-b.avgD);

    rungs.forEach(({pA,pB,avgD,base}) => {
      const alpha=0.4+0.6*((avgD+1)/2);
      ctx.beginPath(); ctx.moveTo(pA.x,pA.y); ctx.lineTo(pB.x,pB.y);
      ctx.strokeStyle=`rgba(255,255,255,${alpha*0.12})`; ctx.lineWidth=1; ctx.stroke();

      const r=Math.max(3,7+avgD*2);
      [pA,pB].forEach((p,j)=>{
        const b=j===0?base:BASE_PAIR[base];
        ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
        ctx.fillStyle=BASE_COLORS[b]; ctx.globalAlpha=alpha;
        if(avgD>0.3){ctx.shadowColor=BASE_COLORS[b];ctx.shadowBlur=10;}
        ctx.fill(); ctx.shadowBlur=0; ctx.globalAlpha=1;
        if(avgD>0.5&&r>5){
          ctx.font=`bold ${Math.round(r*1.1)}px DM Mono,monospace`;
          ctx.fillStyle='#000'; ctx.globalAlpha=alpha;
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(b,p.x,p.y); ctx.globalAlpha=1;
        }
      });
    });
    dnaRAF=requestAnimationFrame(drawFrame);
  }
  if(dnaRAF) cancelAnimationFrame(dnaRAF);
  dnaRAF=requestAnimationFrame(drawFrame);
}

// ── NEURONA ──────────────────────────────────────────
let neuronType='pyramidal',neuronAngle=0,neuronRAF;
let synapseActive=false,synapseT=0,neuroAutoMode=false,neuroAutoTimer;
const NEURON_TYPES={
  pyramidal:{name:'Neurona Piramidal',info:'Corteza cerebral · Integración cognitiva',color:'#a78bfa',dendrites:5,axonLen:0.7,soma:22},
  purkinje: {name:'Célula de Purkinje',info:'Cerebelo · Control motor fino',color:'#60a5fa',dendrites:8,axonLen:0.5,soma:20},
  motor:    {name:'Neurona Motora',info:'Médula espinal · Control muscular',color:'#34d399',dendrites:4,axonLen:0.9,soma:26},
  bipolar:  {name:'Neurona Bipolar',info:'Retina · Procesamiento visual',color:'#fb923c',dendrites:2,axonLen:0.65,soma:16},
};

function setNeuronType(type) {
  neuronType=type;
  document.querySelectorAll('.neuro-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.neuro-btn').forEach(b=>{ if(b.textContent.toLowerCase().includes(type.slice(0,3))) b.classList.add('active'); });
  const t=NEURON_TYPES[type];
  document.getElementById('neuro-info').innerHTML='<strong>'+t.name+'</strong>'+t.info;
  document.getElementById('neuro-dendrites').value=t.dendrites;
  document.getElementById('neuro-dendrites-val').textContent=t.dendrites;
}
function updateNeuronParam(){
  document.getElementById('neuro-dendrites-val').textContent=document.getElementById('neuro-dendrites').value;
  document.getElementById('neuro-potential-val').textContent=document.getElementById('neuro-potential').value;
}
function fireSynapse(){ if(synapseActive)return; synapseActive=true; synapseT=0; }
function toggleNeuroAuto(){
  neuroAutoMode=!neuroAutoMode;
  const btn=document.getElementById('auto-btn');
  if(btn) btn.textContent=neuroAutoMode?'⏸ Auto':'▶ Auto';
  clearInterval(neuroAutoTimer);
  if(neuroAutoMode) neuroAutoTimer=setInterval(fireSynapse,2200);
}
function resetNeuron(){ synapseActive=false;synapseT=0;neuroAutoMode=false;clearInterval(neuroAutoTimer); document.getElementById('auto-btn').textContent='▶ Auto'; }

function startNeuron() {
  const canvas=document.getElementById('neuron-canvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  function resize(){
    const r=canvas.parentElement.getBoundingClientRect();
    canvas.width=r.width*devicePixelRatio; canvas.height=r.height*devicePixelRatio;
  }
  resize(); new ResizeObserver(resize).observe(canvas.parentElement);

  function draw(){
    const DPR=devicePixelRatio, W=canvas.width/DPR, H=canvas.height/DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);

    const speed=parseFloat(document.getElementById('neuro-speed')?.value||1.5);
    neuronAngle+=0.008*speed;
    if(synapseActive){ synapseT+=0.025*speed; if(synapseT>1){synapseActive=false;synapseT=0;} }

    const t=NEURON_TYPES[neuronType];
    const col=t.color, cx=W*0.45, cy=H*0.42, soma=t.soma;
    const ndend=parseInt(document.getElementById('neuro-dendrites')?.value||t.dendrites);
    const potential=parseInt(document.getElementById('neuro-potential')?.value||70);

    // Dendrites
    for(let d=0;d<ndend;d++){
      const ang=(d/ndend)*Math.PI*2+neuronAngle*0.4;
      const len=(60+Math.sin(neuronAngle+d)*20)*(H/300);
      const ex=cx+Math.cos(ang)*len, ey=cy+Math.sin(ang)*len*0.6;
      const cp1x=cx+Math.cos(ang+0.4)*len*0.5, cp1y=cy+Math.sin(ang+0.4)*len*0.5;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.quadraticCurveTo(cp1x,cp1y,ex,ey);
      const pulse=synapseActive?synapseT*0.5:0;
      ctx.strokeStyle=col; ctx.lineWidth=1.5+pulse*2; ctx.globalAlpha=0.5+pulse*0.3; ctx.stroke(); ctx.globalAlpha=1;

      // Spines
      for(let s=0;s<4;s++){
        const frac=(s+1)/5;
        const sx=cx+(ex-cx)*frac+Math.cos(ang+Math.PI/2)*8*(s%2?1:-1);
        const sy=cy+(ey-cy)*frac+Math.sin(ang+Math.PI/2)*8*(s%2?1:-1);
        ctx.beginPath(); ctx.arc(sx,sy,2+pulse,0,Math.PI*2);
        ctx.fillStyle=col; ctx.globalAlpha=0.4+pulse*0.4;
        if(pulse>0.1){ctx.shadowColor=col;ctx.shadowBlur=8;}
        ctx.fill(); ctx.shadowBlur=0; ctx.globalAlpha=1;
      }
    }

    // Axon
    const axLen=t.axonLen*H*0.48;
    const axAng=Math.PI/2+Math.sin(neuronAngle*0.2)*0.15;
    const aex=cx+Math.cos(axAng)*axLen, aey=cy+Math.sin(axAng)*axLen;
    ctx.beginPath(); ctx.moveTo(cx,cy+soma); ctx.lineTo(aex,aey+soma);
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.globalAlpha=0.7; ctx.stroke(); ctx.globalAlpha=1;

    // Myelin
    for(let m=0;m<4;m++){
      const mt=(m+0.5)/4;
      const mx=cx+(aex-cx)*mt, my=(cy+soma)+(aey+soma-cy-soma)*mt;
      ctx.beginPath(); ctx.ellipse(mx,my,10,5,axAng,0,Math.PI*2);
      ctx.strokeStyle=col; ctx.lineWidth=3; ctx.globalAlpha=0.22; ctx.stroke();
      if(synapseActive&&synapseT>mt*0.8){
        ctx.beginPath(); ctx.arc(mx,my,5,0,Math.PI*2);
        ctx.fillStyle=col; ctx.globalAlpha=Math.min(1,(synapseT-mt*0.8)*4);
        ctx.shadowColor=col; ctx.shadowBlur=18; ctx.fill(); ctx.shadowBlur=0;
      }
      ctx.globalAlpha=1;
    }

    // Terminals
    for(let k=0;k<4;k++){
      const a2=axAng+(k-1.5)*0.28, tl=20+k*5;
      const tx=aex+Math.cos(a2)*tl, ty=aey+soma+Math.sin(a2)*tl;
      ctx.beginPath(); ctx.moveTo(aex,aey+soma); ctx.lineTo(tx,ty);
      ctx.strokeStyle=col; ctx.lineWidth=1; ctx.globalAlpha=0.5; ctx.stroke();
      const kr=synapseActive&&synapseT>0.7?5+(synapseT-0.7)*18:4;
      ctx.beginPath(); ctx.arc(tx,ty,kr,0,Math.PI*2);
      ctx.fillStyle=col; ctx.globalAlpha=synapseActive?0.4+synapseT*0.4:0.35;
      if(synapseActive&&synapseT>0.7){ctx.shadowColor=col;ctx.shadowBlur=14;}
      ctx.fill(); ctx.shadowBlur=0; ctx.globalAlpha=1;
    }

    // Soma glow
    const sGlow=synapseActive?synapseT*0.5:0;
    ctx.beginPath(); ctx.arc(cx,cy,soma*2,0,Math.PI*2);
    const g=ctx.createRadialGradient(cx,cy,soma*0.2,cx,cy,soma*2);
    g.addColorStop(0,col+'44'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.globalAlpha=0.3+sGlow; ctx.fill(); ctx.globalAlpha=1;

    ctx.beginPath(); ctx.arc(cx,cy,soma,0,Math.PI*2);
    ctx.fillStyle='#0a0c10'; ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=2+sGlow*3;
    ctx.shadowColor=col; ctx.shadowBlur=10+sGlow*25; ctx.stroke(); ctx.shadowBlur=0;

    ctx.beginPath(); ctx.arc(cx,cy,soma*0.45,0,Math.PI*2);
    ctx.fillStyle=col+'22'; ctx.fill();
    ctx.strokeStyle=col+'66'; ctx.lineWidth=1; ctx.stroke();

    // Potential arc
    const pf=potential/100;
    ctx.beginPath(); ctx.arc(cx,cy,soma+7,-Math.PI/2,-Math.PI/2+Math.PI*2*pf);
    ctx.strokeStyle=col; ctx.lineWidth=3; ctx.globalAlpha=0.7; ctx.stroke(); ctx.globalAlpha=1;

    if(synapseActive){
      ctx.font='bold 11px DM Mono,monospace'; ctx.fillStyle=col;
      ctx.globalAlpha=Math.min(1,synapseT<0.5?synapseT*2:(1-synapseT)*2);
      ctx.textAlign='center';
      ctx.fillText('⚡ +'+potential+'mV',cx,cy-soma-12); ctx.globalAlpha=1;
    }

    neuronRAF=requestAnimationFrame(draw);
  }
  if(neuronRAF) cancelAnimationFrame(neuronRAF);
  neuronRAF=requestAnimationFrame(draw);
}

function initBio3D(){
  buildCodonUI(); updateCodonInfo(); startDNA(); startNeuron();
  ['dna-speed','dna-pairs','dna-twist'].forEach(id=>{
    document.getElementById(id)?.addEventListener('input',()=>{
      const v=parseFloat(document.getElementById(id).value);
      document.getElementById(id+'-val').textContent=id==='dna-pairs'?Math.round(v):v.toFixed(1);
    });
  });
  const obs=new IntersectionObserver(entries=>entries.forEach(e=>{
    if(!e.isIntersecting){cancelAnimationFrame(dnaRAF);cancelAnimationFrame(neuronRAF);}
    else{startDNA();startNeuron();}
  }),{threshold:0.1});
  const s=document.getElementById('bio3d-section');
  if(s) obs.observe(s);
}
// Bio3D initializes when user navigates to the lab view
// initBio3D() is called from renderContent() when activeFamily === '__bio3d__'
// (auto-init removed — canvases are injected dynamically)
</script>
