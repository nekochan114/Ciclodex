}
.lang-btn:hover { color: var(--text-secondary); }
.lang-btn.active {
  background: rgba(45,212,192,0.15);
  color: var(--accent-teal);
  border: 1px solid rgba(45,212,192,0.3);
}
.lang-divider {
  width: 1px;
  height: 12px;
  background: rgba(255,255,255,0.1);
  flex-shrink: 0;
}


/* ─── HERO BANNER ──────────────────────────────────────────────── */
/* ─── PSYCHEDELIC HERO ────────────────────────────────────────────── */
.hero-banner {
  position: relative;
  width: 100%;
  height: 300px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}
.hero-banner::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 3px,
    rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px
  );
  pointer-events: none;
  z-index: 10;
  animation: scanline-drift 14s linear infinite;
}
@keyframes scanline-drift {
  from { background-position: 0 0; }
  to   { background-position: 0 200px; }
}
.hero-banner::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to bottom, var(--bg) 0%, transparent 20%, transparent 80%, var(--bg) 100%),
    linear-gradient(to right,  var(--bg) 0%, transparent 20%, transparent 82%, var(--bg) 100%);
  pointer-events: none;
  z-index: 9;
}

/* Borde arcoiris sutil */
.hero-img-wrap {
  position: relative;
  display: inline-block;
  z-index: 3;
  padding: 3px;
  border-radius: 50%;
  background: conic-gradient(
    rgba(255,0,0,0.55), rgba(255,136,0,0.55), rgba(255,238,0,0.55),
    rgba(0,255,68,0.55), rgba(0,238,255,0.55), rgba(51,102,255,0.55),
    rgba(221,0,255,0.55), rgba(255,0,0,0.55)
  );
  animation: rainbow-spin 5s linear infinite, melt-border 20s ease-in-out infinite;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.hero-img-wrap:active { transform: scale(0.96); }

@keyframes melt-border {
  0%,100%{ border-radius:50%; }
  15%    { border-radius:48% 52% 55% 45% / 52% 46% 54% 48%; }
  30%    { border-radius:46% 54% 48% 52% / 56% 44% 52% 48%; }
  45%    { border-radius:50% 50% 60% 40% / 44% 56% 44% 56%; }
  60%    { border-radius:42% 58% 52% 48% / 58% 42% 60% 40%; }
  75%    { border-radius:55% 45% 46% 54% / 48% 52% 46% 54%; }
  88%    { border-radius:38% 62% 54% 46% / 60% 40% 58% 42%; }
}

.hero-img-inner {
  border-radius: inherit;
  overflow: hidden;
  width: 210px;
  height: 210px;
  position: relative;
  background: #000;
  animation: rainbow-spin-reverse 3s linear infinite, melt-inner 20s ease-in-out infinite;
}
@keyframes rainbow-spin-reverse {
  from { transform: rotate(0deg); }
  to   { transform: rotate(-360deg); }
}
@keyframes melt-inner {
  0%,100%{ border-radius:50%; }
  18%    { border-radius:46% 54% 56% 44% / 50% 48% 52% 50%; }
  35%    { border-radius:44% 56% 46% 54% / 58% 42% 56% 44%; }
  52%    { border-radius:50% 50% 62% 38% / 40% 60% 40% 60%; }
  68%    { border-radius:40% 60% 50% 50% / 60% 40% 62% 38%; }
  82%    { border-radius:54% 46% 44% 56% / 46% 54% 44% 56%; }
}

/* Imagen base — sin glitch, solo glow suave */
.hero-img-inner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
  position: relative;
  z-index: 1;
  filter: saturate(1.15) contrast(1.05);
  transition: filter 0.6s ease;
  animation: base-glow 6s ease-in-out infinite;
}
@keyframes base-glow {
  0%,100% { filter: saturate(1.15) contrast(1.05) drop-shadow(0 0 8px rgba(45,212,192,0.3)); }
  50%     { filter: saturate(1.3)  contrast(1.08) drop-shadow(0 0 16px rgba(45,212,192,0.5)); }
}

/* ── EFFECT INDICATOR ─────────────────────────── */
.hero-fx-label {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.58rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  font-family: 'DM Mono', monospace;
  pointer-events: none;
  z-index: 11;
  transition: opacity 0.5s ease;
}

/* ── 10 PSYCHEDELIC EFFECTS ───────────────────── */

/* 0 — base (ningún efecto activo) */
.hero-img-inner.fx-0 img {
  filter: saturate(1.15) contrast(1.05);
  animation: base-glow 6s ease-in-out infinite;
}

/* 1 — Liquid Aurora */
.hero-img-inner.fx-1 img {
  animation: fx-aurora 3s ease-in-out infinite;
}
@keyframes fx-aurora {
  0%   { filter: hue-rotate(0deg)   saturate(3) brightness(1.1) contrast(1.2); }
  25%  { filter: hue-rotate(90deg)  saturate(4) brightness(0.9) contrast(1.4); }
  50%  { filter: hue-rotate(180deg) saturate(3) brightness(1.2) contrast(1.1); }
  75%  { filter: hue-rotate(270deg) saturate(5) brightness(0.95) contrast(1.3); }
  100% { filter: hue-rotate(360deg) saturate(3) brightness(1.1) contrast(1.2); }
}

/* 2 — Thermal Vision */
.hero-img-inner.fx-2 img {
  animation: fx-thermal 2.5s steps(8) infinite;
}
@keyframes fx-thermal {
  0%   { filter: hue-rotate(240deg) saturate(8) contrast(2) brightness(0.7); }
  12%  { filter: hue-rotate(200deg) saturate(10) contrast(2.5) brightness(0.8); }
  25%  { filter: hue-rotate(140deg) saturate(8) contrast(2) brightness(0.9); }
  37%  { filter: hue-rotate(60deg)  saturate(10) contrast(2.5) brightness(1); }
  50%  { filter: hue-rotate(20deg)  saturate(8) contrast(2) brightness(1.1); }
  62%  { filter: hue-rotate(0deg)   saturate(10) contrast(2.5) brightness(1.2); }
  75%  { filter: hue-rotate(330deg) saturate(8) contrast(2) brightness(1); }
  87%  { filter: hue-rotate(280deg) saturate(10) contrast(2.5) brightness(0.8); }
  100% { filter: hue-rotate(240deg) saturate(8) contrast(2) brightness(0.7); }
}

/* 3 — Neon Pulse */
.hero-img-inner.fx-3 img {
  animation: fx-neon 1.8s ease-in-out infinite;
}
@keyframes fx-neon {
  0%,100% { filter: saturate(2) contrast(1.5) brightness(1.3)
    drop-shadow(0 0 12px #ff00ff) drop-shadow(0 0 30px #ff00ff66); }
  33%     { filter: saturate(2) contrast(1.5) brightness(1.2)
    drop-shadow(0 0 12px #00ffff) drop-shadow(0 0 30px #00ffff66); }
  66%     { filter: saturate(2) contrast(1.5) brightness(1.4)
    drop-shadow(0 0 12px #ffff00) drop-shadow(0 0 30px #ffff0066); }
}

/* 4 — Subtle Rainbow Glow (like mascot) + Cinematic Glitch on hover */
.hero-img-inner.fx-4 img {
  animation: fx-subtle-glow 5s linear infinite;
  position: relative;
  z-index: 1;
}
.hero-img-inner.fx-4 {
  animation: rainbow-spin-reverse 5s linear infinite, melt-inner 20s ease-in-out infinite;
}
@keyframes fx-subtle-glow {
  0%   { filter: saturate(1.2) contrast(1.05) drop-shadow(0 0 3px #ff000055) drop-shadow(0 0 8px #ff000022); }
  14%  { filter: saturate(1.2) contrast(1.05) drop-shadow(0 0 3px #ff880055) drop-shadow(0 0 8px #ff880022); }
  28%  { filter: saturate(1.2) contrast(1.05) drop-shadow(0 0 3px #ffee0055) drop-shadow(0 0 8px #ffee0022); }
  42%  { filter: saturate(1.2) contrast(1.05) drop-shadow(0 0 3px #00ff4455) drop-shadow(0 0 8px #00ff4422); }
  57%  { filter: saturate(1.2) contrast(1.05) drop-shadow(0 0 3px #00eeff55) drop-shadow(0 0 8px #00eeff22); }
  71%  { filter: saturate(1.2) contrast(1.05) drop-shadow(0 0 3px #3366ff55) drop-shadow(0 0 8px #3366ff22); }
  85%  { filter: saturate(1.2) contrast(1.05) drop-shadow(0 0 3px #dd00ff55) drop-shadow(0 0 8px #dd00ff22); }
  100% { filter: saturate(1.2) contrast(1.05) drop-shadow(0 0 3px #ff000055) drop-shadow(0 0 8px #ff000022); }
}

/* ── GLITCH HOVER: chromatic aberration + scanlines + transform ── */

/* Canal rojo — desplazado a la izquierda */
.hero-img-inner.fx-4::before {
  content: "";
  position: absolute; inset: 0; border-radius: inherit; z-index: 4;
  background-image: inherit;
  pointer-events: none; opacity: 0;
  mix-blend-mode: screen;
  transition: opacity 0.4s ease;
}
/* Overlay de scanlines */
.hero-img-inner.fx-4::after {
  content: "";
  position: absolute; inset: 0; border-radius: inherit; z-index: 6;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px, transparent 3px,
    rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
  );
  pointer-events: none; opacity: 0;
  transition: opacity 0.4s ease;
}

/* Al hacer hover: activar los overlays y el glitch en la imagen */
.hero-img-wrap:hover .hero-img-inner.fx-4::before { opacity: 1; }
.hero-img-wrap:hover .hero-img-inner.fx-4::after  { opacity: 1; }

.hero-img-wrap:hover .hero-img-inner.fx-4 img {
  animation: fx-cinematic-glitch 3.5s ease-in-out infinite;
}
@keyframes fx-cinematic-glitch {
  /* Fase 0: imagen normal, entrando suave */
  0%    { filter: saturate(1.2) contrast(1.05); transform: translate(0,0) scaleX(1); }

  /* Fase 1: primer glitch — aberración cromática suave */
  8%    { filter: saturate(1.4) contrast(1.1) hue-rotate(0deg)
            drop-shadow(-4px 0 0 rgba(255,0,80,0.7))
            drop-shadow(4px 0 0 rgba(0,220,255,0.7)); transform: translate(0,0) scaleX(1); }
  10%   { filter: saturate(1.4) contrast(1.15) hue-rotate(5deg)
            drop-shadow(-6px 0 0 rgba(255,0,80,0.85))
            drop-shadow(6px 0 0 rgba(0,220,255,0.85)); transform: translate(-2px, 0) scaleX(1.008); }
  12%   { filter: saturate(1.2) contrast(1.05); transform: translate(0,0) scaleX(1); }

  /* Fase 2: calma — image "breathes" con saturación */
  25%   { filter: saturate(1.5) contrast(1.08) brightness(1.05); transform: translate(0,0) scale(1.01); }
  35%   { filter: saturate(1.2) contrast(1.05); transform: translate(0,0) scale(1); }

  /* Fase 3: glitch más elaborado — split horizontal + inversión parcial */
  48%   { filter: saturate(1.2) contrast(1.05); transform: translate(0,0); }
  50%   { filter: saturate(2.5) contrast(1.3) hue-rotate(160deg) brightness(1.15)
            drop-shadow(-8px 0 0 rgba(255,0,80,0.6))
            drop-shadow(8px 0 0 rgba(0,220,255,0.6)); transform: translate(3px, 0) skewX(-1.5deg); }
  51%   { filter: saturate(3) contrast(1.5) hue-rotate(-20deg) brightness(0.88)
            drop-shadow(-3px 0 0 rgba(255,200,0,0.5))
            drop-shadow(3px 0 0 rgba(0,100,255,0.5)); transform: translate(-3px, 1px) skewX(1deg); }
  52%   { filter: saturate(2) contrast(1.2) hue-rotate(80deg)
            drop-shadow(-5px 0 0 rgba(255,0,80,0.4))
            drop-shadow(5px 0 0 rgba(0,255,180,0.4)); transform: translate(1px, -1px); }
  54%   { filter: saturate(1.2) contrast(1.05); transform: translate(0,0) skewX(0deg); }

  /* Fase 4: transformación lenta — vaporwave drift */
  65%   { filter: saturate(1.8) contrast(1.12) hue-rotate(200deg) brightness(0.95)
            drop-shadow(0 0 12px rgba(180,50,255,0.4)); transform: scale(1.015) translate(0, -2px); }
  75%   { filter: saturate(1.6) contrast(1.1) hue-rotate(220deg)
            drop-shadow(0 0 16px rgba(0,200,255,0.35)); transform: scale(1.01) translate(0, 0); }
  82%   { filter: saturate(1.2) contrast(1.05); transform: scale(1) translate(0,0); }

  /* Fase 5: glitch final rápido antes de reiniciar */
  90%   { filter: saturate(1.2) contrast(1.05); transform: translate(0,0); }
  91%   { filter: saturate(4) contrast(1.8) hue-rotate(310deg) brightness(1.2)
            drop-shadow(-10px 0 0 rgba(255,0,80,0.9))
            drop-shadow(10px 0 0 rgba(0,255,220,0.9)); transform: translate(-4px, 0) scaleX(1.012); }
  92%   { filter: saturate(1) contrast(1.4) brightness(0.85)
            drop-shadow(2px 0 0 rgba(255,80,0,0.6)); transform: translate(4px, 0); }
  93%   { filter: saturate(1.2) contrast(1.05); transform: translate(0,0); }
  100%  { filter: saturate(1.2) contrast(1.05); transform: translate(0,0); }
}

/* 5 — Infrared Dream */
.hero-img-inner.fx-5 img {
  animation: fx-infrared 5s ease-in-out infinite;
}
@keyframes fx-infrared {
  0%,100% { filter: sepia(1) saturate(4) hue-rotate(300deg) contrast(1.5) brightness(1.2); }
  25%     { filter: sepia(1) saturate(6) hue-rotate(330deg) contrast(2)   brightness(0.9); }
  50%     { filter: sepia(0.5) saturate(8) hue-rotate(310deg) contrast(1.8) brightness(1.3); }
  75%     { filter: sepia(1) saturate(5) hue-rotate(280deg) contrast(1.6) brightness(1); }
}

/* 6 — Crystal Prism */
.hero-img-inner.fx-6 img {
  animation: fx-prism 3s linear infinite;
}
.hero-img-inner.fx-6::before {
  content: "";
  position: absolute; inset: 0; border-radius: inherit;
  background: conic-gradient(from 0deg, #ff000033, #ff880033, #ffff0033, #00ff0033, #00ffff33, #0000ff33, #ff00ff33, #ff000033);
  animation: prism-spin 3s linear infinite;
  z-index: 5; mix-blend-mode: color-dodge; pointer-events: none;
}
@keyframes prism-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes fx-prism {
  0%,100% { filter: saturate(2) contrast(1.3) brightness(1.1); }
  50%     { filter: saturate(3) contrast(1.6) brightness(1.3) hue-rotate(30deg); }
}

/* 7 — Vaporwave */
.hero-img-inner.fx-7 img {
  animation: fx-vapor 4s ease-in-out infinite;
}
@keyframes fx-vapor {
  0%,100% { filter: saturate(2) contrast(1.3) hue-rotate(280deg) brightness(1.1)
    drop-shadow(0 0 20px #ff71ce88) drop-shadow(0 0 40px #b967ff44); }
  50%     { filter: saturate(3) contrast(1.5) hue-rotate(200deg) brightness(0.9)
    drop-shadow(0 0 20px #01cdfe88) drop-shadow(0 0 40px #05ffa144); }
}

/* 8 — X-Ray Soul */
.hero-img-inner.fx-8 img {
  animation: fx-xray 3.5s ease-in-out infinite;
}
@keyframes fx-xray {
  0%,100% { filter: invert(0.8) saturate(0) contrast(3) brightness(1.4) hue-rotate(180deg); }
  30%     { filter: invert(0.6) saturate(0.3) contrast(2.5) brightness(1.2) hue-rotate(200deg); }
  60%     { filter: invert(1)   saturate(0.1) contrast(4)   brightness(1.6) hue-rotate(170deg); }
}

/* 9 — Golden God */
.hero-img-inner.fx-9 img {
  animation: fx-golden 5s ease-in-out infinite;
}
@keyframes fx-golden {
  0%,100% { filter: sepia(1) saturate(4) brightness(1.3) contrast(1.4)
    drop-shadow(0 0 20px #ffd70088) drop-shadow(0 0 40px #ff8c0044); }
  25%     { filter: sepia(0.7) saturate(6) brightness(1.5) contrast(1.2) hue-rotate(10deg)
    drop-shadow(0 0 30px #ffaa0099) drop-shadow(0 0 60px #ff660033); }
  75%     { filter: sepia(1) saturate(5) brightness(1.1) contrast(1.6) hue-rotate(-10deg)
    drop-shadow(0 0 15px #ffe08888) drop-shadow(0 0 35px #ff660066); }
}

/* 10 — Deep Ocean */
.hero-img-inner.fx-10 img {
  animation: fx-ocean 6s ease-in-out infinite;
}
.hero-img-inner.fx-10 {
  animation: rainbow-spin-reverse 3s linear infinite, melt-inner 20s ease-in-out infinite, ocean-ripple 6s ease-in-out infinite;
}
@keyframes fx-ocean {
  0%,100% { filter: saturate(2) contrast(1.4) hue-rotate(180deg) brightness(0.8)
    drop-shadow(0 0 20px #00bfff88); }
  30%     { filter: saturate(3) contrast(1.6) hue-rotate(200deg) brightness(0.7)
    drop-shadow(0 0 30px #0066ff66); }
  60%     { filter: saturate(4) contrast(1.2) hue-rotate(160deg) brightness(0.9)
    drop-shadow(0 0 25px #00eeff88); }
}
@keyframes ocean-ripple {
  0%,100% { border-radius: 50%; }
  25%  { border-radius: 45% 55% 60% 40% / 50% 45% 55% 50%; }
  50%  { border-radius: 55% 45% 40% 60% / 45% 55% 45% 55%; }
  75%  { border-radius: 50% 50% 55% 45% / 55% 45% 50% 50%; }
}

/* No-fx mode */
.no-fx .hero-img-wrap  { animation: rainbow-spin 3s linear infinite !important; border-radius: 50% !important; }
.no-fx .hero-img-inner { animation: rainbow-spin-reverse 3s linear infinite !important; border-radius: 50% !important; }
.no-fx .hero-img-inner img { animation: none !important; filter: saturate(1.15) contrast(1.05) !important; }


/* ══════════════════════════════════════════════════════════
   MÓDULO BIO-3D — Codón ADN & Neurona (Vista separada)

.bio3d-section {
  display: none;
  width: 100%;
  padding: 32px 24px 60px;
  background: linear-gradient(180deg, var(--bg) 0%, #050710 50%, var(--bg) 100%);
  position: relative;
  overflow: hidden;
  animation: bio3d-fadein 0.35s ease;
}
.bio3d-section.bio3d-visible {
  display: block;
}
@keyframes bio3d-fadein {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.bio3d-section::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 40% at 25% 50%, rgba(45,212,192,0.05) 0%, transparent 70%),
              radial-gradient(ellipse 60% 40% at 75% 50%, rgba(139,92,246,0.05) 0%, transparent 70%);
  pointer-events: none;
}
.bio3d-title {
  text-align: center;
  font-family: 'DM Serif Display', serif;
  font-size: 1.4rem;
  color: var(--text-primary);
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}
.bio3d-subtitle {
  text-align: center;
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 32px;
}
.bio3d-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  max-width: 1000px;
  margin: 0 auto;
}
@media (max-width: 700px) {
  .bio3d-grid { grid-template-columns: 1fr; }
}
.bio3d-panel {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.bio3d-panel-title {
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent-teal);
  font-family: 'DM Mono', monospace;
  display: flex;
  align-items: center;
  gap: 8px;
}
.bio3d-panel-title span { color: var(--text-dim); }
.bio3d-canvas-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  background: #020408;
  border: 1px solid rgba(45,212,192,0.1);
}
.bio3d-canvas-wrap canvas {
  width: 100% !important;
  height: 100% !important;
  display: block;
}
.bio3d-controls {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bio3d-control-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.bio3d-control-label {
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  min-width: 80px;
}
.bio3d-slider {
  flex: 1;
  -webkit-appearance: none;
  height: 3px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
  cursor: pointer;
}
.bio3d-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent-teal);
  cursor: pointer;
  box-shadow: 0 0 8px rgba(45,212,192,0.5);
  transition: box-shadow 0.2s;
}
.bio3d-slider::-webkit-slider-thumb:hover {
  box-shadow: 0 0 16px rgba(45,212,192,0.8);
}
.bio3d-slider-val {

}
.bio3d-btn-row {
  display: flex;

}
.bio3d-btn {

  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--text-secondary);

  font-family: 'DM Mono', monospace;
  cursor: pointer;
  transition: all 0.2s;
}
.bio3d-btn:hover {
  border-color: var(--accent-teal);
  color: var(--accent-teal);
  background: rgba(45,212,192,0.05);
}
.bio3d-btn.active {
  border-color: var(--accent-teal);

}
.bio3d-codon-display {

}
.bio3d-base {

  font-family: 'DM Mono', monospace;

.bio3d-base:hover { transform: scale(1.15); }
.bio3d-base.A { background: rgba(0,255,100,0.15); color: #00ff64; border-color: rgba(0,255,100,0.3); }

.bio3d-arrow {
  color: var(--text-dim);

}
.bio3d-aminoacid {
  text-align: center;
  font-size: 0.65rem;
  color: var(--text-secondary);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.08em;
}
.bio3d-aminoacid strong { color: var(--accent-teal); font-size: 0.9rem; display: block; }

// ─── FACE HELPERS ─────────────────────────────────────────────────────────────
function getFaceEmoji(score) {
const faces = ['😊','🙂','😐','😟','☠️'];
return faces[Math.min(score,5) - 1];
}
function getFaceColor(score) {
const colors = ['#10b981','#84cc16','#f59e0b','#f97316','#ef4444'];
return colors[Math.min(score,5) - 1];
}
function getFaceLabel(score) {
const labels = ['Muy bajo','Bajo','Moderado','Alto','Extremo'];
return labels[Math.min(score,5) - 1];
}
function renderScaleBar(score, color, cls='') {
let dots = '';
for (let i = 1; i <= 5; i++) {
const on = i <= score;
dots += `<span class="scale-pip ${on ? 'on' : ''} ${cls}" data-i="${i}" style="${on ? `background:${color}` : ''}"></span>`;
}
return dots;
}
function renderRatingsCard(ratings) {
if (!ratings) return '';
const cp = getFaceColor(ratings.peligro);
const cm = getFaceColor(ratings.mortalidad);
return `<div class="card-ratings">
<div class="card-rating-row">
<span class="card-rating-emoji" title="${getFaceLabel(ratings.peligro)} — ${ratings.peligro}/5">${getFaceEmoji(ratings.peligro)}</span>
<div class="card-rating-info">
<span class="card-rating-lbl">${_en()?'Danger':'Peligro'}</span>
<div class="scale-bar">${renderScaleBar(ratings.peligro, cp)}</div>
</div>
<span class="card-rating-num" style="color:${cp}">${ratings.peligro}<span class="card-rating-denom">/5</span></span>
</div>
<div class="card-rating-row">
<span class="card-rating-emoji" title="${getFaceLabel(ratings.mortalidad)} — ${ratings.mortalidad}/5">${getFaceEmoji(ratings.mortalidad)}</span>
<div class="card-rating-info">
<span class="card-rating-lbl">${_en()?'Mortality':'Mortalidad'}</span>
<div class="scale-bar">${renderScaleBar(ratings.mortalidad, cm)}</div>
</div>
<span class="card-rating-num" style="color:${cm}">${ratings.mortalidad}<span class="card-rating-denom">/5</span></span>
</div>
</div>`;
}
function renderRatingsModal(ratings) {
if (!ratings) return '';

const cm = getFaceColor(ratings.mortalidad);
return `

// ─── MIXER STATE ───────────────────────────────────────────────────────────
let mixerSelected = [];


function openMixerWith(drugName) {
  mixerSelected = [drugName];
  document.getElementById('mixer-overlay').classList.add('open');
  renderMixerList('');
  renderMixerSelected();
  document.getElementById('mixer-result').innerHTML = '';
  document.getElementById('mixer-search').value = '';
  // Show a hint
  const hint = document.getElementById('mixer-preload-hint');
  if(hint) { hint.textContent = currentLang==='en' ? `"${drugName}" added. Select what to mix it with.` : `"${drugName}" ya añadida. Selecciona con quién mezclarla.`; hint.style.display='block'; }
  // Close drug modal if open
  document.getElementById('modal-overlay').classList.remove('open');
}

function openMixer() {
mixerSelected = [];
document.getElementById('mixer-overlay').classList.add('open');
renderMixerList('');
renderMixerSelected();
document.getElementById('mixer-result').innerHTML = '';
document.getElementById('mixer-search').value = '';
document.getElementById('mixer-search').focus();
}

function closeMixer() {
document.getElementById('mixer-overlay').classList.remove('open');
}

function closeMixerOutside(e) {
if (e.target === document.getElementById('mixer-overlay')) closeMixer();
}

function filterMixerList() {
renderMixerList(document.getElementById('mixer-search').value.toLowerCase());
}

function renderFaces(score) {
  return [1,2,3,4,5].map(i =>
    `<span style="font-size:1.1rem;opacity:${i<=score?1:0.15}">${getFaceEmoji(score)}</span>`
  ).join('');
}

const list = document.getElementById('mixer-list');

families.forEach(f => {
f.drugs.forEach(d => {
const searchStr = (d.name + ' ' + d.brand).toLowerCase();
if (query && !searchStr.includes(query)) return;
const sel = mixerSelected.includes(d.name);
const r = d.ratings;

function toggleMixerItem(name) {
const idx = mixerSelected.indexOf(name);
if (idx === -1) {
  mixerSelected.push(name);
  // Auto-clear search so user can type the next substance immediately
  const searchEl = document.getElementById('mixer-search');
  searchEl.value = '';
  searchEl.focus();
} else {
  mixerSelected.splice(idx, 1);
}
renderMixerList(document.getElementById('mixer-search').value.toLowerCase());
renderMixerSelected();
document.getElementById('mixer-result').innerHTML = '';
}

function renderMixerSelected() {
const cont = document.getElementById('mixer-selected');
const count = document.getElementById('mixer-count');
const btn = document.getElementById('mixer-analyze-btn');
count.textContent = mixerSelected.length;
btn.disabled = mixerSelected.length < 2;
cont.innerHTML = mixerSelected.map(name =>
`<div class="mixer-chip" onclick="toggleMixerItem('${name.replace(/'/g,"\\'")}')">
${name} <span class="mixer-chip-x">✕</span>
</div>`
).join('');
}

function analyzeMix() {
const drugs = mixerSelected.map(name => {
for (const f of families) {
const d = f.drugs.find(x => x.name === name);
if (d) return d;
}
}).filter(Boolean);

// Calculate combined scores
let maxPeligro = 0, maxMortalidad = 0;
drugs.forEach(d => {
if (d.ratings) {
maxPeligro = Math.max(maxPeligro, d.ratings.peligro);
maxMortalidad = Math.max(maxMortalidad, d.ratings.mortalidad);
}
});

// Find all pair interactions
const pairs = [];
for (let i = 0; i < drugs.length; i++) {
for (let j = i + 1; j < drugs.length; j++) {
const key = getPairKey(drugs[i].name, drugs[j].name);
const interaction = interactionDB[key];
pairs.push({ a: drugs[i].name, b: drugs[j].name, interaction });
}
}

// Boost scores based on interactions
const levelBoost = { letal: 2, 'muy-peligroso': 1.5, peligroso: 1, moderado: 0.5, leve: 0, seguro: 0 };
let boost = 0;
pairs.forEach(p => {
if (p.interaction) boost = Math.max(boost, levelBoost[p.interaction.level] || 0);
});

const combinedPeligro = Math.min(5, Math.round(maxPeligro + boost));
const combinedMortalidad = Math.min(5, Math.round(maxMortalidad + boost));

// Overall level
const overall = Math.max(combinedPeligro, combinedMortalidad);
const overallColor = getFaceColor(overall);
const overallFace = getFaceEmoji(overall);
const overallLabel = getFaceLabel(overall);

// Has any known lethal interaction?
const hasLetal = pairs.some(p => p.interaction?.level === 'letal');
const hasMuyPeligroso = pairs.some(p => p.interaction?.level === 'muy-peligroso');

const bgGradient = hasLetal
? 'linear-gradient(135deg, rgba(244,63,94,0.15), rgba(239,68,68,0.08))'
: hasMuyPeligroso
? 'linear-gradient(135deg, rgba(249,115,22,0.15), rgba(245,158,11,0.08))'
: `linear-gradient(135deg, ${overallColor}18, ${overallColor}08)`;

const knownPairs = pairs.filter(p => p.interaction);
const unknownPairs = pairs.filter(p => !p.interaction);

let resultHTML = `
<div class="mix-result-panel" style="border: 1px solid ${overallColor}40">
<div class="mix-result-header" style="background:${bgGradient}; border-bottom: 1px solid ${overallColor}25">
<div class="mix-result-face">${overallFace}</div>
<div>
<div class="mix-result-title" style="color:${overallColor}">${overallLabel}</div>
<div class="mix-result-subtitle" style="color:${overallColor}">
${hasLetal ? (currentLang==='en'?'⚠️ Combination with LETHAL known interactions':'⚠️ Combinación con interacciones LETALES conocidas') :
hasMuyPeligroso ? (currentLang==='en'?'⛔ Very dangerous combination':'⛔ Combinación muy peligrosa') :
overall >= 4 ? (currentLang==='en'?'⚠️ High-risk combination':'⚠️ Combinación de alto riesgo') :
overall === 3 ? (currentLang==='en'?'Moderate risk combination':'Combinación de riesgo moderado') :
(currentLang==='en'?'Low relative risk combination':'Combinación de bajo riesgo relativo')}
</div>
</div>
</div>
<div class="mix-result-scores">
<div class="mix-score-block">
<div class="mix-score-label">${currentLang==='en'?'Combined danger':'Peligrosidad combinada'}</div>
<div class="mix-score-faces">${renderFaces(combinedPeligro)}</div>
<div class="mix-score-num">${combinedPeligro} / 5</div>
</div>
<div class="mix-score-block">
<div class="mix-score-label">${currentLang==='en'?'Combined mortality':'Mortalidad combinada'}</div>
<div class="mix-score-faces">${renderFaces(combinedMortalidad)}</div>
<div class="mix-score-num">${combinedMortalidad} / 5</div>
</div>
</div>
<div class="mix-interactions">
<div class="mix-interactions-title">${currentLang==='en'?'Pair interactions':'Interacciones entre pares'}</div>
${knownPairs.map(p => `
<div class="mix-pair">
<span class="mix-pair-icon">${p.interaction.icon}</span>
<div class="mix-pair-info">
<div class="mix-pair-names">${p.a} + ${p.b}</div>
<div class="mix-pair-desc">${p.interaction.desc}</div>
</div>
<span class="mix-pair-level level-${p.interaction.level}">${p.interaction.level.replace('-',' ')}</span>
</div>
`).join('')}
${unknownPairs.map(p => `
<div class="mix-pair">
<span class="mix-pair-icon">❔</span>
<div class="mix-pair-info">
<div class="mix-pair-names">${p.a} + ${p.b}</div>
<div class="mix-pair-desc" style="color:var(--text-dim)">${currentLang==='en'?'Interaction not documented in database. This does not mean no risk — always consult a professional.':'Interacción no documentada en base de datos. No ausencia de riesgo — consulta siempre con un profesional.'}</div>
</div>
<span class="mix-pair-level" style="background:rgba(255,255,255,0.05);color:var(--text-dim)">${currentLang==='en'?'unknown':'desconocida'}</span>
</div>
`).join('')}
</div>
</div>`;

document.getElementById('mixer-result').innerHTML = resultHTML;
}

  "Anfetamina":    { emoji:"✈️", titulo:"The fuel of World War II", pos:"Nazi Germany distributed 35 million tablets of Pervitin (methamphetamine) to its soldiers in 1940. The Allies used amphetamine (Benzedrine). Both sides are estimated to have consumed hundreds of millions of doses.", neg:"Pilots on amphetamines reported an 'irrational confidence' that made them underestimate danger. Several friendly fire accidents were attributed to the 'pill syndrome'." },
  "Metilfenidato":  { emoji:"📚", titulo:"The controversial student drug", pos:"In some countries like the US, up to 30% of college students report using it without a prescription to study. Neuroscientists debate whether it actually improves performance in people without ADHD.", neg:"In children, it suppresses height growth by an average of 1–2 cm per year during the first years of treatment. This effect reverses when the drug is paused during vacations ('drug holidays')." },
  "Cocaína":       { emoji:"🦷", titulo:"The first dental anesthetic", pos:"It was the first local anesthetic in history. Sigmund Freud promoted it as a cure for morphine, alcohol and depression in his famous essay 'Über Coca' (1884).", neg:"When mixed with alcohol in the liver it forms cocaethylene, which is more cardiotoxic, crosses the blood-brain barrier better, lasts longer and enhances pleasure — explaining why the combination is so addictive and lethal." },
  "MDMA":          { emoji:"💊", titulo:"Invented to heal inner wounds", pos:"The psychiatrist Alexander Shulgin rediscovered it in the 70s and used it in couples therapy. Before being made illegal, over 1 million doses had been administered in therapeutic sessions with excellent results for PTSD.", neg:"Each ecstasy pill bought on the street may contain between 0 and 300 mg of MDMA — or may contain no MDMA at all and be an entirely different substance. Reagent test kits are essential." },
  "LSD":           { emoji:"🔬", titulo:"Discovered by accident", pos:"Albert Hofmann discovered its effects in 1943 after accidentally absorbing it through his skin in his laboratory. The first 'trip' in history was on a bicycle — which is why April 19 is called 'Bicycle Day'.", neg:"An active microdose of LSD (100 micrograms) fits comfortably in one square millimeter of paper. It is the psychoactive drug active at the smallest known quantity." },
  "Psilocibina":   { emoji:"🧠", titulo:"Rewires the brain for weeks", pos:"fMRI studies show that a single therapeutic dose of psilocybin can reset depression brain patterns for 3–6 months. The FDA granted it 'Breakthrough Therapy' status in 2018.", neg:"Psilocybin mushrooms are not addictive at all — in fact, studies show they reduce consumption of other drugs. But they can precipitate psychosis in people with latent schizophrenia." },
  "DMT":           { emoji:"🌌", titulo:"The molecule you produce while sleeping", pos:"The human body produces DMT endogenously. Some researchers believe the brain releases a surge of DMT during REM sleep and at the moment of death, which would explain near-death experiences.", neg:"Virtually all DMT users report encountering 'entities' or 'beings' during the experience. This phenomenon is so consistent that researchers are studying it formally." },
  "Ketamina":      { emoji:"🐴", titulo:"From horse anesthetic to antidepressant", pos:"It was developed as a veterinary anesthetic in the 1960s. Today, intranasal ketamine (Spravato) is FDA-approved for treatment-resistant depression — the first truly novel antidepressant mechanism in 30 years.", neg:"The famous 'k-hole' — a state of deep dissociation where users report leaving their body — occurs at doses only 2–3 times the recreational dose. The therapeutic window is very narrow." },
  "Alcohol":       { emoji:"🍺", titulo:"The only drug whose withdrawal can kill directly", pos:"Alcohol is the only substance whose withdrawal can kill directly through seizures and delirium tremens — without any additional drugs. Sudden abstinence in severe alcoholics requires medical hospitalization.", neg:"Alcohol causes more deaths globally than all illegal drugs combined — including HIV, tuberculosis and violence. Yet it is the only psychoactive substance marketed on prime-time television." },
  "GHB":           { emoji:"💧", titulo:"The drug the body produces itself", pos:"GHB (gamma-hydroxybutyric acid) is naturally present in the human brain at very low concentrations and acts as a neurotransmitter. The body produces it endogenously — making it unique among abused substances.", neg:"The margin between the dose that produces euphoria and the dose that causes coma is dangerously small. 1–2 ml can be the difference between a good time and the ICU." },
  "Paracetamol":   { emoji:"💊", titulo:"The world's most common accidental overdose", pos:"It is the safest drug in the world at correct doses — the only analgesic recommended during pregnancy, childhood and in people with ulcers. Its discovery was almost accidental: a pharmacy error in 1877.", neg:"In the US, paracetamol causes more cases of acute liver failure than all other causes combined — including hepatitis. 50% of cases are accidental, from taking multiple products containing it unknowingly." },
  "Ibuprofeno":    { emoji:"🔥", titulo:"The anti-inflammatory everyone takes wrong", pos:"Taken with food, at correct doses and for the right duration, it is one of the safest drugs available without prescription. Its discoverer, Stewart Adams, took it to cure a hangover before giving an important speech.", neg:"In the 21st century it was discovered that ibuprofen and other NSAIDs increase cardiovascular risk — a fact unknown when they had been on the market for decades. The risk is real especially at high doses and prolonged use." },
  "Aspirina":      { emoji:"🫀", titulo:"The most studied drug in history", pos:"With over 120 years on the market, aspirin has more published studies than any other drug. 100 mg of aspirin daily can reduce heart attack risk by up to 25% in high-risk individuals.", neg:"The antiplatelet mechanism is so potent and irreversible that surgeons ask patients to stop taking it 7–10 days before surgery — the time the body takes to manufacture new platelets that haven't been blocked." },
  "Fluoxetina":    { emoji:"💚", titulo:"The SSRI that changed psychiatry", pos:"Prozac (fluoxetine) was the first SSRI and became the best-selling psychiatric drug in history. By the late 1990s, over 35 million people worldwide had been prescribed it.", neg:"It takes 2–6 weeks to start working — but stopping it too quickly can cause 'discontinuation syndrome': electric shock sensations in the brain, extreme irritability and severe dizziness." },
  "Sertralina":    { emoji:"📊", titulo:"The world's most prescribed antidepressant", pos:"Sertraline is the most prescribed psychiatric medication in the United States. Studies show it has one of the best benefit-to-side-effect ratios among all SSRIs.", neg:"Like all SSRIs, it can cause sexual dysfunction in 30–70% of users — one of the most common reasons patients stop taking it without telling their doctor." },
  "THC":           { emoji:"🌿", titulo:"A molecule the brain already knows", pos:"The human brain has its own endocannabinoid system with receptors specifically designed for THC-like molecules. The endogenous neurotransmitter anandamide ('molecule of bliss') activates the same receptors.", neg:"High-potency cannabis (>20% THC) significantly increases the risk of psychosis. Starting use in adolescence causes greater neurological damage — the developing brain is far more vulnerable." },
  "CBD":           { emoji:"💊", titulo:"From prohibition to pharmacy shelves", pos:"CBD went from being a controlled substance to being sold in supermarkets in under a decade. Epidiolex, a pure CBD medication, was the first cannabis-derived drug approved by the FDA (2018) for childhood epilepsy.", neg:"The CBD market is massively unregulated. A 2017 study found that 70% of CBD products sold online contained significantly different amounts than labeled — some had none at all, others had detectable THC." },
  "Cafeína":       { emoji:"☕", titulo:"The most consumed psychoactive substance on the planet", pos:"90% of adults worldwide consume caffeine daily — it is the only psychoactive drug with practically universal and socially accepted use. Consumed moderately, it reduces the risk of Parkinson's, Alzheimer's and certain cancers.", neg:"Caffeine dependence is so real it has its own diagnostic code in the DSM-5 (caffeine withdrawal syndrome). Withdrawal headache begins exactly 12–24 hours after the last dose and can last 9 days." },
  "Modafinilo":    { emoji:"🎓", titulo:"Silicon Valley's favorite drug", pos:"It is the most used 'nootropic' in Silicon Valley, Wall Street and among military pilots. The US Air Force approved it to keep pilots alert for 40 hours straight in critical missions.", neg:"An Oxford study with 200+ hours of sleep deprivation showed that modafinil maintains performance on simple tasks but impairs creativity and complex decision-making — exactly the opposite of what fans believe." },
  "Piracetam":     { emoji:"🧩", titulo:"The drug that named nootropics", pos:"Its discoverer, Corneliu Giurgea, coined the term 'nootropic' in 1972 precisely to describe piracetam — from the Greek words for 'mind' and 'to turn/mold'. It was the first drug designed to enhance cognition.", neg:"After 50 years and thousands of studies, evidence that it improves cognition in healthy people remains weak. However, it has solid evidence for childhood dyslexia and cognitive decline in the elderly." },
  "Metadona":      { emoji:"⏳", titulo:"The half-life trap", pos:"Paradoxically, methadone — used to treat heroin addiction — carries a higher overdose risk than heroin itself during the first weeks, due to its unpredictable accumulation.", neg:"It can be detected in urine up to 11 days after a single dose, while heroin disappears in 2–3 days. Many patients fail drug tests because of the methadone they are legally taking." },
  "Metanfetamina": { emoji:"💎", titulo:"The drug that ages a face in months", pos:"At low therapeutic doses (Desoxyn, 5 mg), it is the most effective stimulant available for severe treatment-resistant ADHD. It was also widely used in World War II by both sides.", neg:"Oregon's 'Faces of Meth' project showed photos of the same individual separated by 1–3 years of use — the physical transformations (tooth loss, aging, skin lesions) had global impact." },
  "Kratom":        { emoji:"🌿", titulo:"The opioid sold as a supplement", pos:"Kratom is sold legally in most countries as a supplement or tea. Yet it acts on the same opioid receptors as morphine. Millions use it to self-medicate opioid withdrawal.", neg:"The FDA has seized multiple kratom shipments and proposed scheduling it as Schedule I. Deaths have been reported — mostly in combination with other substances, but some attributed to kratom alone." },
  "Ibogaína":      { emoji:"🌀", titulo:"The 12-hour trip that cures addiction", pos:"A single ibogaine session lasting 12–36 hours has shown unprecedented rates of opioid addiction cessation in early studies — up to 80% abstinence at 6 months in some trials.", neg:"Ibogaine has caused approximately 30 documented deaths during therapeutic sessions, mostly from cardiac arrhythmias. It requires EKG monitoring and is illegal in the US." },
  "Mescalina":     { emoji:"🌵", titulo:"The sacred molecule of the Americas", pos:"Mescaline has been used in Native American religious ceremonies for over 5,000 years. The peyote cactus was used by the Huichol, Navajo and other tribes in healing rituals before being classified as illegal.", neg:"Mescaline is one of the few psychedelics where the physical experience (nausea, vomiting, tremors) is considered a sacred part of the process — a 'purging' of what doesn't serve you." },
  "Pregabalina":   { emoji:"⚡", titulo:"The anxiety drug that became a drug of abuse", pos:"Originally developed for epilepsy, pregabalin became first-line for generalized anxiety disorder and neuropathic pain. It works faster than SSRIs — showing effect in the first week.", neg:"Despite being classified as a non-opioid, pregabalin has serious abuse potential. The UK reclassified it as Schedule 3 in 2019 after it became the drug most commonly found in drug-related deaths." },
  "Zolpidem":      { emoji:"🌙", titulo:"The drug that creates sleepwalking chefs", pos:"Zolpidem is the most prescribed sleeping pill in the world. At correct doses and duration, it is genuinely effective for short-term insomnia — with fewer risks than benzodiazepines.", neg:"Zolpidem is associated with 'sleep-eating' and 'sleep-driving' — users wake up having cooked elaborate meals, sent incoherent emails or driven miles without any memory of it." },
  "Haloperidol":   { emoji:"🏥", titulo:"The chemical straitjacket", pos:"Haloperidol was so effective at controlling severe psychosis that it changed psychiatry forever. Before its discovery, the only treatments for schizophrenia were lobotomy and electroshock therapy.", neg:"Long-term use causes tardive dyskinesia in 20–50% of patients — involuntary repetitive movements of the face and body that can be permanent even after stopping the drug." },
  "Aspirina":      { emoji:"🫀", titulo:"The most studied drug in history", pos:"With over 120 years on the market, aspirin has more published studies than any other drug. 100 mg daily can reduce heart attack risk by up to 25% in high-risk individuals.", neg:"The antiplatelet mechanism is so potent and irreversible that surgeons ask patients to stop it 7–10 days before surgery — the time the body takes to manufacture new unblocked platelets." },
  "2C-B":          { emoji:"🔬", titulo:"The psychedelic that looks like MDMA", pos:"2C-B is frequently sold as ecstasy due to its visual similarity to MDMA. Synthesized by Alexander Shulgin, it is described in PIHKAL as one of the most complete psychedelics for its balance between visual and emotional effects.", neg:"The dose-response curve is extremely steep: 15 mg produces a light experience, 25 mg a full trip, and 30 mg can be overwhelming. A 5 mg difference separates two completely different experiences." },
  "2C-P":          { emoji:"🚨", titulo:"The designer drug that kills through dose confusion", pos:"From a chemical standpoint, it is one of the best-studied psychedelic molecules in the 2C family. Alexander Shulgin documented it in detail in PIHKAL.", neg:"Several confirmed deaths occurred because users confused 2C-P with 2C-B. Active dose of 2C-B: 15–20 mg; of 2C-P: 5–10 mg. Same appearance, three times more potent, twenty times more dangerous." },
  "Alpha-PVP":     { emoji:"😵", titulo:"The drug that created the Florida zombies", pos:"The Miami crisis (2012) was initially attributed to Alpha-PVP. Though the first case tested positive only for cannabis, subsequent confirmed cases did involve Alpha-PVP.", neg:"The hyperthermia it produces can raise body temperature to 41–42°C within minutes. At that temperature, brain proteins begin to denature irreversibly. Neurological damage can be permanent." },
  "Amitriptilina": { emoji:"🌙", titulo:"The antidepressant that became a sleeping pill", pos:"Originally developed as an antidepressant in the 1960s, amitriptyline is now prescribed more often for chronic pain, migraines and insomnia than for depression itself.", neg:"It blocks 5 different receptor types simultaneously — explaining both its clinical versatility and its long list of side effects: dry mouth, constipation, blurred vision, urinary retention and cardiac arrhythmias." },
  "Aripiprazol":   { emoji:"⚖️", titulo:"The antipsychotic that doesn't sedate", pos:"Unlike older antipsychotics, aripiprazole acts as a partial dopamine agonist — modulating dopamine rather than simply blocking it. One of the few antipsychotics that can improve motivation and energy.", neg:"A paradoxical side effect is pathological impulse control: documented cases of compulsive gambling, hypersexuality and compulsive shopping that disappear when the drug is stopped." },
  "Armodafinilo":  { emoji:"⚗️", titulo:"The active half of modafinil", pos:"Being only the active R-enantiomer (modafinil is a 50/50 R+S mix), the same active dose is achieved with half the compound — potentially reducing total exposure and side effects.", neg:"Ironically, many users report modafinil feels stronger than armodafinil despite armodafinil being pharmacologically more potent. The S-enantiomer may have some contribution not yet understood." },
  "Brivaracetam":  { emoji:"🧬", titulo:"Levetiracetam's more selective cousin", pos:"Brivaracetam binds to the SV2A synaptic vesicle protein with 10–30 times greater affinity than levetiracetam. It was designed specifically to improve on levetiracetam's mechanism.", neg:"Despite its theoretical superiority, clinical studies show only modest advantages over levetiracetam in most patients. The main benefit appears in levetiracetam-resistant cases." },
  "CBG":           { emoji:"🌱", titulo:"The mother of all cannabinoids", pos:"CBG (cannabigerol) is the biosynthetic precursor from which THC, CBD and all other cannabinoids are synthesized in the plant. Without CBG, no other cannabinoid would exist.", neg:"In most commercial cannabis strains, CBG is present at less than 1% because it converts almost entirely into other cannabinoids. High-CBG strains must be harvested earlier, before conversion is complete." },
  "CBN":           { emoji:"🌙", titulo:"THC's degradation product", pos:"CBN forms naturally as THC degrades with oxygen and light. Old, improperly stored cannabis is rich in CBN — which is why aged cannabis is associated with more sedating effects.", neg:"Despite being widely marketed as a sleep aid, scientific evidence that CBN causes sedation independent of other cannabinoids is very weak. The effect may be entirely due to accompanying terpenes." },
  "Cannabinoides sintéticos": { emoji:"☠️", titulo:"More dangerous than THC by accidental design", pos:"Originally synthesized by academic researchers (John W. Huffman, JWH-018) to study the endocannabinoid system — they never intended them to be consumed.", neg:"Being full CB1 agonists (THC is only partial), they produce maximum receptor activation that THC cannot match — explaining the psychosis, seizures and deaths that natural cannabis does not cause." },
  "Carbamazepina": { emoji:"⚡", titulo:"Accidentally discovered for depression", pos:"Carbamazepine was synthesized in 1953 and initially used as an antidepressant before its antiepileptic properties were discovered. Today it is first-line for trigeminal neuralgia — the most painful condition known to medicine.", neg:"It induces its own metabolism (autoinduction): the dose that works in week 1 may become ineffective in week 4 because the liver has learned to break it down faster. Dose adjustment is often necessary." },
  "Catinona / Mefedrona": { emoji:"🔄", titulo:"The drug that redoses itself", pos:"In 2009 it was the fourth most used recreational drug in the UK, surpassing cocaine in some groups. Its MDMA-like effect with greater availability and lower price caused it to explode in popularity.", neg:"Its 2–3 hour duration generates an almost automatic compulsion to redose. Users report consuming involuntarily for 12–18 hours straight, ending with severe cardiotoxicity." },
  "Celecoxib":     { emoji:"💔", titulo:"The NSAID that survived its sibling's scandal", pos:"Designed specifically not to damage the stomach. In patients with high ulcer risk who need anti-inflammatories, it is a genuinely safer gastrointestinal option.", neg:"Rofecoxib (Vioxx), its pharmacological cousin, was withdrawn in 2004 after causing 88,000 heart attacks in the US. Celecoxib survived but carries that shadow — and its real cardiovascular risk is still debated." },
  "Clozapina":     { emoji:"🔴", titulo:"The antipsychotic of last resort", pos:"Clozapine is the only drug proven effective for treatment-resistant schizophrenia. For patients who don't respond to anything else, it can be literally life-changing.", neg:"It causes agranulocytosis (potentially fatal immune collapse) in 1–2% of patients. This is why mandatory weekly blood counts are required — the drug cannot be prescribed without them." },
  "Dronabinol":    { emoji:"💊", titulo:"Legal synthetic THC", pos:"Dronabinol is pure synthetic THC, FDA-approved since 1985 for chemotherapy-induced nausea and AIDS-related appetite loss. It is Schedule III — lower than natural cannabis, which remains Schedule I.", neg:"Many patients find that pure THC without other cannabinoids is less effective and causes more anxiety than natural cannabis. The plant's entourage effect appears to be real and clinically relevant." },
  "Efedrina":      { emoji:"💪", titulo:"The original pre-workout", pos:"Ephedrine was the main ingredient in weight-loss and sports supplements for decades until the FDA banned it in 2004 after it was linked to hundreds of deaths, including several professional athletes.", neg:"The ECA stack (ephedrine + caffeine + aspirin) was so effective for fat loss that it is still used illegally in bodybuilding. Its cardiovascular risk profile makes it extremely dangerous at high doses." },
  "Eszopiclona":   { emoji:"🌙", titulo:"The only sleeping pill approved for long-term use", pos:"Eszopiclone is the only hypnotic FDA-approved for long-term use (up to 12 months). All other sleeping pills are approved for short-term use only.", neg:"It causes a persistent metallic or bitter taste that many find intolerable — one of the main reasons for discontinuation, even when the drug works well for sleep." },
  "Etanol":        { emoji:"🍺", titulo:"The only drug whose withdrawal can kill directly", pos:"Alcohol is the only substance whose withdrawal can kill through seizures and delirium tremens — without any other drugs. Sudden abstinence in severe alcoholics requires medical hospitalization.", neg:"Alcohol causes more deaths globally than all illegal drugs combined — including HIV, tuberculosis and violence. Yet it is the only psychoactive substance marketed on prime-time television." },
  "Fenitoína":     { emoji:"💡", titulo:"Discovered during electric shock experiments", pos:"Phenytoin was discovered in 1938 when researchers testing compounds on cats subjected to electroshock found it prevented seizures without causing sedation — the first non-sedating anticonvulsant in history.", neg:"It has zero-order pharmacokinetics at high doses: small dose increases cause disproportionate toxicity. Going from 300 to 400 mg/day can be the difference between therapeutic and toxic." },
  "Gabapentina":   { emoji:"🧩", titulo:"Designed to mimic GABA, works completely differently", pos:"Gabapentin was designed to cross the blood-brain barrier and mimic GABA. Paradoxically, it does not bind to GABA receptors at all — it works on voltage-gated calcium channels, discovered years after its approval.", neg:"Despite being officially non-addictive, gabapentin abuse has skyrocketed. It is now the third most common drug found in overdose deaths in the US, most often combined with opioids." },
  "HHC":           { emoji:"🧪", titulo:"The Nazi submarine cannabinoid", pos:"The hydrogenation of cannabinoids was patented by Roger Adams in 1944 — the same chemist who discovered CBD. For decades it was only a laboratory curiosity until the grey market popularized it.", neg:"When manufacturing HHC, two epimers are produced: 9R-HHC (active, ~50%) and 9S-HHC (inactive, ~50%). Buying an HHC product is literally buying half inactive compound with unknown exact concentration." },
  "Hidrato de cloral": { emoji:"🌡️", titulo:"Victorian knockout drops", pos:"Chloral hydrate was the first synthetic hypnotic, used since 1869. It is the substance behind 'knockout drops' in detective novels — and real life. It was also used medically in children until relatively recently.", neg:"Marilyn Monroe and Anna Nicole Smith both died with chloral hydrate in their systems. Its therapeutic index is extremely narrow — the sleep dose is not far from the lethal dose." },
  "Kava":          { emoji:"🌺", titulo:"The ceremonial drink that relaxes without intoxicating", pos:"Kava has been used for centuries in Pacific ceremonies as a social drink and ritual medicine. Unlike alcohol, it produces relaxation and sociability without cognitive impairment or aggression.", neg:"Several European countries banned kava in the early 2000s after reports of severe liver toxicity. Bans were partially lifted after evidence suggested the problem was due to poor quality extracts, not kava itself." },
  "Lamotrigina":   { emoji:"⚡", titulo:"The anticonvulsant that also stabilizes mood", pos:"Approved for epilepsy, lamotrigine's ability to prevent depressive episodes in bipolar disorder was discovered later. It is now first-line for bipolar depression — something very few drugs achieve.", neg:"It can cause Stevens-Johnson syndrome, a potentially fatal skin reaction. For this reason the dose must increase extremely slowly — standard titration takes 6–8 weeks to reach therapeutic levels." },
  "Levetiracetam": { emoji:"🧠", titulo:"The anticonvulsant with a unique mechanism", pos:"Levetiracetam works via a completely unique mechanism — binding to the SV2A synaptic vesicle protein. This gives it virtually no drug interactions, making it ideal for polypharmacy patients.", neg:"'Keppra rage' is a well-documented phenomenon: 10–15% of patients develop irritability, aggression and behavioral changes significant enough to require discontinuation." },
  "Litio":         { emoji:"⚡", titulo:"A mineral that stabilizes minds", pos:"Lithium is one of the few substances with evidence of reducing suicide risk in bipolar disorder by up to 60%. It is the oldest mood stabilizer still in use — and in some respects, still the most effective.", neg:"The therapeutic window is extremely narrow: 0.6–1.2 mEq/L is therapeutic, above 1.5 mEq/L causes toxicity, above 2.0 mEq/L can be fatal. Regular blood monitoring is mandatory for life." },
  "MDA":           { emoji:"💊", titulo:"MDMA's older, rougher sibling", pos:"MDA (tenamfetamine) predates MDMA and was used therapeutically in the 1960s. Some users describe a more visual and introspective experience than MDMA.", neg:"MDA is significantly more neurotoxic than MDMA. Animal studies show it destroys serotonergic neurons at doses closer to recreational ones, with a narrower margin between enjoyable and damaging." },
  "Nabilona":      { emoji:"🧪", titulo:"The synthetic cannabinoid better than THC for nausea", pos:"Nabilone is a synthetic cannabinoid structurally similar to THC but more potent and longer-lasting. It is FDA-approved for chemotherapy-induced nausea that doesn't respond to other treatments.", neg:"Unlike natural cannabis, nabilone produces a more intense and less controllable psychoactive experience, without the entourage effect that makes natural cannabis more manageable for many patients." },
  "Naproxeno":     { emoji:"⏰", titulo:"The NSAID for when you want to forget you took something", pos:"Its 12–17 hour half-life makes it ideal for people who forget to take medication — twice daily maintains stable therapeutic levels, something no other OTC NSAID can match.", neg:"Despite its lower cardiovascular risk, it shares all the gastrointestinal risks of the NSAID class. 15–30% of chronic users develop asymptomatic ulcers only detected by hemorrhage." },
  "Olanzapina":    { emoji:"⚖️", titulo:"The most effective and most fattening antipsychotic", pos:"Olanzapine is consistently ranked among the most effective antipsychotics in comparative studies. For acute psychosis and treatment-resistant schizophrenia, it remains a gold standard.", neg:"It causes more weight gain than virtually any other psychiatric drug — an average of 4–5 kg in the first year. Metabolic syndrome, type 2 diabetes and cardiovascular risk increase significantly." },
  "PCP":           { emoji:"🌀", titulo:"The drug that makes people feel invincible", pos:"PCP was developed as a surgical anesthetic in the 1950s and used clinically until 1965. At sub-anesthetic doses it produces a unique dissociative state no other drug replicates exactly.", neg:"PCP is the drug most associated with superhuman strength and pain insensitivity in emergency rooms. Documented cases exist of people sustaining multiple gunshot wounds without stopping, or breaking their own bones from muscle tension." },
  "Propofol":      { emoji:"💤", titulo:"The anesthetic that killed Michael Jackson", pos:"Propofol is the gold standard of general anesthesia — fast-acting, clean recovery, minimal nausea. In hospitals it is considered one of the world's safest drugs when used properly.", neg:"Michael Jackson used propofol nightly as a sleeping aid, administered by his doctor. Without airway monitoring and resuscitation equipment, propofol causes respiratory arrest within minutes — exactly what killed him." },
  "Quetiapina":    { emoji:"😴", titulo:"The antipsychotic prescribed as a sleeping pill", pos:"Quetiapine is FDA-approved for schizophrenia and bipolar disorder, but at low doses (25–100 mg) it is one of the world's most prescribed off-label sleeping pills — despite no approval for this use.", neg:"Its off-label hypnotic use is controversial: it causes metabolic syndrome, weight gain and tardive dyskinesia in long-term use — side effects disproportionate to simply treating insomnia." },
  "Risperidona":   { emoji:"🧬", titulo:"The first atypical antipsychotic to go generic", pos:"Risperidone was one of the first atypical antipsychotics, causing far fewer motor side effects than older drugs. Its generic availability has made it the most economically accessible antipsychotic worldwide.", neg:"It causes the highest rate of hyperprolactinemia among atypical antipsychotics — elevated prolactin can cause breast discharge (in men and women), sexual dysfunction and bone density loss with long-term use." },
  "Salvia divinorum": { emoji:"🌿", titulo:"The most potent natural hallucinogen", pos:"Salvia contains salvinorin A, the most potent naturally occurring hallucinogen known — active at 200 micrograms. Uniquely, it acts on kappa-opioid receptors, not serotonin receptors like other psychedelics.", neg:"The experience is described by most users as profoundly unpleasant — unlike LSD or psilocybin. Complete ego dissolution, inability to remember being human, and terrifying spatial distortions are common. Very few people repeat it." },
  "THCV":          { emoji:"🔬", titulo:"The cannabinoid that suppresses appetite", pos:"Unlike THC, THCV acts as a CB1 receptor antagonist at low doses — blocking the munchies effect. This has generated pharmaceutical interest as a potential obesity and type 2 diabetes treatment.", neg:"At high doses, THCV becomes a partial CB1 agonist and produces psychoactive effects. High-THCV cannabis strains are very rare and primarily found in African landrace varieties." },
  "Tolueno":       { emoji:"🏭", titulo:"The world's cheapest drug", pos:"Toluene is the most neurologically studied of all inhalants. Paradoxically, this detailed knowledge of its toxicity has not reduced its use among street populations.", neg:"Chronic toluene damage is identical on MRI to advanced multiple sclerosis: diffuse white matter demyelination. Young people in their 20s with the brains of 70-year-olds on radiological images." },
  "Topiramato":    { emoji:"💊", titulo:"The anticonvulsant that makes you forget words", pos:"Topiramate simultaneously blocks sodium channels, enhances GABA, inhibits glutamate and blocks carbonic anhydrase. This makes it useful for epilepsy, migraines, and even alcohol addiction.", neg:"Cognitive blunting — especially word-finding difficulty — is so common patients nickname it 'Dopamax' (dopey + Topamax). Up to 40% of users report significant cognitive impairment." },
  "Valproato":     { emoji:"⚡", titulo:"The anticonvulsant that treats everything", pos:"Valproate is approved for epilepsy, bipolar disorder, and migraine prevention — one of the few drugs with three completely different FDA-approved indications. Its mechanism is still not fully understood.", neg:"It is one of the most teratogenic drugs in clinical use: exposure during pregnancy causes spina bifida in 1–2% and autism spectrum disorder in up to 11% of cases. Yet it is still prescribed to women of childbearing age." },
  "Venlafaxina":   { emoji:"🎢", titulo:"The SNRI with the harshest discontinuation", pos:"Venlafaxine was the first SNRI approved, and remains one of the most effective antidepressants for severe cases. At high doses its norepinephrine action provides additional benefit for treatment-resistant depression.", neg:"Its discontinuation syndrome is among the worst of any antidepressant. Stopping abruptly causes brain zaps, extreme dizziness, nausea and irritability — sometimes for weeks. Its short half-life makes this unavoidable." },

// Inject curiosities into drugs
families.forEach(f => f.drugs.forEach(d => {
  if (curiosDB[d.name]) d.curiosidad = curiosDB[d.name];
}));

// Init
function init() {
document.getElementById('total-count').textContent = families.reduce((a, f) => a + f.drugs.length, 0);
document.getElementById('family-count').textContent = families.length;
renderSidebar();
renderContent();
}

function renderSidebar() {
const sidebar = document.getElementById('sidebar');
const title = sidebar.querySelector('.sidebar-title');
sidebar.innerHTML = '';
sidebar.appendChild(title);

// ── Todas las familias ──
const allItem = document.createElement('div');
allItem.className = `family-item ${activeFamily === 'all' ? 'active' : ''}`;
allItem.style.setProperty('--family-color', '#4a9eff');
const _sfamilies = (currentLang !== 'es' && translatedFamilies) ? translatedFamilies : families;
allItem.innerHTML = `<img class="family-item-all-icon" src="${PIXEL_ICONS.all}" alt=""><span class="family-name">${t('all_families')}</span><span class="family-count">${_sfamilies.reduce((a,f) => a+f.drugs.length,0)}</span>`;
allItem.onclick = () => { cancelAnimationFrame(dnaRAF||0); cancelAnimationFrame(neuronRAF||0); activeFamily = 'all'; renderSidebar(); renderContent(); };
sidebar.appendChild(allItem);

// ── Categoria groups ──
const sidebarCategories = [
  {
    icon: '🧠', iconKey: 'psiquiatria',
    label: 'Psiquiatría y neurología',
    ids: ['antidepresivos','antipsicóticos','antiepilepticos','benzodiazepinas','hipnoticos']
  },
  {
    icon: '💊', iconKey: 'analgesia',
    label: 'Analgesia y dolor',
    ids: ['opioides','analgésicos']
  },
  {
    icon: '⚡', iconKey: 'estimulantes',
    label: 'Estimulantes',
    ids: ['estimulantes','nootropicos']
  },
  {
    icon: '🌀', iconKey: 'psicodelicos',
    label: 'Psicodélicos y empatógenos',
    ids: ['psicodelicos','empatogenos','disociativos']
  },
  {
    icon: '🌿', iconKey: 'cannabis',
    label: 'Cannabis y naturales',
    ids: ['cannabinoides','drogas_planta']
  },
  {
    icon: '🍺', iconKey: 'depresores',
    label: 'Depresores y alcohol',
    ids: ['alcoholdepresores','inhalantes']
  },
  {
    icon: '⚗️', iconKey: 'sinteticas',
    label: 'Drogas de diseño',
    ids: ['drogas_sinteticas']
  },
];

sidebarCategories.forEach(cat => {
  const _sf = (currentLang !== 'es' && translatedFamilies) ? translatedFamilies : families;
  const catFamilies = cat.ids.map(id => _sf.find(f => f.id === id)).filter(Boolean);
  if (!catFamilies.length) return;

  const label = document.createElement('div');
  label.className = 'sidebar-cat-label';
  const pixSrc = cat.iconKey && PIXEL_ICONS[cat.iconKey] ? `<img class="sidebar-cat-pixel" src="${PIXEL_ICONS[cat.iconKey]}" alt="">` : `<span class="sidebar-cat-icon">${cat.icon}</span>`;
  label.innerHTML = `${pixSrc}<span class="sidebar-cat-text">${cat.label}</span>`;
  sidebar.appendChild(label);

  catFamilies.forEach(f => {
    const item = document.createElement('div');
    item.className = `family-item ${activeFamily === f.id ? 'active' : ''}`;
    item.style.setProperty('--family-color', f.color);
    item.innerHTML = `<span class="family-dot" style="background:${f.color}"></span><span class="family-name">${f.name}</span><span class="family-count">${f.drugs.length}</span>`;
    item.onclick = () => { cancelAnimationFrame(dnaRAF||0); cancelAnimationFrame(neuronRAF||0); activeFamily = f.id; renderSidebar(); renderContent(); };
    sidebar.appendChild(item);
  });
});

// ── Laboratorio Molecular (separador + ítem especial) ──
const labSep = document.createElement('div');
labSep.className = 'sidebar-cat-label';
labSep.innerHTML = `<span class="sidebar-cat-icon">⬡</span><span class="sidebar-cat-text">Herramientas</span>`;
sidebar.appendChild(labSep);

const labItem = document.createElement('div');
labItem.className = `family-item bio3d-item ${activeFamily === '__bio3d__' ? 'active' : ''}`;
labItem.style.setProperty('--family-color', '#2dd4bf');
labItem.innerHTML = `<span class="family-dot" style="background:linear-gradient(135deg,#2dd4bf,#8b5cf6)"></span><span class="family-name">Laboratorio Molecular</span><span class="family-count">3D</span>`;
labItem.onclick = () => { activeFamily = '__bio3d__'; renderSidebar(); renderContent(); };
sidebar.appendChild(labItem);
}

function renderContent() {
const content = document.getElementById('content');

// ── Bio3D special view ──
if (activeFamily === '__bio3d__') {
  // Hide controls bar search/filter (not relevant for lab)
  document.querySelector('.controls')?.style.setProperty('display','none');
  // Inject bio3d section into content div
  content.innerHTML = '';
  const bio = document.createElement('section');
  bio.className = 'bio3d-section bio3d-visible';
  bio.id = 'bio3d-section';
  bio.innerHTML = `
    <h2 class="bio3d-title">⬡ Laboratorio Molecular</h2>
    <p class="bio3d-subtitle">Manipulación 3D interactiva · Codón ADN & Neurona</p>
    <div class="bio3d-grid">
      <div class="bio3d-panel">
        <div class="bio3d-panel-title">🧬 Codón ADN <span>/ Manipulación 3D</span></div>
        <div class="bio3d-canvas-wrap"><canvas id="dna-canvas"></canvas></div>
        <div class="bio3d-codon-display" id="codon-display"></div>
        <div class="bio3d-aminoacid" id="codon-aminoacid"><strong>—</strong>Selecciona bases</div>
        <div class="bio3d-controls">
          <div class="bio3d-control-row">
            <span class="bio3d-control-label">Velocidad</span>
            <input type="range" class="bio3d-slider" id="dna-speed" min="0.1" max="3" step="0.1" value="1">
            <span class="bio3d-slider-val" id="dna-speed-val">1.0</span>
          </div>
          <div class="bio3d-control-row">
            <span class="bio3d-control-label">Pares bases</span>
            <input type="range" class="bio3d-slider" id="dna-pairs" min="4" max="16" step="1" value="8">

function initReveal() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(el => {
      if (el.isIntersecting) {
        el.target.classList.add('visible');
      }
    });
  }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('.reveal-section').forEach(s => observer.observe(s));
}
// Re-run after content renders
const _origRenderContent = renderContent;
renderContent = function() {
  _origRenderContent();
  setTimeout(initReveal, 30);
};


// ─── ANIMATE DANGER STRIP PIPS ───────────────────────────────────────────────
function animatePips(container) {
  if (!container) return;
  const pips = container.querySelectorAll('.mds-pip.on, .scale-pip.on, .mrv2-bar .scale-pip.on');
  pips.forEach((pip, idx) => {
    pip.classList.remove('anim');
    pip.style.opacity = '0';
    setTimeout(() => {
      pip.style.opacity = '';
      pip.classList.add('anim');
    }, idx * 80 + 120);
  });
}
