<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciclodex – Enciclopedia de Sustancias</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
--bg: #0a0c10;
--surface: #111318;
--card: #161920;
--border: #1e2230;
--accent-blue: #4a9eff;
--accent-teal: #2dd4c0;
--accent-amber: #f59e0b;
--accent-rose: #f43f5e;
--accent-violet: #8b5cf6;
--accent-green: #10b981;
--accent-orange: #fb923c;
--text-primary: #e8eaf0;
--text-secondary: #8b90a0;
--text-dim: #4a4f60;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(--bg);
color: var(--text-primary);
font-family: 'DM Mono', monospace;
min-height: 100vh;
overflow-x: hidden;
}

/* GRID BACKGROUND */
body::before {
content: '';
position: fixed;
inset: 0;
background-image:
linear-gradient(rgba(74,158,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(74,158,255,0.03) 1px, transparent 1px);
background-size: 40px 40px;
pointer-events: none;
z-index: 0;
}

/* ─── MODO SIN EFECTOS (accesibilidad) ─────────────────────────────── */
.no-fx *,
.no-fx *::before,
.no-fx *::after {
  animation: none !important;
  transition: none !important;
  filter: none !important;
}
.no-fx body::before { display: none !important; }
.no-fx .mascot-img:hover { transform: none !important; }

/* Botón toggle efectos */
.fx-toggle-btn {
  position: fixed;
  bottom: 58px;
  left: 20px;
  z-index: 9998;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(10,12,16,0.75);
  border: 1px solid rgba(139,144,160,0.22);
  color: rgba(139,144,160,0.6);
  font-size: 0.8rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.fx-toggle-btn:hover {
  border-color: rgba(139,144,160,0.5);
  color: var(--text-primary);
  background: rgba(139,144,160,0.08);
}
.fx-toggle-btn.fx-off {
  border-color: rgba(244,63,94,0.35);
  color: rgba(244,63,94,0.65);
}
.fx-toggle-btn.fx-off:hover {
  border-color: rgba(244,63,94,0.6);
  color: var(--accent-rose);
  background: rgba(244,63,94,0.07);
}
.fx-toggle-btn::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 8px);
  left: 0;
  background: rgba(10,12,16,0.92);
  border: 1px solid rgba(139,144,160,0.2);
  color: var(--text-secondary);
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.05em;
  white-space: nowrap;
  padding: 4px 8px;
  border-radius: 4px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}
.fx-toggle-btn:hover::after { opacity: 1; }
.no-fx .fx-toggle-btn { transition: none !important; }
.no-fx .fx-toggle-btn::after { transition: none !important; }

header {
position: relative;
z-index: 10;
padding: 48px 40px 32px;
border-bottom: 1px solid var(--border);
display: flex;
align-items: flex-end;
justify-content: space-between;
flex-wrap: wrap;
gap: 16px;
}

.header-left h1 {
font-family: 'DM Serif Display', serif;
font-size: clamp(2rem, 5vw, 3.5rem);
font-weight: 400;
letter-spacing: -0.02em;
line-height: 1;
color: var(--text-primary);
}

.header-left h1 span {
color: var(--accent-teal);
font-style: italic;
}

.header-left p {
margin-top: 8px;
color: var(--text-secondary);
font-size: 0.75rem;
letter-spacing: 0.1em;
text-transform: uppercase;
}

.stats {
display: flex;
gap: 32px;
}

.stat {
text-align: right;
}

.stat-num {
font-size: 1.8rem;
font-family: 'DM Serif Display', serif;
color: var(--accent-blue);
}

.stat-label {
font-size: 0.65rem;
color: var(--text-dim);
letter-spacing: 0.1em;
text-transform: uppercase;
}

/* SEARCH + FILTERS */
.controls {
position: relative;
z-index: 10;
padding: 24px 40px;
display: flex;
gap: 16px;
flex-wrap: wrap;
align-items: center;
border-bottom: 1px solid var(--border);
}

.search-wrap {
position: relative;
flex: 1;
min-width: 200px;
}

.search-icon {
position: absolute;
left: 14px;
top: 50%;
transform: translateY(-50%);
color: var(--text-dim);
font-size: 0.9rem;
}

input[type="search"] {
width: 100%;
background: var(--card);
border: 1px solid var(--border);
color: var(--text-primary);
font-family: 'DM Mono', monospace;
font-size: 0.8rem;
padding: 10px 14px 10px 36px;
border-radius: 6px;
outline: none;
transition: border-color 0.2s;
}

input[type="search"]::placeholder { color: var(--text-dim); }
input[type="search"]:focus { border-color: var(--accent-blue); }

.filter-btn {
background: var(--card);
border: 1px solid var(--border);
color: var(--text-secondary);
font-family: 'DM Mono', monospace;
font-size: 0.7rem;
letter-spacing: 0.05em;
padding: 10px 16px;
border-radius: 6px;
cursor: pointer;
transition: all 0.2s;
white-space: nowrap;
}

.filter-btn:hover { border-color: var(--text-dim); color: var(--text-primary); }
.filter-btn.active { border-color: var(--accent-teal); color: var(--accent-teal); background: rgba(45,212,192,0.08); }

/* MAIN LAYOUT */
.main {
position: relative;
z-index: 10;
display: grid;
grid-template-columns: 280px 1fr;
min-height: calc(100vh - 200px);
}

/* SIDEBAR */
.sidebar {
border-right: 1px solid var(--border);
padding: 24px 0;
position: sticky;
top: 0;
height: calc(100vh - 200px);
overflow-y: auto;
scrollbar-width: thin;
scrollbar-color: var(--border) transparent;
}

.sidebar-title {
font-size: 0.6rem;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(--text-dim);
padding: 0 24px 12px;
}

.sidebar-cat-label {
  font-size: 0.56rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 18px 16px 6px;
  display: flex;
  align-items: center;
  gap: 7px;
  user-select: none;
  position: relative;
}
.sidebar-cat-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, var(--border), transparent);
}
.sidebar-cat-icon {
  font-size: 0.9rem;
  flex-shrink: 0;
}
.sidebar-cat-text {
  letter-spacing: 0.13em;
}
/* Hover fade entre items del sidebar */
.sidebar:hover .family-item:not(:hover) {
  opacity: 0.45;
}
.sidebar .family-item {
  transition: background 0.18s, border-color 0.18s, opacity 0.22s, transform 0.18s;
}
.sidebar:hover .family-item:hover {
  opacity: 1;
  transform: translateX(3px);
}

.family-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 20px 8px 22px;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, opacity 0.18s;
  border-left: 2px solid transparent;
  position: relative;
}
.family-item:hover {
  background: rgba(255,255,255,0.04);
  border-left-color: var(--family-color, var(--accent-blue));
}
.family-item:hover .family-name { color: var(--text-primary); }
.family-item.active {
  background: rgba(255,255,255,0.055);
  border-left-color: var(--family-color, var(--accent-blue));
}
.family-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--family-color, var(--accent-blue));
  flex-shrink: 0;
  transition: transform 0.18s;
}
.family-item:hover .family-dot { transform: scale(1.4); }
.family-name {
  font-size: 0.73rem;
  color: var(--text-secondary);
  flex: 1;
  transition: color 0.18s;
}
.family-item.active .family-name { color: var(--text-primary); }
.family-count {
  font-size: 0.6rem;
  color: var(--text-dim);
  background: var(--surface);
  padding: 1px 6px;
  border-radius: 8px;
  transition: background 0.18s, color 0.18s;
}
.family-item:hover .family-count,
.family-item.active .family-count {
  background: rgba(255,255,255,0.06);
  color: var(--text-secondary);
}

/* ─── DRUG CARDS HOVER FADE ──────────────────────────────────────── */
.drugs-grid:hover .drug-card {
  opacity: 0.38;
  filter: brightness(0.7);
}
.drugs-grid:hover .drug-card:hover {
  opacity: 1;
  filter: brightness(1);
  transform: translateY(-3px);
  box-shadow: 0 8px 28px rgba(0,0,0,0.45), 0 0 0 1px var(--family-color, var(--accent-blue));
}
.drug-card {
  transition: opacity 0.22s ease, filter 0.22s ease, transform 0.22s ease, box-shadow 0.22s ease;
}

/* CONTENT */
.content {
padding: 32px 40px;
overflow-y: auto;
}

.family-section {
margin-bottom: 48px;
opacity: 0;
transform: translateY(20px);
animation: fadeUp 0.5s forwards;
}

@keyframes fadeUp {
to { opacity: 1; transform: translateY(0); }
}

.family-header {
display: flex;
align-items: baseline;
gap: 16px;
margin-bottom: 20px;
padding-bottom: 12px;
border-bottom: 1px solid var(--border);
}

.family-title {
font-family: 'DM Serif Display', serif;
font-size: 1.4rem;
font-weight: 400;
}

.family-subtitle {
font-size: 0.7rem;
color: var(--text-dim);
letter-spacing: 0.08em;
}

.family-badge {
margin-left: auto;
font-size: 0.65rem;
padding: 4px 12px;
border-radius: 20px;
border: 1px solid var(--family-color, var(--accent-blue));
color: var(--family-color, var(--accent-blue));
opacity: 0.7;
}

/* DRUG GRID */
.drugs-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
gap: 16px;
}

.drug-card {
background: var(--card);
border: 1px solid var(--border);
border-radius: 10px;
padding: 20px;
cursor: pointer;
transition: all 0.2s;
position: relative;
overflow: hidden;
}

.drug-card::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0;
height: 2px;
background: var(--family-color, var(--accent-blue));
opacity: 0;
transition: opacity 0.2s;
}

.drug-card:hover {
border-color: var(--family-color, var(--accent-blue));
transform: translateY(-2px);
box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.drug-card:hover::before { opacity: 1; }

.drug-card-top {
display: flex;
justify-content: space-between;
align-items: flex-start;
margin-bottom: 12px;
}

.drug-name {
font-family: 'DM Serif Display', serif;
font-size: 1.15rem;
font-weight: 400;
color: var(--text-primary);
}

.drug-generic {
font-size: 0.65rem;
color: var(--text-dim);
margin-top: 2px;
}

.risk-badge {
font-size: 0.6rem;
letter-spacing: 0.08em;
padding: 3px 8px;
border-radius: 4px;
font-weight: 500;
white-space: nowrap;
}

.risk-alto { background: rgba(244,63,94,0.15); color: #f43f5e; }
.risk-medio { background: rgba(245,158,11,0.15); color: #f59e0b; }
.risk-bajo { background: rgba(16,185,129,0.15); color: #10b981; }
.risk-moderado { background: rgba(139,92,246,0.12); color: #8b5cf6; }

.drug-tags {
display: flex;
flex-wrap: wrap;
gap: 6px;
margin-bottom: 12px;
}

.tag {
font-size: 0.6rem;
letter-spacing: 0.06em;
padding: 3px 8px;
border-radius: 4px;
background: var(--surface);
color: var(--text-dim);
border: 1px solid var(--border);
}

.drug-desc {
font-size: 0.72rem;
color: var(--text-secondary);
line-height: 1.6;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
}

/* MODAL */
.modal-overlay {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.85);
backdrop-filter: blur(6px);
z-index: 1000;
display: flex;
align-items: center;
justify-content: center;
padding: 24px;
opacity: 0;
pointer-events: none;
transition: opacity 0.25s;
}

.modal-overlay.open {
opacity: 1;
pointer-events: all;
}

.modal {
background: var(--card);
border: 1px solid var(--border);
border-radius: 16px;
width: 100%;
max-width: 680px;
max-height: 85vh;
overflow-y: auto;
transform: scale(0.95) translateY(10px);
transition: transform 0.25s;
scrollbar-width: thin;
}

.modal-overlay.open .modal {
transform: scale(1) translateY(0);
}

.modal-top {
position: sticky;
top: 0;
background: var(--card);
padding: 28px 28px 0;
z-index: 1;
border-bottom: 1px solid var(--border);
padding-bottom: 20px;
}

.modal-close {
position: absolute;
top: 20px;
right: 20px;
width: 32px;
height: 32px;
border-radius: 50%;
background: var(--surface);
border: 1px solid var(--border);
color: var(--text-secondary);
font-size: 1rem;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.15s;
}

.modal-close:hover { background: var(--border); color: var(--text-primary); }

.modal-drug-name {
font-family: 'DM Serif Display', serif;
font-size: 2rem;
font-weight: 400;
}

.modal-meta {
display: flex;
gap: 12px;
margin-top: 8px;
flex-wrap: wrap;
align-items: center;
}

.modal-body {
padding: 24px 28px 28px;
}

.section-label {
font-size: 0.6rem;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(--text-dim);
margin-bottom: 10px;
margin-top: 20px;
}

.section-label:first-child { margin-top: 0; }

.effect-list {
display: flex;
flex-wrap: wrap;
gap: 8px;
}

.effect-tag {
font-size: 0.7rem;
padding: 5px 12px;
border-radius: 20px;
border: 1px solid;
}

.effect-pos { border-color: rgba(16,185,129,0.3); color: #10b981; background: rgba(16,185,129,0.07); }
.effect-neg { border-color: rgba(244,63,94,0.3); color: #f43f5e; background: rgba(244,63,94,0.07); }
.effect-neu { border-color: rgba(139,92,246,0.3); color: #8b5cf6; background: rgba(139,92,246,0.07); }

.info-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
}

.info-box {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 8px;
padding: 14px;
}

.info-box-label {
font-size: 0.6rem;
color: var(--text-dim);
letter-spacing: 0.1em;
text-transform: uppercase;
margin-bottom: 5px;
}

.info-box-val {
font-size: 0.78rem;
color: var(--text-primary);
line-height: 1.5;
}

.warning-box {
background: rgba(244,63,94,0.07);
border: 1px solid rgba(244,63,94,0.2);
border-radius: 8px;
padding: 14px 16px;
margin-top: 16px;
font-size: 0.72rem;
color: #f87171;
line-height: 1.6;
}

.warning-box strong { color: #f43f5e; }

/* CHEMISTRY PANEL */
.chem-panel {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 10px;
padding: 16px;
margin-top: 8px;
}

.chem-top {
display: flex;
align-items: flex-start;
gap: 20px;
margin-bottom: 16px;
flex-wrap: wrap;
}

.chem-formula {
font-family: 'DM Serif Display', serif;
font-size: 1.6rem;
color: var(--accent-teal);
letter-spacing: 0.02em;
line-height: 1;
padding: 10px 16px;
background: rgba(45,212,192,0.07);
border: 1px solid rgba(45,212,192,0.2);
border-radius: 8px;
white-space: nowrap;
}

.chem-right { display: flex; flex-direction: column; gap: 8px; flex: 1; }

.chem-info-row {
display: flex;
align-items: center;
gap: 10px;
}

.chem-lbl {
font-size: 0.6rem;
letter-spacing: 0.1em;
text-transform: uppercase;
color: var(--text-dim);
min-width: 100px;
}

.chem-val {
font-size: 0.75rem;
color: var(--text-primary);
}

.chem-elements-label {
font-size: 0.6rem;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(--text-dim);
margin-bottom: 10px;
}

.chem-elements {
display: flex;
flex-wrap: wrap;
gap: 8px;
}

.elem-card {
width: 64px;
height: 72px;
border: 1px solid;
border-radius: 6px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 1px;
cursor: default;
transition: transform 0.15s;
position: relative;
}

.elem-card:hover { transform: scale(1.08); }

.elem-num {
font-size: 0.55rem;
color: var(--text-dim);
position: absolute;
top: 4px;
left: 6px;
}

.elem-sym {
font-family: 'DM Serif Display', serif;
font-size: 1.4rem;
line-height: 1;
font-weight: 400;
}

.elem-name {
font-size: 0.55rem;
color: var(--text-secondary);
text-align: center;
line-height: 1.2;
}

.elem-group {
font-size: 0.48rem;
color: var(--text-dim);
text-align: center;
line-height: 1;
}

/* FACE RATINGS - CARD */
.card-ratings {
margin-top: 12px;
padding-top: 10px;
border-top: 1px solid var(--border);
display: flex;
flex-direction: column;
gap: 5px;
}
.card-rating-row {
display: flex;
align-items: center;
gap: 8px;
}
.card-rating-lbl {
font-size: 0.6rem;
color: var(--text-dim);
letter-spacing: 0.06em;
min-width: 64px;
}
.card-faces {
display: flex;
gap: 3px;
}
.face-dot {
font-size: 0.85rem;
width: 24px;
height: 24px;
display: flex;
align-items: center;
justify-content: center;
border-radius: 50%;
border: 1px solid var(--border);
transition: transform 0.15s;
line-height: 1;
}
.face-dot:hover { transform: scale(1.2); }
.face-empty {
color: var(--text-dim);
font-size: 0.7rem;
border-color: var(--border);
}
.face-active { }

/* FACE RATINGS - MODAL */
.modal-ratings {
display: flex;
gap: 0;
background: var(--surface);
border: 1px solid var(--border);
border-radius: 10px;
overflow: hidden;
margin-top: 8px;
}
.modal-rating-block {
flex: 1;
padding: 16px;
display: flex;
flex-direction: column;
align-items: center;
gap: 6px;
}
.modal-rating-divider {
width: 1px;
background: var(--border);
}
.modal-rating-title {
font-family: 'DM Serif Display', serif;
font-size: 1rem;
font-weight: 400;
}
.modal-rating-label {
font-size: 0.62rem;
color: var(--text-dim);
letter-spacing: 0.1em;
text-transform: uppercase;
}
.modal-faces {
display: flex;
gap: 4px;
margin: 4px 0;
}
.modal-faces .face-dot {
width: 28px;
height: 28px;
font-size: 1rem;
}
.modal-rating-score {
font-size: 0.65rem;
color: var(--text-dim);
}

.no-results {
text-align: center;
padding: 80px 40px;
color: var(--text-dim);
font-size: 0.8rem;
}

.no-results .big { font-family: 'DM Serif Display', serif; font-size: 3rem; margin-bottom: 8px; opacity: 0.3; }

@media (max-width: 768px) {
.main { grid-template-columns: 1fr; }
.sidebar { height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; padding: 12px 0; }
.family-item { flex-direction: column; min-width: 100px; text-align: center; border-left: none; border-bottom: 2px solid transparent; }
.family-item.active { border-left-color: transparent; border-bottom-color: var(--family-color); }
.header { padding: 24px 20px; }
.controls, .content { padding: 16px 20px; }
.info-grid { grid-template-columns: 1fr; }
}
/* MIXER BUTTON */
.mixer-btn {
background: linear-gradient(135deg, rgba(45,212,192,0.15), rgba(74,158,255,0.15));
border: 1px solid rgba(45,212,192,0.4);
color: var(--accent-teal);
font-family: 'DM Mono', monospace;
font-size: 0.72rem;
letter-spacing: 0.05em;
padding: 10px 18px;
border-radius: 8px;
cursor: pointer;
transition: all 0.2s;
white-space: nowrap;
}
.mixer-btn:hover {
background: linear-gradient(135deg, rgba(45,212,192,0.25), rgba(74,158,255,0.25));
border-color: var(--accent-teal);
transform: translateY(-1px);
box-shadow: 0 4px 20px rgba(45,212,192,0.2);
}

/* MIXER MODAL */
.mixer-modal { max-width: 720px; }

.mixer-search-wrap {
position: relative;
margin-bottom: 12px;
}
.mixer-search-wrap .search-icon {
position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
color: var(--text-dim); font-size: 0.9rem;
}
#mixer-search {
width: 100%;
background: var(--surface);
border: 1px solid var(--border);
color: var(--text-primary);
font-family: 'DM Mono', monospace;
font-size: 0.78rem;
padding: 10px 14px 10px 34px;
border-radius: 6px;
outline: none;
transition: border-color 0.2s;
}
#mixer-search:focus { border-color: var(--accent-teal); }
#mixer-search::placeholder { color: var(--text-dim); }

.mixer-list {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
gap: 6px;
max-height: 240px;
overflow-y: auto;
scrollbar-width: thin;
margin-bottom: 16px;
}
.mixer-item {
display: flex;
align-items: center;
gap: 8px;
padding: 8px 10px;
background: var(--surface);
border: 1px solid var(--border);
border-radius: 6px;
cursor: pointer;
font-size: 0.7rem;
color: var(--text-secondary);
transition: all 0.15s;
user-select: none;
}
.mixer-item:hover { border-color: var(--text-dim); color: var(--text-primary); }
.mixer-item.selected {
border-color: var(--accent-teal);
background: rgba(45,212,192,0.08);
color: var(--accent-teal);
}
.mixer-item-face { font-size: 0.9rem; }
.mixer-item-name { flex: 1; line-height: 1.3; }
.mixer-item-check { font-size: 0.7rem; opacity: 0; transition: opacity 0.15s; }
.mixer-item.selected .mixer-item-check { opacity: 1; }

.mixer-selected-label {
font-size: 0.6rem;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(--text-dim);
margin-bottom: 8px;
}
.mixer-selected-label span { color: var(--accent-teal); }

.mixer-selected {
display: flex;
flex-wrap: wrap;
gap: 6px;
min-height: 32px;
margin-bottom: 16px;
}
.mixer-chip {
display: flex;
align-items: center;
gap: 6px;
padding: 5px 10px;
background: rgba(45,212,192,0.1);
border: 1px solid rgba(45,212,192,0.3);
border-radius: 20px;
font-size: 0.68rem;
color: var(--accent-teal);
cursor: pointer;
transition: all 0.15s;
}
.mixer-chip:hover { background: rgba(244,63,94,0.1); border-color: rgba(244,63,94,0.3); color: #f43f5e; }
.mixer-chip-x { font-size: 0.6rem; opacity: 0.7; }

.mixer-analyze-btn {
width: 100%;
padding: 12px;
background: linear-gradient(135deg, rgba(45,212,192,0.2), rgba(74,158,255,0.2));
border: 1px solid var(--accent-teal);
color: var(--accent-teal);
font-family: 'DM Mono', monospace;
font-size: 0.78rem;
letter-spacing: 0.08em;
border-radius: 8px;
cursor: pointer;
transition: all 0.2s;
margin-bottom: 20px;
}
.mixer-analyze-btn:disabled {
opacity: 0.3;
cursor: not-allowed;
border-color: var(--border);
color: var(--text-dim);
background: transparent;
}
.mixer-analyze-btn:not(:disabled):hover {
background: linear-gradient(135deg, rgba(45,212,192,0.35), rgba(74,158,255,0.35));
box-shadow: 0 4px 20px rgba(45,212,192,0.2);
}

/* MIXER RESULT */
.mix-result-panel {
background: var(--surface);
border-radius: 12px;
overflow: hidden;
animation: fadeUp 0.3s forwards;
}
.mix-result-header {
padding: 20px 24px;
display: flex;
align-items: center;
gap: 16px;
}
.mix-result-face {
font-size: 3.5rem;
line-height: 1;
}
.mix-result-title {
font-family: 'DM Serif Display', serif;
font-size: 1.4rem;
}
.mix-result-subtitle {
font-size: 0.7rem;
margin-top: 3px;
opacity: 0.8;
}
.mix-result-scores {
display: grid;
grid-template-columns: 1fr 1fr;
border-top: 1px solid rgba(255,255,255,0.07);
}
.mix-score-block {
padding: 16px 20px;
border-right: 1px solid rgba(255,255,255,0.07);
}
.mix-score-block:last-child { border-right: none; }
.mix-score-label {
font-size: 0.6rem;
letter-spacing: 0.1em;
text-transform: uppercase;
margin-bottom: 8px;
opacity: 0.6;
}
.mix-score-faces { display: flex; gap: 4px; margin-bottom: 4px; }
.mix-score-num { font-size: 0.7rem; opacity: 0.5; }

.mix-interactions {
padding: 16px 24px;
border-top: 1px solid rgba(255,255,255,0.07);
}
.mix-interactions-title {
font-size: 0.62rem;
letter-spacing: 0.1em;
text-transform: uppercase;
margin-bottom: 12px;
opacity: 0.5;
}
.mix-pair {
display: flex;
align-items: flex-start;
gap: 10px;
padding: 10px 0;
border-bottom: 1px solid rgba(255,255,255,0.04);
font-size: 0.72rem;
}
.mix-pair:last-child { border-bottom: none; }
.mix-pair-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
.mix-pair-info { flex: 1; }
.mix-pair-names { font-weight: 500; margin-bottom: 3px; color: var(--text-primary); }
.mix-pair-desc { color: var(--text-secondary); line-height: 1.5; font-size: 0.68rem; }
.mix-pair-level {
font-size: 0.6rem;
padding: 2px 8px;
border-radius: 4px;
white-space: nowrap;
align-self: flex-start;
}
.level-letal { background: rgba(244,63,94,0.2); color: #f43f5e; }
.level-muy-peligroso { background: rgba(249,115,22,0.2); color: #fb923c; }
.level-peligroso { background: rgba(245,158,11,0.2); color: #fbbf24; }
.level-moderado { background: rgba(139,92,246,0.2); color: #a78bfa; }
.level-leve { background: rgba(16,185,129,0.2); color: #34d399; }
.level-seguro { background: rgba(45,212,192,0.15); color: #2dd4c0; }

/* CURIOSITY BOX */
.curio-box {
margin-top: 20px;
border-radius: 10px;
overflow: hidden;
border: 1px solid rgba(251,191,36,0.25);
background: linear-gradient(135deg, rgba(251,191,36,0.07), rgba(245,158,11,0.04));
}
.curio-header {
display: flex;
align-items: center;
gap: 10px;
padding: 12px 16px;
border-bottom: 1px solid rgba(251,191,36,0.15);
}
.curio-emoji { font-size: 1.4rem; }
.curio-title {
font-family: 'DM Serif Display', serif;
font-size: 0.95rem;
color: #fbbf24;
font-weight: 400;
}
.curio-label {
font-size: 0.55rem;
letter-spacing: 0.12em;
text-transform: uppercase;
color: rgba(251,191,36,0.5);
margin-top: 1px;
}
.curio-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.curio-row { display: flex; gap: 10px; align-items: flex-start; }
.curio-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
.curio-text { font-size: 0.72rem; color: var(--text-secondary); line-height: 1.6; }




/* ─── MASCOT ─────────────────────────────── */
.mascot-wrap {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
}
.mascot-wrap.mascot-hidden {
  opacity: 0;
  transform: translateY(30px) scale(0.7);
  pointer-events: none !important;
}
.mascot-recall-btn {
  position: fixed;
  bottom: 32px;
  right: 32px;
  z-index: 9998;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-teal, #2dd4bf);
  border: none;
  cursor: pointer;
  display: none;
  padding: 0;
  pointer-events: all;
  animation: pulse-dot 2.5s ease-in-out infinite;
  transition: width 0.2s, height 0.2s, bottom 0.2s, right 0.2s;
}
.mascot-recall-btn:hover {
  width: 14px;
  height: 14px;
  bottom: 29px;
  right: 29px;
  animation: none;
  box-shadow: 0 0 0 3px rgba(45,212,192,0.2);
}
.mascot-recall-btn.visible { display: block; }
@keyframes pulse-dot {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50%       { opacity: 1;   transform: scale(1.3); }
}
.mascot-bubble {
  position: relative;
  background: var(--card);
  border: 1px solid rgba(45,212,192,0.25);
  border-radius: 14px 14px 2px 14px;
  padding: 14px 16px 12px;
  max-width: 240px;
  box-shadow:
    0 0 0 1px rgba(45,212,192,0.08),
    0 8px 32px rgba(0,0,0,0.6),
    0 0 24px rgba(45,212,192,0.06);
  font-family: 'DM Mono', monospace;
  font-size: 0.67rem;
  line-height: 1.65;
  pointer-events: all;
  cursor: pointer;
  transition: opacity 0.3s, transform 0.3s, box-shadow 0.2s;
  transform-origin: bottom right;
  backdrop-filter: blur(8px);
}
.mascot-bubble::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(45,212,192,0.4), transparent);
  border-radius: 14px 14px 0 0;
}
.mascot-bubble:hover {
  box-shadow:
    0 0 0 1px rgba(45,212,192,0.18),
    0 10px 40px rgba(0,0,0,0.7),
    0 0 32px rgba(45,212,192,0.1);
  border-color: rgba(45,212,192,0.4);
}
.mascot-bubble.hidden {
  opacity: 0;
  transform: scale(0.8) translateY(8px);
  pointer-events: none;
}
.bubble-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.5rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-teal);
  background: rgba(45,212,192,0.08);
  border: 1px solid rgba(45,212,192,0.2);
  border-radius: 4px;
  padding: 2px 7px;
  margin-bottom: 8px;
}
.bubble-title {
  font-family: 'DM Serif Display', serif;
  font-size: 0.82rem;
  color: var(--text-primary);
  margin-bottom: 6px;
  line-height: 1.3;
}
.bubble-body {
  color: var(--text-secondary);
  font-size: 0.65rem;
  line-height: 1.6;
}
.bubble-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 11px;
  padding-top: 9px;
  border-top: 1px solid var(--border);
}
.bubble-dots { display: flex; gap: 5px; }
.bubble-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--border);
  cursor: pointer;
  pointer-events: all;
  transition: background 0.2s, transform 0.2s;
}
.bubble-dot:hover { transform: scale(1.4); }
.bubble-dot.on { background: var(--accent-teal); box-shadow: 0 0 6px rgba(45,212,192,0.6); }
.bubble-hint {
  font-size: 0.5rem;
  color: var(--text-dim);
  letter-spacing: 0.06em;
}
.mascot-img-wrap {
  position: relative;
  display: inline-block;
  pointer-events: all;
}
.mascot-img-wrap::before {
  display: none;
}
.mascot-img-wrap::after {
  display: none;
}
@keyframes rainbow-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes rainbow-glow {
  0%   { filter: drop-shadow(0 0 2px #ff0000) drop-shadow(0 0 4px #ff000099) drop-shadow(0 0 8px #ff000044); }
  14%  { filter: drop-shadow(0 0 2px #ff8800) drop-shadow(0 0 4px #ff880099) drop-shadow(0 0 8px #ff880044); }
  28%  { filter: drop-shadow(0 0 2px #ffee00) drop-shadow(0 0 4px #ffee0099) drop-shadow(0 0 8px #ffee0044); }
  42%  { filter: drop-shadow(0 0 2px #00ff44) drop-shadow(0 0 4px #00ff4499) drop-shadow(0 0 8px #00ff4444); }
  57%  { filter: drop-shadow(0 0 2px #00eeff) drop-shadow(0 0 4px #00eeff99) drop-shadow(0 0 8px #00eeff44); }
  71%  { filter: drop-shadow(0 0 2px #3366ff) drop-shadow(0 0 4px #3366ff99) drop-shadow(0 0 8px #3366ff44); }
  85%  { filter: drop-shadow(0 0 2px #dd00ff) drop-shadow(0 0 4px #dd00ff99) drop-shadow(0 0 8px #dd00ff44); }
  100% { filter: drop-shadow(0 0 2px #ff0000) drop-shadow(0 0 4px #ff000099) drop-shadow(0 0 8px #ff000044); }
}
.mascot-img {
  width: 110px;
  cursor: pointer;
  pointer-events: all;
  transition: transform 0.2s;
  margin-right: 4px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  transform: scaleX(-1);
  position: relative;
  z-index: 1;
  display: block;
  animation: rainbow-glow 3s linear infinite;
}
.mascot-img:hover { transform: scaleX(-1) scale(1.12) rotate(-6deg); }
.no-fx .mascot-img { animation: none !important; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)) !important; }

.mascot-dismiss-btn {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  border: none;
  color: rgba(255,255,255,0.5);
  font-size: 0.45rem;
  cursor: pointer;
  pointer-events: all;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  opacity: 0;
  transition: opacity 0.15s, background 0.15s;
  line-height: 1;
}
.mascot-img-wrap:hover .mascot-dismiss-btn { opacity: 1; }
.mascot-dismiss-btn:hover { background: rgba(239,68,68,0.9); color: #fff; }


/* ─── CICLODEX BRANDING ──────────────────────────────────────── */
h1 span {
  color: var(--accent-teal);
  text-shadow: 0 0 18px rgba(45,212,192,0.8), 0 0 40px rgba(45,212,192,0.4);
  animation: dexGlow 2.8s ease-in-out infinite alternate;
}
@keyframes dexGlow {
  from { text-shadow: 0 0 12px rgba(45,212,192,0.6), 0 0 30px rgba(45,212,192,0.3); }
  to   { text-shadow: 0 0 24px rgba(45,212,192,1),   0 0 55px rgba(45,212,192,0.6), 0 0 80px rgba(74,158,255,0.3); }
}

/* ─── CARD MIX BUTTON ─────────────────────────────────────────── */
.card-mix-btn {
  margin-top: 10px;
  width: 100%;
  padding: 7px 0;
  background: transparent;
  border: 1px solid rgba(45,212,192,0.3);
  border-radius: 6px;
  color: var(--accent-teal);
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.18s;
}
.card-mix-btn:hover {
  background: rgba(45,212,192,0.1);
  border-color: var(--accent-teal);
  box-shadow: 0 0 12px rgba(45,212,192,0.15);
}

/* ─── MODAL MIX BUTTON ────────────────────────────────────────── */
.modal-mix-btn {
  display: block;
  margin-top: 10px;
  padding: 9px 16px;
  background: linear-gradient(135deg, rgba(45,212,192,0.15), rgba(74,158,255,0.1));
  border: 1px solid rgba(45,212,192,0.4);
  border-radius: 8px;
  color: var(--accent-teal);
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
  text-align: left;
}
.modal-mix-btn:hover {
  background: linear-gradient(135deg, rgba(45,212,192,0.25), rgba(74,158,255,0.2));
  border-color: var(--accent-teal);
  box-shadow: 0 4px 16px rgba(45,212,192,0.2);
  transform: translateY(-1px);
}

/* ─── MODAL SECTIONS ──────────────────────────────────────────── */
.modal-section {
  margin-bottom: 4px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.modal-section-danger { border-color: rgba(244,63,94,0.2); }
.modal-section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 16px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid var(--border);
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  color: var(--text-primary);
}
.modal-section-danger .modal-section-header {
  background: rgba(244,63,94,0.05);
  border-bottom-color: rgba(244,63,94,0.15);
}
.modal-section-icon { font-size: 0.9rem; }
.modal-section > * { padding-left: 16px; padding-right: 16px; }
.modal-section > .modal-text { padding-top: 12px; padding-bottom: 4px; }
.modal-section > .modal-subsection-label { padding-top: 12px; }
.modal-section > .effect-list { padding-top: 6px; padding-bottom: 4px; }
.modal-section > .info-grid { padding-top: 12px; padding-bottom: 12px; }
.modal-section > .warning-box { margin-left: 16px; margin-right: 16px; margin-bottom: 14px; margin-top: 0; }
.modal-text {
  font-size: 0.78rem;
  line-height: 1.7;
  color: var(--text-secondary);
  padding-bottom: 12px;
}
.modal-text-sm {
  font-size: 0.72rem;
  line-height: 1.7;
  color: var(--text-secondary);
  padding-bottom: 12px;
  padding-left: 16px;
  padding-right: 16px;
}
.modal-subsection-label {
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.effect-pos-label { color: rgba(16,185,129,0.7) !important; }
.effect-neg-label { color: rgba(244,63,94,0.7) !important; }
.effect-neu-label { color: rgba(139,92,246,0.6) !important; }



/* ─── ANIMATED DANGER STRIP ─────────────────────────────────────────── */
@keyframes pipFill {
  from { transform: scaleX(0); opacity: 0; }
  to   { transform: scaleX(1); opacity: 1; }
}
.mds-pip, .scale-pip, .mrv2-bar .scale-pip {
  transform-origin: left center;
}
.mds-pip.on.anim, .scale-pip.on.anim, .mrv2-bar .scale-pip.on.anim {
  animation: pipFill 0.22s ease forwards;
}

/* ─── MODAL DANGER STRIP (top of modal) ─────────────────────────── */
.modal-danger-strip {
  display: flex;
  align-items: center;
  gap: 0;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 10px;
  overflow: hidden;
}
.mds-item {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
}
.mds-divider {
  width: 1px;
  height: 36px;
  background: var(--border);
  flex-shrink: 0;
}
.mds-emoji { font-size: 1.1rem; flex-shrink: 0; }
.mds-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.mds-label {
  font-size: 0.55rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.mds-bar { display: flex; gap: 2px; }
.mds-pip {
  width: 14px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
}
.mds-score {
  font-family: 'DM Serif Display', serif;
  font-size: 1.1rem;
  line-height: 1;
  flex-shrink: 0;
}
.mds-of {
  font-family: 'DM Mono', monospace;
  font-size: 0.5rem;
  color: var(--text-dim);
}
.modal-meta-tags {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.card-ratings {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 7px;
  /* Oculto por defecto — se revela en hover de la card */
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  padding-top: 0;
  border-top-color: transparent;
  transition: opacity 0.35s ease, max-height 0.4s ease, padding-top 0.35s ease, border-top-color 0.35s ease;
}
.drug-card:hover .card-ratings {
  opacity: 1;
  max-height: 120px;
  padding-top: 10px;
  border-top-color: var(--border);
}
.card-rating-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-rating-emoji {
  font-size: 1.1rem;
  cursor: default;
  flex-shrink: 0;
}
.card-rating-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.card-rating-lbl {
  font-size: 0.58rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.scale-bar {
  display: flex;
  gap: 3px;
}
.scale-pip {
  width: 18px;
  height: 5px;
  border-radius: 3px;
  background: var(--border);
  transition: background 0.2s;
}
.scale-pip.on { }

/* ── Glow por nivel de peligro/letalidad ─────────────────── */
/* Nivel 1 — verde: pulso suave */
@keyframes pip-glow-1 {
  0%,100% { box-shadow: 0 0 3px 0px #10b98166; }
  50%     { box-shadow: 0 0 7px 2px #10b98199; }
}
/* Nivel 2 — lima: brillo cálido */
@keyframes pip-glow-2 {
  0%,100% { box-shadow: 0 0 3px 0px #84cc1666; }
  50%     { box-shadow: 0 0 8px 2px #84cc1699; }
}
/* Nivel 3 — ámbar: pulso medio */
@keyframes pip-glow-3 {
  0%,100% { box-shadow: 0 0 4px 1px #f59e0b77; }
  50%     { box-shadow: 0 0 10px 3px #f59e0baa; }
}
/* Nivel 4 — naranja: pulso intenso */
@keyframes pip-glow-4 {
  0%,100% { box-shadow: 0 0 5px 1px #f9731688, 0 0 10px 2px #f9731644; }
  50%     { box-shadow: 0 0 12px 4px #f97316bb, 0 0 22px 6px #f9731655; }
}
/* Nivel 5 — rojo crítico: pulso agresivo y largo */
@keyframes pip-glow-5 {
  0%,100% { box-shadow: 0 0 6px 2px #ef444488, 0 0 14px 4px #ef444444; }
  40%     { box-shadow: 0 0 16px 6px #ef4444cc, 0 0 30px 10px #ef444466; }
  60%     { box-shadow: 0 0 10px 3px #ff000099, 0 0 22px 8px #ff000055; }
}

/* Aplicar glow a los pips activos dentro de las cards en hover */
.drug-card:hover .scale-pip.on[style*="#10b981"] {
  animation: pip-glow-1 2.2s ease-in-out infinite;
}
.drug-card:hover .scale-pip.on[style*="#84cc16"] {
  animation: pip-glow-2 2s ease-in-out infinite;
}
.drug-card:hover .scale-pip.on[style*="#f59e0b"] {
  animation: pip-glow-3 1.8s ease-in-out infinite;
}
.drug-card:hover .scale-pip.on[style*="#f97316"] {
  animation: pip-glow-4 1.4s ease-in-out infinite;
}
.drug-card:hover .scale-pip.on[style*="#ef4444"] {
  animation: pip-glow-5 1.1s ease-in-out infinite;
}

/* Efecto de crecimiento escalonado al aparecer — cada pip sale con delay */
.drug-card:hover .scale-pip.on:nth-child(1) { animation-delay: 0s;    }
.drug-card:hover .scale-pip.on:nth-child(2) { animation-delay: 0.06s; }
.drug-card:hover .scale-pip.on:nth-child(3) { animation-delay: 0.12s; }
.drug-card:hover .scale-pip.on:nth-child(4) { animation-delay: 0.18s; }
.drug-card:hover .scale-pip.on:nth-child(5) { animation-delay: 0.24s; }

/* Modal — pips siempre visibles con glow activo también */
.modal-rating-v2-block .scale-pip.on[style*="#10b981"] { animation: pip-glow-1 2.2s ease-in-out infinite; }
.modal-rating-v2-block .scale-pip.on[style*="#84cc16"] { animation: pip-glow-2 2s ease-in-out infinite; }
.modal-rating-v2-block .scale-pip.on[style*="#f59e0b"] { animation: pip-glow-3 1.8s ease-in-out infinite; }
.modal-rating-v2-block .scale-pip.on[style*="#f97316"] { animation: pip-glow-4 1.4s ease-in-out infinite; }
.modal-rating-v2-block .scale-pip.on[style*="#ef4444"] { animation: pip-glow-5 1.1s ease-in-out infinite; }
.modal-danger-strip    .mds-pip.on[style*="#10b981"]   { animation: pip-glow-1 2.2s ease-in-out infinite; }
.modal-danger-strip    .mds-pip.on[style*="#84cc16"]   { animation: pip-glow-2 2s ease-in-out infinite; }
.modal-danger-strip    .mds-pip.on[style*="#f59e0b"]   { animation: pip-glow-3 1.8s ease-in-out infinite; }
.modal-danger-strip    .mds-pip.on[style*="#f97316"]   { animation: pip-glow-4 1.4s ease-in-out infinite; }
.modal-danger-strip    .mds-pip.on[style*="#ef4444"]   { animation: pip-glow-5 1.1s ease-in-out infinite; }
.card-rating-num {
  font-family: 'DM Serif Display', serif;
  font-size: 1.05rem;
  line-height: 1;
  flex-shrink: 0;
}
.card-rating-denom {
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  color: var(--text-dim);
  margin-left: 1px;
}

/* ─── MODAL RATINGS V2 ───────────────────────────────────────────── */
.modal-ratings-v2 {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.modal-rating-v2-block {
  flex: 1;
  min-width: 160px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.mrv2-emoji { font-size: 1.8rem; flex-shrink: 0; }
.mrv2-body { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.mrv2-label { font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
.mrv2-bar { display: flex; gap: 4px; }
.mrv2-bar .scale-pip { width: 22px; height: 6px; }
.mrv2-score {
  font-family: 'DM Serif Display', serif;
  font-size: 1.6rem;
  line-height: 1;
  flex-shrink: 0;
}
.mrv2-denom { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--text-dim); }
.mrv2-tag {
  font-size: 0.6rem;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid;
  white-space: nowrap;
  align-self: flex-start;
  flex-shrink: 0;
}

/* ─── DATO CURIOSO COLLAPSIBLE ───────────────────────────────────── */
.curio-collapsible {
  margin-top: 10px;
  border: 1px solid rgba(251,191,36,0.25);
  border-radius: 10px;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(251,191,36,0.05), rgba(245,158,11,0.02));
}
.curio-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  background: transparent;
  border: none;
  cursor: pointer;
  text-align: left;
  transition: background 0.18s;
}
.curio-toggle:hover { background: rgba(251,191,36,0.06); }
.curio-toggle-emoji { font-size: 1.4rem; flex-shrink: 0; }
.curio-toggle-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.curio-toggle-title {
  font-family: 'DM Serif Display', serif;
  font-size: 0.92rem;
  color: #fbbf24;
  font-weight: 400;
}
.curio-toggle-sub { font-size: 0.58rem; letter-spacing: 0.1em; color: rgba(251,191,36,0.45); text-transform: uppercase; }
.curio-toggle-arrow {
  font-size: 0.85rem;
  color: rgba(251,191,36,0.5);
  transition: transform 0.25s;
  flex-shrink: 0;
}
.curio-collapsible.open .curio-toggle-arrow { transform: rotate(90deg); }
.curio-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease, padding 0.25s ease;
  padding: 0 16px;
}
.curio-collapsible.open .curio-panel {
  max-height: 500px;
  padding: 0 16px 14px;
}

/* ─── FAMILY SECTION SEPARATOR + SCROLL REVEAL ──────────────────── */
.reveal-section {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity 0.45s ease, transform 0.45s ease;
  border-top: 1px solid var(--border);
  padding-top: 28px;
  margin-top: 8px;
}
.reveal-section:first-child { border-top: none; padding-top: 0; }
.reveal-section.visible {
  opacity: 1;
  transform: translateY(0);
}


/* ─── GUÍA DE MEZCLAS ────────────────────────────────────────────── */
.modal-section-mix { border-color: rgba(45,212,192,0.2); }
.modal-section-mix .modal-section-header {
  background: rgba(45,212,192,0.05);
  border-bottom-color: rgba(45,212,192,0.15);
}
.mg-body { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.mg-group { display: flex; flex-direction: column; gap: 6px; }
.mg-group-title {
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 500;
  padding: 4px 0 2px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.mg-safe-title   { color: #10b981; border-color: rgba(16,185,129,0.2); }
.mg-caution-title{ color: #f59e0b; border-color: rgba(245,158,11,0.2); }
.mg-avoid-title  { color: #ef4444; border-color: rgba(239,68,68,0.2); }
.mg-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 8px 10px;
  border-radius: 7px;
  border: 1px solid transparent;
}
.mg-safe    { background: rgba(16,185,129,0.05);  border-color: rgba(16,185,129,0.12); }
.mg-caution { background: rgba(245,158,11,0.05);  border-color: rgba(245,158,11,0.12); }
.mg-avoid   { background: rgba(239,68,68,0.05);   border-color: rgba(239,68,68,0.12); }
.mg-icon { font-size: 0.85rem; flex-shrink: 0; margin-top: 1px; }
.mg-content { display: flex; flex-direction: column; gap: 2px; }
.mg-drug {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-primary);
}
.mg-reason {
  font-size: 0.66rem;
  color: var(--text-secondary);
  line-height: 1.5;
}
.mg-empty {
  font-size: 0.66rem;
  color: var(--text-dim);
  font-style: italic;
  padding: 4px 0;
}


/* ─── EFECTO PSICODÉLICO ─────────────────────────────────────────── */
@keyframes psychoHue {
  0%   { filter: hue-rotate(0deg)   saturate(1)   brightness(1); }
  15%  { filter: hue-rotate(60deg)  saturate(2.5) brightness(1.15); }
  30%  { filter: hue-rotate(130deg) saturate(3)   brightness(0.95); }
  50%  { filter: hue-rotate(220deg) saturate(2.8) brightness(1.2); }
  70%  { filter: hue-rotate(300deg) saturate(3.2) brightness(1.05); }
  85%  { filter: hue-rotate(380deg) saturate(2.4) brightness(1.1); }
  100% { filter: hue-rotate(420deg) saturate(1)   brightness(1); }
}
@keyframes psychoWave {
  0%   { transform: skewX(0deg)   skewY(0deg)   scale(1); }
  20%  { transform: skewX(1.5deg) skewY(0.5deg) scale(1.01); }
  40%  { transform: skewX(-1deg)  skewY(1deg)   scale(1.015); }
  60%  { transform: skewX(1deg)   skewY(-0.5deg) scale(1.008); }
  80%  { transform: skewX(-1.5deg) skewY(0.3deg) scale(1.012); }
  100% { transform: skewX(0deg)   skewY(0deg)   scale(1); }
}
@keyframes psychoBorder {
  0%   { border-color: #f43f5e; box-shadow: 0 0 18px #f43f5e66, inset 0 0 12px #f43f5e22; }
  16%  { border-color: #fb923c; box-shadow: 0 0 22px #fb923c88, inset 0 0 14px #fb923c22; }
  33%  { border-color: #facc15; box-shadow: 0 0 20px #facc1577, inset 0 0 12px #facc1522; }
  50%  { border-color: #4ade80; box-shadow: 0 0 24px #4ade8088, inset 0 0 16px #4ade8022; }
  66%  { border-color: #38bdf8; box-shadow: 0 0 20px #38bdf888, inset 0 0 12px #38bdf822; }
  83%  { border-color: #a78bfa; box-shadow: 0 0 22px #a78bfa88, inset 0 0 14px #a78bfa22; }
  100% { border-color: #f43f5e; box-shadow: 0 0 18px #f43f5e66, inset 0 0 12px #f43f5e22; }
}
@keyframes psychoText {
  0%   { color: #f9a8d4; text-shadow: 0 0 8px #f43f5e; }
  25%  { color: #86efac; text-shadow: 0 0 12px #4ade80; }
  50%  { color: #93c5fd; text-shadow: 0 0 10px #38bdf8; }
  75%  { color: #fde68a; text-shadow: 0 0 10px #facc15; }
  100% { color: #f9a8d4; text-shadow: 0 0 8px #f43f5e; }
}
@keyframes psychoBg {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
[data-family="psicodelicos"]:hover {
  animation: psychoWave 3.5s ease-in-out infinite;
  position: relative;
  z-index: 3;
}
[data-family="psicodelicos"]:hover .family-title {
  animation: psychoText 2s linear infinite;
}
[data-family="psicodelicos"]:hover .family-header {
  background: linear-gradient(270deg, #f43f5e22, #a78bfa22, #38bdf822, #4ade8022, #facc1522);
  background-size: 400% 400%;
  animation: psychoBg 4s ease infinite;
  border-radius: 8px;
  padding: 8px 12px;
  margin: -8px -12px 12px;
}
[data-family="psicodelicos"]:hover .drug-card {
  animation: psychoHue 3s linear infinite, psychoBorder 3s linear infinite;
}
[data-family="psicodelicos"]:hover .drug-card:nth-child(1)  { animation-delay: 0s,   0s; }
[data-family="psicodelicos"]:hover .drug-card:nth-child(2)  { animation-delay: 0.2s, 0.2s; }
[data-family="psicodelicos"]:hover .drug-card:nth-child(3)  { animation-delay: 0.4s, 0.4s; }
[data-family="psicodelicos"]:hover .drug-card:nth-child(4)  { animation-delay: 0.6s, 0.6s; }
[data-family="psicodelicos"]:hover .drug-card:nth-child(5)  { animation-delay: 0.8s, 0.8s; }
[data-family="psicodelicos"]:hover .drug-card:nth-child(6)  { animation-delay: 1.0s, 1.0s; }
[data-family="psicodelicos"]:hover .drug-card:nth-child(7)  { animation-delay: 1.2s, 1.2s; }
[data-family="psicodelicos"]:hover .drug-card:nth-child(8)  { animation-delay: 1.4s, 1.4s; }
[data-family="psicodelicos"]:hover .drug-card:nth-child(9)  { animation-delay: 1.6s, 1.6s; }
[data-family="psicodelicos"]:hover .drug-card:nth-child(10) { animation-delay: 1.8s, 1.8s; }
[data-family="psicodelicos"]:hover .drug-name {
  animation: psychoText 1.8s linear infinite;
}

/* ══════════════════════════════════════════════════════════════════
   EFECTOS POR FAMILIA
   ══════════════════════════════════════════════════════════════════ */

/* ─── CANNABIS — mellow, verde flotante, hazing ─────────────────── */
@keyframes cannabisFloat {
  0%,100% { transform: translateY(0) rotate(0deg); }
  30%     { transform: translateY(-5px) rotate(0.5deg); }
  70%     { transform: translateY(-2px) rotate(-0.4deg); }
}
@keyframes cannabisGlow {
  0%,100% { border-color: #4ade80; box-shadow: 0 0 14px #4ade8044, inset 0 0 20px #16a34a11; }
  50%     { border-color: #86efac; box-shadow: 0 0 26px #86efac77, inset 0 0 28px #4ade8022; }
}
@keyframes cannabisHaze {
  0%,100% { filter: saturate(1.4) brightness(1) hue-rotate(0deg); }
  50%     { filter: saturate(1.9) brightness(1.06) hue-rotate(20deg); }
}
@keyframes cannabisBg {
  0%,100% { background-position: 0% 50%; }
  50%     { background-position: 100% 50%; }
}
[data-family="cannabinoides"]:hover { animation: cannabisFloat 5s ease-in-out infinite; position:relative; z-index:3; }
[data-family="cannabinoides"]:hover .drug-card { animation: cannabisGlow 4s ease-in-out infinite, cannabisHaze 4s ease-in-out infinite; }
[data-family="cannabinoides"]:hover .drug-card:nth-child(odd)  { animation-delay: 0s, 0s; }
[data-family="cannabinoides"]:hover .drug-card:nth-child(even) { animation-delay: 1.5s, 1.5s; }
[data-family="cannabinoides"]:hover .drug-name { color: #4ade80; text-shadow: 0 0 10px #4ade8077; transition: all 0.4s; }
[data-family="cannabinoides"]:hover .family-title { color: #4ade80 !important; text-shadow: 0 0 18px #4ade8099; }
[data-family="cannabinoides"]:hover .family-header {
  background: linear-gradient(270deg, #16a34a18, #4ade8012, #86efac18, #16a34a12);
  background-size: 300% 300%; animation: cannabisBg 6s ease infinite;
  border-radius: 8px; padding: 8px 12px; margin: -8px -12px 12px;
}

/* ─── ALCOHOL/DEPRESORES — tambaleo borracho, visión doble ───────── */
@keyframes drunkSway {
  0%,100% { transform: rotate(0deg) translateX(0); }
  25%     { transform: rotate(-0.3deg) translateX(-1.5px); }
  75%     { transform: rotate(0.3deg) translateX(1.5px); }
}
@keyframes doubleVision {
  0%,100% { text-shadow: none; filter: blur(0); }
  50%     { text-shadow: 1.5px 0 #f59e0b22, -1.5px 0 #ef444422; filter: blur(0.2px); }
}
@keyframes alcoholBorder {
  0%,100% { border-color: #94a3b833; box-shadow: 0 0 6px #94a3b822; }
  50%     { border-color: #fbbf2466; box-shadow: 0 0 12px #fbbf2433; }
}
[data-family="alcoholdepresores"]:hover { animation: drunkSway 6s ease-in-out infinite; position:relative; z-index:3; transform-origin: bottom center; }
[data-family="alcoholdepresores"]:hover .drug-card { animation: alcoholBorder 5s ease-in-out infinite; }
[data-family="alcoholdepresores"]:hover .drug-card:nth-child(odd)  { animation-delay: 0s; }
[data-family="alcoholdepresores"]:hover .drug-card:nth-child(even) { animation-delay: 1.5s; }
[data-family="alcoholdepresores"]:hover .drug-name { animation: doubleVision 5s ease-in-out infinite; }
[data-family="alcoholdepresores"]:hover .family-title { color: #fbbf24 !important; }

/* ─── ESTIMULANTES — taquicardia, pulso eléctrico, urgencia ──────── */
@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  12%     { transform: scale(1.014); }
  24%     { transform: scale(1); }
  36%     { transform: scale(1.02); }
  48%     { transform: scale(1); }
}
@keyframes electricBorder {
  0%,100% { border-color: #f59e0b; box-shadow: 0 0 10px #f59e0b88; }
  25%     { border-color: #fbbf24; box-shadow: 0 0 30px #fbbf24cc, 0 0 6px #fff9; }
  50%     { border-color: #ef4444; box-shadow: 0 0 20px #ef444499; }
  75%     { border-color: #fb923c; box-shadow: 0 0 26px #fb923cbb, 0 0 4px #fff7; }
}
@keyframes stimText {
  0%,85%,100% { letter-spacing: normal; color: inherit; }
  5%          { letter-spacing: 0.1em; color: #fbbf24; text-shadow: 0 0 8px #f59e0b99; }
}
[data-family="estimulantes"]:hover { animation: heartbeat 0.65s ease-in-out infinite; position:relative; z-index:3; }
[data-family="estimulantes"]:hover .drug-card { animation: electricBorder 0.75s ease-in-out infinite; }
[data-family="estimulantes"]:hover .drug-card:nth-child(1) { animation-delay: 0s; }
[data-family="estimulantes"]:hover .drug-card:nth-child(2) { animation-delay: 0.1s; }
[data-family="estimulantes"]:hover .drug-card:nth-child(3) { animation-delay: 0.2s; }
[data-family="estimulantes"]:hover .drug-card:nth-child(4) { animation-delay: 0.3s; }
[data-family="estimulantes"]:hover .drug-card:nth-child(5) { animation-delay: 0.4s; }
[data-family="estimulantes"]:hover .drug-card:nth-child(6) { animation-delay: 0.5s; }
[data-family="estimulantes"]:hover .drug-name { animation: stimText 0.8s ease-in-out infinite; }
[data-family="estimulantes"]:hover .family-title { color: #fbbf24 !important; text-shadow: 0 0 22px #f59e0bcc; animation: heartbeat 0.65s ease-in-out infinite; }

/* ─── OPIOIDES — sedación profunda, deriva, calor rojo ───────────── */
@keyframes opioideDrift {
  0%,100% { transform: translateY(0) scale(1); filter: blur(0); }
  50%     { transform: translateY(4px) scale(0.996); filter: blur(0.4px); }
}
@keyframes opioideWarm {
  0%,100% { border-color: #f43f5e44; box-shadow: 0 0 16px #f43f5e33, inset 0 0 24px #f43f5e0a; }
  50%     { border-color: #fb7185; box-shadow: 0 0 32px #f43f5e66, inset 0 0 32px #f43f5e1a; }
}
@keyframes opioideText { 0%,100% { opacity:1; } 50% { opacity:0.65; letter-spacing:0.04em; } }
[data-family="opioides"]:hover { animation: opioideDrift 5s ease-in-out infinite; position:relative; z-index:3; }
[data-family="opioides"]:hover .drug-card { animation: opioideWarm 4s ease-in-out infinite; transition: all 0.9s ease !important; }
[data-family="opioides"]:hover .drug-card:nth-child(odd)  { animation-delay: 0s; }
[data-family="opioides"]:hover .drug-card:nth-child(even) { animation-delay: 1.5s; }
[data-family="opioides"]:hover .drug-name { animation: opioideText 3.5s ease-in-out infinite; color: #fda4af; }
[data-family="opioides"]:hover .family-title { color: #f43f5e !important; text-shadow: 0 0 24px #f43f5e88; animation: opioideText 4.5s ease-in-out infinite; }

/* ─── BENZODIACEPINAS — ansiolítico, suave, flotante azul ────────── */
@keyframes benzoBlur { 0%,100% { filter: blur(0) brightness(1); } 50% { filter: blur(0.7px) brightness(1.05); } }
@keyframes benzoGlow {
  0%,100% { border-color: #4a9eff33; box-shadow: 0 0 10px #4a9eff22; }
  50%     { border-color: #93c5fd; box-shadow: 0 0 24px #4a9eff66, inset 0 0 20px #4a9eff0d; }
}
@keyframes benzoDrift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
[data-family="benzodiazepinas"]:hover { animation: benzoDrift 5.5s ease-in-out infinite; position:relative; z-index:3; }
[data-family="benzodiazepinas"]:hover .drug-card { animation: benzoGlow 4s ease-in-out infinite, benzoBlur 5.5s ease-in-out infinite; }
[data-family="benzodiazepinas"]:hover .drug-card:nth-child(odd)  { animation-delay: 0s, 0s; }
[data-family="benzodiazepinas"]:hover .drug-card:nth-child(even) { animation-delay: 1.2s, 1.2s; }
[data-family="benzodiazepinas"]:hover .drug-name { color: #93c5fd; text-shadow: 0 0 8px #4a9eff66; transition: all 0.6s; }
[data-family="benzodiazepinas"]:hover .family-title { color: #93c5fd !important; text-shadow: 0 0 18px #4a9eff88; }

/* ─── EMPATÓGENOS — MDMA, calor rosado, conexión, pulso suave ─────── */
@keyframes empathyPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.016); } }
@keyframes empathyGlow {
  0%,100% { border-color: #f472b6; box-shadow: 0 0 16px #f472b644, inset 0 0 18px #f472b60d; }
  33%     { border-color: #fb7185; box-shadow: 0 0 28px #fb718566, inset 0 0 24px #fb71851a; }
  66%     { border-color: #c084fc; box-shadow: 0 0 22px #c084fc55, inset 0 0 20px #c084fc11; }
}
@keyframes empathyBg { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
[data-family="empatogenos"]:hover { animation: empathyPulse 2.2s ease-in-out infinite; position:relative; z-index:3; }
[data-family="empatogenos"]:hover .drug-card { animation: empathyGlow 2.5s ease-in-out infinite; }
[data-family="empatogenos"]:hover .drug-card:nth-child(1) { animation-delay: 0s; }
[data-family="empatogenos"]:hover .drug-card:nth-child(2) { animation-delay: 0.5s; }
[data-family="empatogenos"]:hover .drug-card:nth-child(3) { animation-delay: 1.0s; }
[data-family="empatogenos"]:hover .drug-name { color: #f9a8d4; text-shadow: 0 0 10px #f472b677; transition: all 0.4s; }
[data-family="empatogenos"]:hover .family-title { color: #f472b6 !important; text-shadow: 0 0 20px #f472b699; animation: empathyPulse 2.2s ease-in-out infinite; }
[data-family="empatogenos"]:hover .family-header {
  background: linear-gradient(270deg, #f472b618, #fb718515, #c084fc18, #f472b612);
  background-size: 300% 300%; animation: empathyBg 5s ease infinite;
  border-radius: 8px; padding: 8px 12px; margin: -8px -12px 12px;
}

/* ─── DISOCIATIVOS — k-hole, rotación 3D, vacío azul ─────────────── */
@keyframes dissociateCard {
  0%,100% { transform: perspective(600px) rotateY(0deg) scale(1); filter: brightness(1) saturate(1); }
  30%     { transform: perspective(600px) rotateY(2deg) scale(1.012); filter: brightness(1.12) saturate(0.7) hue-rotate(35deg); }
  70%     { transform: perspective(600px) rotateY(-1.5deg) scale(1.006); filter: brightness(0.88) saturate(1.3) hue-rotate(-25deg); }
}
@keyframes dissociateBorder {
  0%,100% { border-color: #67e8f9; box-shadow: 0 0 16px #67e8f944; }
  50%     { border-color: #a5f3fc; box-shadow: 0 0 34px #67e8f988, 0 0 60px #67e8f922; }
}
@keyframes voidDrift { 0%,100% { transform: scale(1); } 50% { transform: scale(1.006) translateY(-3px); } }
[data-family="disociativos"]:hover { animation: voidDrift 6s ease-in-out infinite; position:relative; z-index:3; }
[data-family="disociativos"]:hover .drug-card { animation: dissociateCard 5s ease-in-out infinite, dissociateBorder 4s ease-in-out infinite; }
[data-family="disociativos"]:hover .drug-card:nth-child(1) { animation-delay: 0s, 0s; }
[data-family="disociativos"]:hover .drug-card:nth-child(2) { animation-delay: 0.8s, 0.8s; }
[data-family="disociativos"]:hover .drug-card:nth-child(3) { animation-delay: 1.6s, 1.6s; }
[data-family="disociativos"]:hover .drug-card:nth-child(4) { animation-delay: 2.4s, 2.4s; }
[data-family="disociativos"]:hover .drug-name { color: #a5f3fc; text-shadow: 0 0 12px #67e8f988; transition: all 0.5s; }
[data-family="disociativos"]:hover .family-title { color: #67e8f9 !important; text-shadow: 0 0 24px #67e8f9aa; filter: blur(0.3px); }

/* ─── ANTIDEPRESIVOS — serotonina, amanecer suave ─────────────────── */
@keyframes serotoninRise { 0%,100% { transform: translateY(0); filter: brightness(1) saturate(1); } 50% { transform: translateY(-3px); filter: brightness(1.07) saturate(1.4); } }
@keyframes serotoninBorder {
  0%,100% { border-color: #10b98144; box-shadow: 0 0 12px #10b98122; }
  50%     { border-color: #34d399; box-shadow: 0 0 22px #10b98166, inset 0 0 16px #10b9810d; }
}
[data-family="antidepresivos"]:hover { animation: serotoninRise 4.5s ease-in-out infinite; position:relative; z-index:3; }
[data-family="antidepresivos"]:hover .drug-card { animation: serotoninBorder 4s ease-in-out infinite; }
[data-family="antidepresivos"]:hover .drug-card:nth-child(odd)  { animation-delay: 0s; }
[data-family="antidepresivos"]:hover .drug-card:nth-child(even) { animation-delay: 1.4s; }
[data-family="antidepresivos"]:hover .drug-name { color: #6ee7b7; text-shadow: 0 0 8px #10b98155; transition: all 0.4s; }
[data-family="antidepresivos"]:hover .family-title { color: #34d399 !important; text-shadow: 0 0 18px #10b98177; }

/* ─── INHALANTES — glitch tóxico, parpadeo agresivo ──────────────── */
@keyframes inhalantGlitch {
  0%,92%,100% { transform: none; filter: none; }
  93% { transform: translateX(-5px) skewX(-3deg); filter: hue-rotate(90deg) saturate(4) brightness(1.6); }
  94% { transform: translateX(6px) skewX(2deg); filter: hue-rotate(180deg) saturate(3) brightness(0.6); }
  95% { transform: translateX(-3px); filter: hue-rotate(270deg) saturate(5) brightness(1.4); }
  96% { transform: none; filter: none; }
}
@keyframes toxicBorder {
  0%,100% { border-color: #a3e63544; box-shadow: 0 0 10px #84cc1633; }
  40%     { border-color: #facc15; box-shadow: 0 0 22px #facc1577; }
  80%     { border-color: #ef4444; box-shadow: 0 0 18px #ef444466; }
}
[data-family="inhalantes"]:hover .drug-card { animation: inhalantGlitch 1.8s steps(1) infinite, toxicBorder 2s ease-in-out infinite; }
[data-family="inhalantes"]:hover .drug-card:nth-child(1) { animation-delay: 0s, 0s; }
[data-family="inhalantes"]:hover .drug-card:nth-child(2) { animation-delay: 0.4s, 0.4s; }
[data-family="inhalantes"]:hover .drug-name { color: #bef264; text-shadow: 0 0 8px #84cc1666; animation: inhalantGlitch 2.5s steps(1) infinite; }
[data-family="inhalantes"]:hover .family-title { color: #a3e635 !important; animation: inhalantGlitch 2s steps(1) infinite; }

/* ─── DROGAS SINTÉTICAS — glitch digital duro, neón frío ─────────── */
@keyframes synthGlitch {
  0%,88%,100% { transform: none; filter: none; }
  89% { transform: translateX(-7px); filter: hue-rotate(120deg) saturate(6) brightness(1.6); }
  90% { transform: translateX(7px);  filter: hue-rotate(240deg) saturate(4) brightness(0.6); }
  91% { transform: translateX(-3px); filter: hue-rotate(0deg) saturate(3) brightness(1.3); }
  92% { transform: none; filter: none; }
}
@keyframes synthBorder {
  0%,100% { border-color: #a78bfa; box-shadow: 0 0 14px #a78bfa55; }
  25%     { border-color: #f43f5e; box-shadow: 0 0 28px #f43f5e99, 0 0 5px #fffc; }
  50%     { border-color: #38bdf8; box-shadow: 0 0 22px #38bdf888; }
  75%     { border-color: #4ade80; box-shadow: 0 0 18px #4ade8077; }
}
[data-family="drogas_sinteticas"]:hover .drug-card { animation: synthGlitch 2s steps(1) infinite, synthBorder 1.6s linear infinite; }
[data-family="drogas_sinteticas"]:hover .drug-card:nth-child(1) { animation-delay: 0s, 0s; }
[data-family="drogas_sinteticas"]:hover .drug-card:nth-child(2) { animation-delay: 0.2s, 0.3s; }
[data-family="drogas_sinteticas"]:hover .drug-card:nth-child(3) { animation-delay: 0.4s, 0.6s; }
[data-family="drogas_sinteticas"]:hover .drug-card:nth-child(4) { animation-delay: 0.6s, 0.9s; }
[data-family="drogas_sinteticas"]:hover .drug-card:nth-child(5) { animation-delay: 0.8s, 1.2s; }
[data-family="drogas_sinteticas"]:hover .drug-name { animation: synthGlitch 1.8s steps(1) infinite; color: #c4b5fd; }
[data-family="drogas_sinteticas"]:hover .family-title { color: #a78bfa !important; text-shadow: 0 0 20px #a78bfaaa; animation: synthGlitch 2.5s steps(1) infinite; }

/* ─── PLANTAS Y NATURALES — orgánico, ondas tierra ───────────────── */
@keyframes earthPulse {
  0%,100% { transform: scale(1) rotate(0deg); filter: saturate(1.2) hue-rotate(0deg); }
  33%     { transform: scale(1.008) rotate(0.3deg); filter: saturate(1.6) hue-rotate(10deg); }
  66%     { transform: scale(1.004) rotate(-0.2deg); filter: saturate(1.3) hue-rotate(-6deg); }
}
@keyframes earthBorder {
  0%,100% { border-color: #86efac55; box-shadow: 0 0 12px #16a34a33; }
  50%     { border-color: #fbbf2488; box-shadow: 0 0 22px #16a34a66, inset 0 0 18px #fbbf2411; }
}
[data-family="drogas_planta"]:hover { animation: earthPulse 5s ease-in-out infinite; position:relative; z-index:3; }
[data-family="drogas_planta"]:hover .drug-card { animation: earthBorder 3.5s ease-in-out infinite; }
[data-family="drogas_planta"]:hover .drug-card:nth-child(odd)  { animation-delay: 0s; }
[data-family="drogas_planta"]:hover .drug-card:nth-child(even) { animation-delay: 1.2s; }
[data-family="drogas_planta"]:hover .drug-name { color: #86efac; text-shadow: 0 0 8px #4ade8055; transition: all 0.5s; }
[data-family="drogas_planta"]:hover .family-title { color: #86efac !important; text-shadow: 0 0 16px #4ade8077; }

/* ─── HIPNÓTICOS — sueño profundo, fade, ralentización ───────────── */
@keyframes sleepFade { 0%,100% { filter: brightness(1) blur(0); transform: translateY(0); } 50% { filter: brightness(0.85) blur(0.6px); transform: translateY(3px); } }
@keyframes sleepBorder {
  0%,100% { border-color: #4a9eff33; box-shadow: 0 0 10px #1e3a5f44; }
  50%     { border-color: #1d4ed8; box-shadow: 0 0 28px #1d4ed877, inset 0 0 22px #1d4ed811; }
}
@keyframes sleepZzz { 0%,100% { opacity:0.9; } 50% { opacity:0.5; letter-spacing:0.03em; } }
[data-family="hipnoticos"]:hover { animation: sleepFade 5.5s ease-in-out infinite; position:relative; z-index:3; }
[data-family="hipnoticos"]:hover .drug-card { animation: sleepBorder 4.5s ease-in-out infinite; transition: all 1.2s ease !important; }
[data-family="hipnoticos"]:hover .drug-card:nth-child(odd)  { animation-delay: 0s; }
[data-family="hipnoticos"]:hover .drug-card:nth-child(even) { animation-delay: 1.8s; }
[data-family="hipnoticos"]:hover .drug-name { animation: sleepZzz 4.5s ease-in-out infinite; color: #93c5fd; }
[data-family="hipnoticos"]:hover .family-title { color: #60a5fa !important; text-shadow: 0 0 20px #1d4ed888; animation: sleepZzz 5.5s ease-in-out infinite; }

/* ─── NOOTRÓPICOS — foco láser, nitidez, pulso limpio ────────────── */
@keyframes focusPop { 0%,100% { transform: scale(1); filter: brightness(1) contrast(1); } 50% { transform: scale(1.012); filter: brightness(1.1) contrast(1.12); } }
@keyframes focusBorder {
  0%,100% { border-color: #34d39944; box-shadow: 0 0 8px #10b98133; }
  50%     { border-color: #6ee7b7; box-shadow: 0 0 20px #10b98177, 0 0 4px #fffa; }
}
[data-family="nootropicos"]:hover { animation: focusPop 1.8s ease-in-out infinite; position:relative; z-index:3; }
[data-family="nootropicos"]:hover .drug-card { animation: focusBorder 1.6s ease-in-out infinite; }
[data-family="nootropicos"]:hover .drug-card:nth-child(1) { animation-delay: 0s; }
[data-family="nootropicos"]:hover .drug-card:nth-child(2) { animation-delay: 0.15s; }
[data-family="nootropicos"]:hover .drug-card:nth-child(3) { animation-delay: 0.3s; }
[data-family="nootropicos"]:hover .drug-card:nth-child(4) { animation-delay: 0.45s; }
[data-family="nootropicos"]:hover .drug-name { color: #6ee7b7; text-shadow: 0 0 6px #10b98177; letter-spacing: 0.02em; transition: all 0.2s; }
[data-family="nootropicos"]:hover .family-title { color: #34d399 !important; text-shadow: 0 0 16px #10b98199; }


/* ─── MUSIC PLAYER — minimal collapsible ────────────────────────── */
/* ─── MUSIC PLAYER ───────────────────────────────────────────────── */
.music-wrap {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 9997;
  display: flex;
  align-items: center;
  gap: 0;
}
/* Botón ♪ — siempre visible, muy sutil */
.music-toggle-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(10,12,16,0.7);
  border: 1px solid rgba(45,212,192,0.18);
  color: rgba(45,212,192,0.55);
  font-size: 0.72rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  backdrop-filter: blur(8px);
  transition: border-color 0.25s, color 0.25s, background 0.25s;
  position: relative;
  z-index: 2;
}
.music-toggle-btn:hover {
  border-color: rgba(45,212,192,0.5);
  color: var(--accent-teal);
  background: rgba(45,212,192,0.08);
}
/* Pulso suave cuando hay música */
@keyframes noteFloat {
  0%,100% { box-shadow: 0 0 0 0 rgba(45,212,192,0); }
  50%     { box-shadow: 0 0 0 4px rgba(45,212,192,0.12); }
}
.music-wrap.playing .music-toggle-btn {
  animation: noteFloat 2.5s ease-in-out infinite;
  border-color: rgba(45,212,192,0.35);
  color: var(--accent-teal);
}
/* Panel que aparece/desaparece */
.music-panel {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  max-width: 0;
  opacity: 0;
  pointer-events: none;
  padding: 5px 0 5px 0;
  background: rgba(10,12,16,0.82);
  border: 1px solid transparent;
  border-left: none;
  border-radius: 0 16px 16px 0;
  backdrop-filter: blur(12px);
  white-space: nowrap;
  margin-left: -14px;
  padding-left: 0;
  transition: max-width 0.35s cubic-bezier(.4,0,.2,1),
              opacity 0.25s ease,
              padding 0.25s ease,
              border-color 0.25s ease;
}
.music-wrap.open .music-toggle-btn {
  border-radius: 50% 0 0 50%;
  border-right-color: transparent;
  border-color: rgba(45,212,192,0.2);
}
.music-wrap.open .music-panel {
  max-width: 200px;
  opacity: 1;
  pointer-events: all;
  padding: 5px 12px 5px 18px;
  border-color: rgba(45,212,192,0.2);
}
/* Controles internos */
.music-play-btn {
  background: none; border: none; cursor: pointer;
  color: rgba(45,212,192,0.75); font-size: 0.7rem;
  padding: 0; line-height: 1; flex-shrink: 0;
  transition: color 0.15s, transform 0.15s;
}
.music-play-btn:hover { color: var(--accent-teal); transform: scale(1.15); }
.music-equalizer {
  display: flex; align-items: flex-end;
  gap: 2px; height: 11px; flex-shrink: 0;
}
.eq-bar {
  width: 2px; border-radius: 1px;
  background: var(--accent-teal); opacity: 0.45;
  animation: eqBounce 0.6s ease-in-out infinite alternate;
}
.eq-bar:nth-child(1) { height: 4px;  animation-duration: 0.5s; }
.eq-bar:nth-child(2) { height: 8px;  animation-duration: 0.7s; }
.eq-bar:nth-child(3) { height: 5px;  animation-duration: 0.4s; }
.music-wrap.paused .eq-bar { animation-play-state: paused; }
@keyframes eqBounce { from { transform: scaleY(0.2); } to { transform: scaleY(1); } }
.music-vol-wrap { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.music-mute-btn {
  background: none; border: none; cursor: pointer;
  font-size: 0.65rem; padding: 0; line-height: 1;
  opacity: 0.55; transition: opacity 0.15s;
}
.music-mute-btn:hover { opacity: 1; }
.music-vol-slider {
  -webkit-appearance: none; appearance: none;
  width: 46px; height: 2px; border-radius: 2px;
  background: rgba(255,255,255,0.1); outline: none; cursor: pointer;
}
.music-vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(45,212,192,0.8); cursor: pointer;
}


/* ─── FAMILY SECTIONS HOVER FADE ────────────────────────────────── */
#content:hover .family-section {
  opacity: 0.45;
  filter: brightness(0.75) blur(0.5px);
  transition: opacity 0.28s ease, filter 0.28s ease, transform 0.28s ease;
}
#content:hover .family-section:hover {
  opacity: 1;
  filter: brightness(1) blur(0);
  transform: scale(1.005);
  z-index: 2;
  position: relative;
}
.family-section {
  transition: opacity 0.28s ease, filter 0.28s ease, transform 0.28s ease;
}


/* ─── SIDEBAR CATEGORY PIXEL ICONS ──────────────────────────────── */
.sidebar-cat-pixel {
  width: 28px;
  height: 28px;
  object-fit: contain;
  image-rendering: pixelated;

  flex-shrink: 0;

.family-item-all-icon {
  width: 22px;
  height: 22px;
  object-fit: contain;
  image-rendering: pixelated;
  flex-shrink: 0;
  opacity: 0.85;
  transition: transform 0.2s;
}
.family-item:hover .family-item-all-icon { transform: scale(1.15); }


/* ─── SITE LOGO (smile derretido) ───────────────────────────────── */
#site-logo {
  width: 38px;
  height: 38px;
  object-fit: contain;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  vertical-align: middle;
  margin-right: 8px;
  margin-bottom: 2px;
  filter: drop-shadow(0 0 8px rgba(45,212,192,0.4));

h1:hover #site-logo {
  transform: rotate(-12deg) scale(1.15);

/* ─── LANGUAGE SELECTOR ─────────────────────────────────────────── */
.lang-selector {
  position: fixed;
  top: 16px;
  right: 20px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(13,17,23,0.82);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 4px 6px;
  backdrop-filter: blur(10px);

}
.lang-selector:hover { border-color: rgba(45,212,192,0.3); }
.lang-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 0.62rem;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  padding: 3px 8px;
  border-radius: 14px;
  transition: background 0.18s, color 0.18s;
